var FINDINGS = [{"g":"Will To Sell","items":[{"n":"Desire","d":"How badly an individual wants to achieve greater success in sales."},{"n":"Commitment","d":"The willingness to do, ethically, whatever it takes to achieve greater success in sales."},{"n":"Responsibility","d":"Excuse-making. Whether or not someone takes responsibility for their results and the excuses they make."},{"n":"Outlook","d":"How an individual feels about themselves, the work they're doing, the company they're working for and the people they're working with."},{"n":"Motivation","d":"The ‘what’ that fuels desire to achieve greater success in sales."}]},{"g":"Sales DNA","items":[{"n":"Doesn’t Need Approval","d":"In other words, ‘doesn’t need to be liked.’"},{"n":"Stays In The Moment","d":"Ability to remain in the ‘right here’ and ‘right now’ even when under pressure."},{"n":"Comfortable Discussing Money","d":"How comfortable an individual is digging in and asking the tough questions about money."},{"n":"Supportive Buy Cycle","d":"How a salesperson goes about the process of making a major purchase for themselves."},{"n":"Supportive Beliefs","d":"Specific beliefs that support success in sales."}]},{"g":"Tactical","items":[{"n":"Handles Rejection","d":"Whether a salesperson fears being rejected."},{"n":"Hunting","d":"The ability to find new business or opportunities."},{"n":"Relationship Building","d":"The ability to quickly build, develop and maintain relationships with customers."},{"n":"Reaching Decision Makers","d":"The ability to reach and meet with the actual decision-makers."},{"n":"Consultative Selling","d":"The ability to ask the right amount and right type of questions to uncover compelling reasons to buy."},{"n":"Value Selling","d":"The ability to sell value instead of price."},{"n":"Qualifying","d":"The ability to fully and thoroughly qualify an opportunity."},{"n":"Presentation Approach","d":"The ability to present the right ideas to the right people at the right time for the right reasons."},{"n":"Closing","d":"The ability to get commitments and decisions when an opportunity becomes closable."},{"n":"Sales Process","d":"Having and following a sales process that leads to a predictive and consistent outcome."},{"n":"Sales Technology","d":"The ability and willingness to successfully adapt sales technology into their process."}]},{"g":"Management Tactical","items":[{"n":"Coaching","d":"Measures a sales manager’s ability to coach their team, combining management skills with strong sales expertise to model and coach effective selling practices."},{"n":"Motivating","d":"Measures sales manager's ability to understand what motivates their salespeople and how they can keep them motivated."},{"n":"Accountability","d":"Measures if a manager holds their salespeople accountable to measurable, forward-looking metrics."},{"n":"Recruiting","d":"Measures a sales manager's abilities to interview and select salespeople who will positively contribute to the organization."},{"n":"Pipeline Management","d":"Measures how thoroughly and effectively a sales manager will manage the pipeline and coach from the pipeline."},{"n":"Team-Focused","d":"Measures whether a sales manager focuses on the team rather than themself, meaning they will give the team credit when it succeeds and take responsibility when it fails."}]},{"g":"Other","items":[{"n":"Sales Posturing","d":"Measures an individual’s ability to make positive first impressions, differentiate themselves, and be memorable."},{"n":"Negotiating","d":"Measures an individual’s ability to effectively negotiate terms, prices, and conditions throughout the sales process."},{"n":"Building Trust","d":"Measures whether an individual is seen as trustworthy by their customers and prospects."},{"n":"Account Management","d":"Measures an individual's ability to manage, maintain, and grow multiple assigned accounts."},{"n":"Farming","d":"Measures an individual's ability to grow a small number of key accounts."},{"n":"Working Remotely","d":"Measures an individual's ability to effectively work remotely without close supervision."},{"n":"Compatibility","d":"Compares a company's role-specific requirements to the areas of selling that a salesperson indicates are comfortable."},{"n":"Alignment","d":"Compares a manager's personal strategies to the company's strategies."}]}];

function findingsView(r){
  var body = FINDINGS.map(function(g){
    return '<div class="fgroup" data-g="' + esc(g.g) + '">' +
      '<p class="fglabel">' + esc(g.g) + '</p>' +
      g.items.map(function(it){
        var slug = compSlug(it.n);
        var name = slug
          ? '<a href="#' + r.key + '/findings/' + slug + (compAnchor(it.n) !== null ? "/" + compAnchor(it.n) : "") + '">' + esc(it.n) + '</a>'
          : esc(it.n);
        return '<div class="frow" data-k="' + esc((g.g + " " + it.n + " " + it.d).toLowerCase()) + '">' +
               '<div class="fn">' + name + '</div>' +
               '<div class="fd">' + esc(it.d) + '</div></div>';
      }).join("") + '</div>';
  }).join("");

  return panel(
    '<input class="ffilter" id="f-filter" type="text" autocomplete="off" ' +
      'placeholder="Filter competencies">' +
    '<p class="fnone" id="f-none" hidden>No competency matches that.</p>' +
    body
  );
}

function wireFindings(){
  var box = document.getElementById("f-filter");
  var none = document.getElementById("f-none");
  if(!box) return;
  box.addEventListener("input", function(){
    var q = box.value.trim().toLowerCase(), hits = 0;
    Array.prototype.forEach.call(document.querySelectorAll(".fgroup"), function(g){
      var shown = 0;
      Array.prototype.forEach.call(g.querySelectorAll(".frow"), function(row){
        var on = !q || row.getAttribute("data-k").indexOf(q) !== -1;
        row.hidden = !on;
        if(on){ shown++; hits++; }
      });
      g.hidden = (shown === 0);
    });
    none.hidden = (hits > 0);
  });
}

var COMP = {"articles":{"hunting":{"competency":"Hunting","title":"Findings Reference: Hunting Competency","intro":["The Hunting Competency tells us about the individual’s ability to prospect for new business. It looks at components such as whether the individual will make cold calls, the Sales DNA that might get in the way of getting started or continuing making cold calls, and their ability to reach a decision maker and fill their pipeline."],"components":["Will Prospect","Prospects Consistently","Prospects via Phone and / or Walk-ins","Has No Need for Approval","Schedules Meetings","Recovers from Rejection","Maintains Full Pipeline","Not a Perfectionist or it Does Not Prevent Prospecting","Believes They Are Quickly Liked by Customers","Reaches Target Prospect","Gets Referrals from Customers / Network","Uses Social Selling Tools","Attends Networking Events"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Will Prospect","desc":"This finding reflects whether an individual is likely to rely on cold calling when needing to find new customers.","alsoFoundIn":["Strengths - Will Prospect"],"opposite":["Account Management Competency - Will Focus on Current Accounts Rather than Looking for New Accounts","Farming Competency - Unlikely to be Distracted by New Accounts"]},{"name":"Prospects Consistently","desc":"This finding reflects whether the individual prospects on a daily basis, the individual says their boss would say they prospect regularly, and/or makes cold calls regularly.","alsoFoundIn":["Skills - Prospects Consistently"]},{"name":"Prospects via Phone and / or Walk-ins","desc":"This finding reflects whether the individual makes cold calls via phone and/or walk-ins.","alsoFoundIn":["Skills - Prospects via Phone and / or Walk-ins"]},{"name":"Has No Need for Approval","desc":"This finding shows to what degree the individual needs to be liked or (in s delayed past opportunities.","alsoFoundIn":["Strengths - Not a Perfectionist or it Does Not Prevent Prospecting"]},{"name":"Believes They Are Quickly Liked by Customers","desc":"This finding reflects whether this individual feels prospects tend to quickly  like him/her, how quickly this individual develops rapport, and/or whether this individual is known for being well-liked or loved by customers.","alsoFoundIn":["Building Trust Competency - Believes They Are Quickly Liked by Customers","Farming Competency - Believes They Are Quickly Liked by Customers"]},{"name":"Reaches Target Prospect","desc":"This finding reflects whether the individual is generally able to reach prospects, or if they find themselves blocked by operators, assistants, etc.","alsoFoundIn":["Skills - Reaches Target Prospect"]},{"name":"Gets Referrals from Customers / Network","desc":"This finding reflects whether the individual regularly receives referrals and introductions from their customers.","alsoFoundIn":["Relationship Building - Relationships Generate New Business"]},{"name":"Uses Social Selling Tools","desc":"This finding will be strong if the Mastery of Social Selling Competency has a score of 67% or higher."},{"name":"Attends Networking Events","desc":"This finding reflects whether the individual attends networking or targeted events to get leads.  If the finding is negative, the individual either avoids such events or is unable to generate leads from them.","alsoFoundIn":["Strengths - Attends Networking Events"]}]},"relationship-building":{"competency":"Relationship Building","title":"Findings Reference: Relationship Building Competency","intro":["The Relationship Building Competency shows how effective a salesperson is at developing relationships -- more than just finding common ground, but truly developing a relationship. It is important that relationships gets developed quickly to sell consultatively."],"components":["Quickly Develops Rapport","Relationship Is Key Factor in Winning Business","Relationships Generate New Business","Develops Strong Relationships over Time","Customers Follow to New Companies","Believes That Making Friends Is Single Greatest Asset","Extroversion Supports Relationship Building"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Business Development Evaluation"],"findings":[{"name":"Quickly Develops Rapport","desc":"This finding reflects whether an individual is generally able to build rapport on their first call or meeting.","alsoFoundIn":["Skills - Quickly Develops Rapport","Selling Value Competency - Quickly Develops Rapport","Sales Posturing Competency - Quickly Develops Rapport","Building Trust Competency - Quickly Builds Rapport"]},{"name":"Relationship Is Key Factor in Winning Business","desc":"When this finding is positive, it means that the individual indicated that the best description of their sales approach/process is that the relationship is the key factor in getting/maintaining/growing business.  This would mean that the individual chose this option over other more typical sales approaches/processes, including a consultative approach, which means a strength in this finding means that the individual is not following a milestone-centric sales process.  However, as it pertains purely to relationship building, a relationship-based sales process is supportive of successful relationship building.","alsoFoundIn":["Strengths - Relationship is Key Factor in Winning Business"]},{"name":"Relationships Generate New Business","desc":"This finding reflects whether the individual regularly receives referrals and introductions from their customers.","alsoFoundIn":["Hunting - Gets Referrals from Customers / Network"]},{"name":"Develops Strong Relationships over Time","desc":"If this finding is positive, it means the individual is able to develop strong rapport and has ongoing interactions with customers (following to a new company, being asked for by name, becoming friends, remaining friends over time, and/or being invited to social events) that are indicative of strong long-term relationships.","alsoFoundIn":["Skills - Develops Strong Relationships over Time"]},{"name":"Customers Follow to New Companies","desc":"This finding indicates whether customers tend to follow the individual to new companies if they change jobs.  From the standpoint of relationship building, this is considered a positive.  Of course, this needs to be balanced with the potential liability of having an employee who customers would follow if he/she were to leave.","alsoFoundIn":["Skills - Customers Follow to New Companies"]},{"name":"Believes That Making Friends Is Single Greatest Asset","desc":"This finding indicates that the individual feels that making friends with prospects/customers is the single most important thing they do."},{"name":"Extroversion Supports Relationship Building","desc":"This finding reflects whether the individual self-identifies as an extrovert, as opposed to an introvert, ambivert, or being unsure.  While it is not absolutely necessary for someone to be an extrovert in order to build relationships, being an extrovert does support relationship building.","alsoFoundIn":["Strength - Extroversion Supports Relationship Building"]}]},"value-selling":{"competency":"Value Selling","title":"Findings Reference: Selling Value Competency","intro":["This competency is a measure of how effectively an individual is able to sell value as opposed to sell based on price, maximize margins instead of discounts, and compete against the competition which might have a lower price without giving up on your price."],"components":["Focused on Value over Price","Will Discuss Finances","High Threshold for Money","Attempts to Sell Value","Sales Process Supports Selling Value","Learns Why Prospects Will Buy","Doesn't Need Approval","Asks Great Questions","Asks Enough Questions","Avoids Making Assumptions","Quickly Develops Rapport","Not Compelled to Quote"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Focused on Value over Price","desc":"Someone who is weak in this finding is a \"price shopper\", and in their own buying practices tends to place a lot of importance on finding the best price.  People who tend to shop based on price rather than value in their personal lives tend to be accepting or understanding of prospects or customers who also want to make sure they are getting the best price.","alsoFoundIn":["Strengths - Focused on Value over Price","Sales DNA - Buy Cycle - 1 of 5 components"]},{"name":"Will Discuss Finances","desc":"Note: before October 2021, this attribute was called \"Comfortable Discussing Money\"\n\nThis finding reflects whether the individual has the ability to talk about money with a great deal of ease. Individuals with a weakness in this finding don't think of talking about money as a normal part of selling, and may feel that talking about money is too invasive.","alsoFoundIn":["Strengths - Will Discuss Finances","Qualifying Competency - Will Discuss Finances","Negotiating Competency - Will Discuss Finances"]},{"name":"High Threshold for Money","desc":"This finding reflects how this individual is likely to respond to the customer's objections to something costing a lot of money, based on how the individual tends to think about money personally.","alsoFoundIn":["Strengths - High Threshold for Money","Sales DNA - Buy Cycle - 1 of 5 components","Qualifying Competency - Handles High-Ticket Pricing OK","Farming Competency - Handles \"It's a Lot of Money\" Objection"]},{"name":"Attempts to Sell Value","desc":"This finding reflects how the individual responds to a prospect or customer asking for a lower price.  A positive finding indicates that the individual will sell value or hold firm.  A negative finding indicates that the individual will either give in or negotiate."},{"name":"Sales Process Supports Selling Value","desc":"We asked this individual to select from a list of different possible sales processes the one that they most identify with and have had the most success with.  This finding indicates whether the sales process they selected has key milestones.","alsoFoundIn":["Sales Process Competency - Process Has Most Key Milestones"]},{"name":"Learns Why Prospects Will Buy","desc":"A strength in this finding indicates that the individual listens and learns why their customer/prospect will make a purchase, and that the reasons for buying are truly compelling for the customer/prospect.  A weakness in this finding indicates that the individual might make assumptions about why the prospect/customer would buy, tell the prospect/customer why they should buy, or find reasons that aren't truly compelling.","alsoFoundIn":["Skills - Uncovers Reasons to Buy","Consultative Selling Competency - Uncovers Reasons to Buy + Reasons to Buy are Compelling","Qualifying Competency - Knows Why They Would Buy","Coaching Competency (Sales Management) - Uncovers Compelling Reasons to Buy"]},{"name":"Doesn't Need Approval","desc":"This finding shows to what degree the individual needs to be liked or (in severe cases) loved.  When an individual needs to be liked, they will have more trouble asking lots of questions or tough questions and having the difficult conversation that no one else has had, which will impede their ability to hunt for new business.","alsoFoundIn":["Strengths - Does Not Need to be Liked","Sales DNA - Doesn't Need Approval","Hunting Competency - Has No Need for Approval","Consultative Selling Competency - Able to Ask Tough Questions","Qualifying Competency - Need to Be Liked Doesn't Get in the Way","Closing Competency - Isn't Hoping to be Liked","Negotiating Competency - Doesn't Need to be Liked","Reaching Decision-Makers Competency - Does Not Need to be Liked"],"opposite":["Account Management Competency - Won't Alienate People"]},{"name":"Asks Great Questions","desc":"This finding checks for a number of aspects indicative of asking great questions, including the importance the individual places on asking questions, how the individual responds to objections, how to-the-point versus threatening questions are, whether questions determine why the customer/prospect will buy, and whether questions address how the customer/prospect will buy.","alsoFoundIn":["Skills - Asks Great Questions","Consultative Selling Competency - Asks Great Questions"]},{"name":"Asks Enough Questions","desc":"This finding indicates whether the individual understands the importance of not dominating the conversation on sales calls, by frequently asking questions.","alsoFoundIn":["Skills - Asks Enough Questions","Consultative Selling Competency - Asks Enough Questions","Presentation Approach and Context Competency - Asks Enough Questions","Accountability Competency (Sales Management) - Asks Enough Questions","Coaching Competency (Sales Management) - Asks Enough Questions","Recruiting Competency (Sales Management) - Great Interviewing Skills"]},{"name":"Avoids Making Assumptions","desc":"This finding reflects whether the individual relies on factual information during sales calls, as opposed to making assumptions or going on hunches.","alsoFoundIn":["Skills - Takes Nothing For Granted","Consultative Selling Competency - Takes Nothing for Granted","Selling Value Competency - Avoids Making Assumptions","Qualifying Competency - Asks about Everything","Presentation Approach and Context Competency - Takes Nothing for Granted"]},{"name":"Quickly Develops Rapport","desc":"This finding reflects whether an individually is generally able to build rapport on their first call or meeting.","alsoFoundIn":["Skills - Quickly Develops Rapport","Relationship Building Competency - Quickly Develops Rapport","Sales Posturing Competency - Quickly Develops Rapport","Building Trust Competency - Quickly Builds Rapport"]},{"name":"Not Compelled to Quote","desc":"This finding reflects the mindset this individual has regarding creating quotes and proposals.  A positive finding indicates that they only create quotes or proposals if they know they are going to win the business.","alsoFoundIn":["Skills - Won't Make Inappropriate Quotes","Closing Competency - Won't Make Inappropriate Quotes"]}]},"qualifying":{"competency":"Qualifying","title":"Findings Reference: Qualifying Competency","intro":["The Qualifying Competency shows how thoroughly an individual qualifies opportunities. The score will reflect how well, how often, and how effectively the individual is qualifying. Properly qualifying opportunities has a tremendous impact on the accuracy of a company's pipeline and forecast."],"components":["Meets with Decision Maker","Uncovers Actual Budget","Will Discuss Finances","Knows Decision-Making Process","Can Influence the Decision-Making Process","Handles High-Ticket Pricing OK","Need to Be Liked Doesn't Get in the Way","Able to Stay in the Moment","Self-Limiting Beliefs Won't be an Obstacle","Knows Why They Would Buy","Asks about Everything","Not Vulnerable to Competition"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Meets with Decision Maker","desc":"This finding will be strong if the Reaching Decision-Makers Competency has a score of 67% or higher.","alsoFoundIn":["Closing Competency - Will Meet with the Decision Maker","Account Management Competency - Will Meet/Talk with Decision Makers"]},{"name":"Uncovers Actual Budget","desc":"Reflects whether the individual usually knows how much money prospects are able to spend before closing.","alsoFoundIn":["Skill - Uncovers Actual Budget","Account Management Competency - Will Know the Real Budgets"]},{"name":"Will Discuss Finances","desc":"This finding reflects whether the individual has the ability to talk about money with a great deal of ease.  Individuals with a weakness in this finding don't think of talking about money as a normal part of selling, and may feel that talking about money is too invasive.","alsoFoundIn":["Strengths - Will Discuss Finances","Selling Value Competency - Will Discuss Finances","Negotiating Competency - Will Discuss Finances"]},{"name":"Knows Decision-Making Process","desc":"This finding reflects whether the individual is successful in getting prospects to disclose the process they will use to decide whether to buy from them.","alsoFoundIn":["Skills - Understands How Prospects Will Buy","Consultative Selling Competency - Understands How Prospects Will Buy","Coaching Competency (Sales Management) - Knows How People Buy"]},{"name":"Can Influence the Decision-Making Process","desc":"This finding reflects whether the individual tends to suggest and effect changes to a prospect's decision-making process when it is overly complex, unfavorable, and impeding an opportunity.","alsoFoundIn":["Skills - Can Influence the Decision-Making Process"]},{"name":"Handles High-Ticket Pricing OK","desc":"This finding reflects how this individual is likely to respond to the customer's objections to something costing a lot of money, based on how the individual tends to think about money personally.","alsoFoundIn":["Strengths - High Threshold for Money","Sales DNA - Buy Cycle - 1 of 5 components","Selling Value Competency - High Threshold for Money","Farming Competency - Handles \"It's a Lot of Money\" Objection"]},{"name":"Need to Be Liked Doesn't Get in the Way","desc":"This finding shows to what degree the individual needs to be liked or (in severe cases) loved.  When an individual needs to be liked, they will have more trouble asking lots of questions or tough questions and having the difficult conversation that no one else has had, which will impede their ability to hunt for new business.","alsoFoundIn":["Strength - Does Not Need to be Liked","Sales DNA - Doesn't Need Approval","Hunting Competency - Has No Need for Approval","Consultative Selling Competency - Able to Ask Tough Questions","Selling Value Competency - Doesn't Need Approval","Closing Competency - Isn't Hoping to be Liked","Negotiating Competency - Doesn't Need to be Liked","Reaching Decision-Makers Competency - Does Not Need to be Liked"],"opposite":["Account Management Competency - Won't Alienate People"]},{"name":"Able to Stay in the Moment","desc":"This finding reflects the individual's ability to stay in the moment and be focused on the now, instead of becoming emotional and worrying about what already has happened or what is going to happen.","alsoFoundIn":["Strength - Able to Stay in the Moment","Sales DNA - Stays in the Moment","Consultative Selling Competency - Able to Stay in the Moment","Closing Competency - Will Stay in the Moment at Closing Time","Negotiating Competency - Able to Stay in the Moment","Farming Competency - Won't Panic Over Objections","Coaching Competency (Sales Management) - Able to Stay in the Moment"]},{"name":"Self-Limiting Beliefs Won't be an Obstacle","desc":"This finding indicates whether the individual's Supportive Beliefs Competency is in the strong scoring range.","alsoFoundIn":["Sales DNA - Supportive Beliefs"]},{"name":"Knows Why They Would Buy","desc":"A strength in this finding indicates that the individual listens and learns why their customer/prospect will make a purchase, and that the reasons for buying are truly compelling for the customer/prospect.  A weakness in this finding indicates that the individual might make assumptions about why the prospect/customer would buy, tell the prospect/customer why they should buy, or find reasons that aren't truly compelling.","alsoFoundIn":["Skills - Uncovers Reasons to Buy","Consultative Selling Competency - Uncovers Reasons to Buy + Reasons to Buy are Compelling","Selling Value Competency - Learns Why Prospects Will Buy","Coaching Competency (Sales Management) - Uncovers Compelling Reasons to Buy"]},{"name":"Asks about Everything","desc":"This finding reflects whether the individual relies on factual information during sales calls, as opposed to making assumptions or going on hunches.","alsoFoundIn":["Skills - Takes Nothing For Granted","Consultative Selling Competency - Takes Nothing for Granted","Selling Value Competency - Avoids Making Assumptions","Presentation Approach and Context Competency - Takes Nothing for Granted"]},{"name":"Not Vulnerable to Competition","desc":"Someone who is weak in this finding is a comparison shopper, and tends to shop at several stores for major purchases.  The danger with a comparison shopper is that he or she is likely to allow prospects to behave similarly, as they will be sympathetic to the prospect's desire to \"shop around\".","alsoFoundIn":["Strengths - Not Vulnerable to Competition","Sales DNA - Buy Cycle - 1 of 5 components"]}]},"presentation-approach":{"competency":"Presentation Approach","title":"Findings Reference: Presentation Approach and Context Competency","intro":["This competency does NOT measure a salesperson's presentation skills, but rather measures whether presentations are occurring at the right time, to the right people, and for the right reasons. It's important for salespeople to not be overly presentation-minded or rely too heavily on presentations."],"components":["Emphasizes Listening over Talking","Able to Minimize Talking about Company Products or Solutions","Not Compelled to Present","Not Overly Reliant on Educating and Presenting","Does Not Believe Presenting Equates to Controlling the Sales Process","Does Not Believe Making A Proposal is the Most Important Part of the Sales Process","Not Compelled to Propose or Quote","Asks Enough Questions","Takes Nothing for Granted"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Emphasizes Listening over Talking","desc":"A weakness in this finding indicates that the individual is typically doing more than half of the talking on sales calls.","alsoFoundIn":["Sales DNA - Stays in the Moment - 1 of 9 components","Strengths - Emphasizes Listening over Talking"]},{"name":"Able to Minimize Talking about Company Products or Solutions","desc":"This finding reflects whether individuals spend most of their time asking questions, as opposed to talking about their company, products, services, and/or solutions.","alsoFoundIn":["Strengths - Able to Minimize Talking about Company Products or Solutions"]},{"name":"Not Compelled to Present","desc":"This finding reflects whether the individual feels making a presentation is the most important thing to do before attempting to close an opportunity, as opposed to reviewing needs or getting the prospect to agree to make a decision.","alsoFoundIn":["Strengths - Not Compelled to Present","Self-Limiting Beliefs - I need to make presentations"]},{"name":"Not Overly Reliant on Educating and Presenting","desc":"A weakness in this finding indicates that the individual feels that educating and presenting is their greatest asset or the single most important thing they do.","alsoFoundIn":["Strengths - Not Overly Reliant on Educating and Presenting"]},{"name":"Does Not Believe Presenting Equates to Controlling the Sales Process","desc":"A weakness in this finding indicates that the individual only feels in control of the selling process when he/she is presenting.","alsoFoundIn":["Strengths - Does Not Believe Presenting Equates to Controlling the Sales Process"]},{"name":"Does Not Believe Making A Proposal is the Most Important Part of the Sales Process","desc":"A weakness in this finding indicates that the individual feels making a proposal is more important to winning an opportunity than asking questions, uncovering the budget, or getting a commitment.","alsoFoundIn":["Strengths - Does Not Believe Making A Proposal is the Most Important Part of the Sales Process"]},{"name":"Not Compelled to Propose or Quote","desc":"This finding reflects whether the individual views proposals/quotes as either unnecessary or acceptable if they expect to win the opportunity.","alsoFoundIn":["Strengths - Not Compelled to Propose or Quote","Self-Limiting Beliefs - I need to provide proposals (or quotes)"]},{"name":"Asks Enough Questions","desc":"This finding indicates whether the individual understands the importance of not dominating the conversation on sales calls, by frequently asking questions.","alsoFoundIn":["Skills - Asks Enough Questions","Consultative Selling Competency - Asks Enough Questions","Selling Value Competency - Asks Enough Questions","Accountability Competency (Sales Management) - Asks Enough Questions","Coaching Competency (Sales Management) - Asks Enough Questions","Recruiting Competency (Sales Management) - Great Interviewing Skills"]},{"name":"Takes Nothing for Granted","desc":"This finding reflects whether the individual relies on factual information during sales calls, as opposed to making assumptions or going on hunches.","alsoFoundIn":["Skills - Takes Nothing For Granted","Consultative Selling Competency - Take Nothing for Granted","Selling Value Competency - Avoids Making Assumptions","Qualifying Competency - Asks about Everything"]}]},"closing":{"competency":"Closing","title":"Findings Reference: Closing Competency","intro":["This competency measures how effective the individual is at closing business. Most salespeople (even the great ones) have a fairly low score in this competency, because if a salesperson excels at Consultative Selling, Qualifying, and Sales Posturing, then closing is essentially a non-event and essentially takes care of itself. However, when a salesperson isn't very good at taking care of the business that happens prior to closing, then all the pressure is on them at closing time and the score in this competency becomes more important."],"components":["Gets Prospect to Agree to Make a Decision","Not Likely to Take \"Think it Overs\"","Unlikely to be Derailed by Put-Offs","Manages Appropriate Amount of Patience","Closing Urgency","Sales Assertiveness","Won't Make Inappropriate Quotes","Problem Solver","Reaching Decision-Makers","Doesn't Need Approval","Stays in the Moment","Will Find a Way to Close","Seeks Win/win"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Gets Prospect to Agree to Make a Decision","desc":"This is the most important attribute in the Closing Competency, and reflects whether the individual gets the prospect or customer to agree to make a decision before trying to close.","alsoFoundIn":["Skills - Gets Prospects to Agree to Make a Decision","Coaching Competency (Sales Management) - Effective at Getting Commitments"]},{"name":"Not Likely to Take \"Think it Overs\"","desc":"If this finding is negative, it indicates that the individual tends to think over purchases.  Individuals who behave this way are likely to understand and allow their prospects or customers to behave similarly, which will delay closings.  This finding is the most important component of Buy Cycle in Sales DNA.","alsoFoundIn":["Strengths - Not Likely to Take \"Think It Overs\"","Sales DNA - Buy Cycle - 1 of 5 components","Recruiting Competency (Sales Management) - Good Decision Maker"]},{"name":"Unlikely to be Derailed by Put-Offs","desc":"This finding reflects whether the individual will avoid put offs both when trying to schedule meetings / appointments and when trying to close an opportunity.","alsoFoundIn":["Skill - Unlikely to be Derailed by Put-Offs","Farming Competency - Won't Accept Put-Offs"]},{"name":"Manages Appropriate Amount of Patience","desc":"We measure patience on a spectrum from “Too Impatient” on one end to “Too Patient” on the other end.  Too much impatience can come across rude to a prospect and frustrate them.  Too much patience can delay closing.  An ideal score, representing an appropriate amount of patience, is in the middle of that spectrum, where an individual is neither too impatient nor too patient.","alsoFoundIn":["Strengths - Manages Appropriate Amount of Patience","Consultative Selling Competency - Manages Appropriate Amount of Patience","Sales Posturing Competency - Appropriate Amount of Patience","Negotiating Competency - Manages Appropriate Amount of Patience"]},{"name":"Closing Urgency","desc":"This finding reflects whether the individual has strong closing urgency.  This finding is strong when an individual pushes back strongly against being asked to call back / follow up later.","alsoFoundIn":["Strength - Closing Urgency","Closing Competency - Closing Urgency","Farming Competency - Has Closing Urgency"],"opposite":["Account Management Competency - Won't Feel Urgency to Close Business"]},{"name":"Sales Assertiveness","desc":"Sales Assertiveness measures the ability to confidently and professionally engage with prospective customers in a way that earns their trust and respect. It involves persistently pursuing opportunities and asking insightful questions to uncover needs. Assertive sales professionals are problem-solvers who handle confrontation tactfully and are able to maintain empathy and control while navigating the complexities of the sales process.","alsoFoundIn":["Strengths - Sales Assertiveness"]},{"name":"Won't Make Inappropriate Quotes","desc":"This finding reflects the mindset this individual has regarding creating quotes and proposals.  A positive finding indicates that they only create quotes or proposals if they know they are going to win the business.","alsoFoundIn":["Skills - Won't Make Inappropriate Quotes","Selling Value Competency - Not Compelled to Quote"]},{"name":"Problem Solver","desc":"A positive finding indicates that a person tends to focus on problems or think of solutions. A negative finding indicates that a person worries about problems or get consumed by them.","alsoFoundIn":["Strengths - Is a Problem Solver","Negotiating Competency - Problem Solver"]},{"name":"Reaching Decision-Makers","desc":"This finding will be strong if the Reaching Decision-Makers Competency has a score of 67% or higher.","alsoFoundIn":["Qualifying Competency - Meets with Decision Maker","Account Management Competency - Will Meet/Talk with Decision Makers"]},{"name":"Doesn't Need Approval","desc":"This finding shows to what degree the individual needs to be liked or (in severe cases) loved.  When an individual needs to be liked, they will have more trouble asking lots of questions or tough questions and having the difficult conversation that no one else has had, which will impede their ability to hunt for new business.","alsoFoundIn":["Strength - Does Not Need to be Liked","Sales DNA - Doesn't Need Approval","Hunting Competency - Has No Need for Approval","Consultative Selling Competency - Able to Ask Tough Questions","Selling Value Competency - Doesn't Need Approval","Qualifying Competency - Need to Be Liked Doesn't Get in the Way","Negotiating Competency - Doesn't Need to be Liked","Reaching Decision-Makers Competency - Does Not Need to be Liked"],"opposite":["Account Management Competency - Won't Alienate People"]},{"name":"Stays in the Moment","desc":"This finding reflects the individual's ability to stay in the moment and be focused on the now, instead of becoming emotional and worrying about what already has happened or what is going to happen.","alsoFoundIn":["Strength - Able to Stay in the Moment","Sales DNA - Stays in the Moment","Consultative Selling Competency - Able to Stay in the Moment","Closing Competency - Will Stay in the Moment at Closing Time","Negotiating Competency - Able to Stay in the Moment","Farming Competency - Won't Panic Over Objections","Coaching Competency (Sales Management) - Able to Stay in the Moment"]},{"name":"Will Find a Way to Close","desc":"This finding reflects whether the individual places tremendous importance on getting a prospect to agree to make a decision, and consistently gets the prospect to agree to make a decision before trying to close.","alsoFoundIn":["Skill - Will Find a Way to Close","Farming Competency - Attempts to Close"]},{"name":"Seeks Win/Win","desc":"This finding reflects whether an individual tends to find \"win/win\" outcomes while negotiating, where both the company and the prospect/customer get something they want.","alsoFoundIn":["Negotiating Competency - Seeks Win/Win"]}]},"sales-process":{"competency":"Sales Process","title":"Findings Reference: Sales Process Competency","intro":["This competency measures an individual's ability to follow the stages, steps, and milestones of a sales process, in the proper sequence."],"components":["Follows Stages and Steps","Process Has Most Key Milestones","Process Has Adequate Sequence","Consistent and Effective Results","Little Wasted Time","Has and/or Follows an Effective Sales Process","Uses an Effective Approach","Relationship-Based","CRM Savvy","Strategic Use of Sales Scorecard"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment"],"findings":[{"name":"Follows Stages and Steps","desc":"We asked this individual to select from a list of different possible sales processes the one that they most identify with and have had the most success with. This finding indicates whether the sales process they select has discrete stages or steps."},{"name":"Process Has Most Key Milestones","desc":"We asked this individual to select from a list of different possible sales processes the one that they most identify with and have had the most success with. This finding indicates whether the sales process they selected has key milestones.","alsoFoundIn":["Selling Value Competency - Sales Process Supports Selling Value"]},{"name":"Process Has Adequate Sequence","desc":"We asked this individual to select from a list of different possible sales processes the one that they most identify with and have had the most success with. This finding indicates whether the sales process they selected has a proper sequence of activities, as opposed to the activities being out-of-order."},{"name":"Consistent and Effective Results","desc":"This finding reflects whether the individual indicated that his/her sales process usually produces consistent and effective results."},{"name":"Little Wasted Time","desc":"This finding reflects whether individuals minimize time spent with prospects who don't do business with them. Spending a lot of time with prospects who don't end up buying can be a symptom of having a poor sales process.","alsoFoundIn":["Skills - Little Wasted Time"]},{"name":"Has and/or Follows an Effective Sales Process","desc":"We asked this individual to select from a list of different possible sales processes the one that they most identify with and have had the most success with. This finding indicates whether the sales process they selected would generally be considered a true sales process, as opposed to an unorganized series of activities."},{"name":"Uses an Effective Approach","desc":"We asked this individual to select from a list of different possible sales processes the one that they most identify with and have had the most success with. This finding indicates whether the sales process they selected would generally be considered effective."},{"name":"Relationship-Based","desc":"This finding will be strong if the Relationship-Building Competency has a score of 50% or higher.","alsoFoundIn":["Consultative Selling Competency - Develops Strong Relationships","Account Management Competency - Has Strong Relationships","Motivating Competency (Sales Management) - Develops Strong Relationships","Recruiting Competency (Sales Management) - Develops Strong Relationships"]},{"name":"CRM Savvy","desc":"This finding will be strong if the CRM Savvy Competency has a score of 67% or higher."},{"name":"Strategic Use of Sales Scorecard","desc":"This finding reflects whether the individual regularly uses a scorecard that predicts the likelihood of winning business as part of qualifying prospects."}]},"sales-technology":{"competency":"Sales Technology","title":"Findings Reference: Embracing Sales Technology Competency","intro":["Selling has changed and continues to evolve. One of the ways it evolves is how we use technology. This Competency reflects an individual's willingness and ability to successfully adapt sales technology into their process, including CRM, social media, and generative AI tools."],"components":["CRM-Savvy Competency (//kb.objectivemanagement.com/article/138-findings-reference-crm-savvy-competency)","Mastery of Social Selling Competency (//kb.objectivemanagement.com/article/139-findings-reference-mastery-of-social-selling-competency)","Video Proficient Competency*","Early Adopter*","Technology Acumen*"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment"],"findings":[{"name":"CRM-Savvy Competency","desc":""},{"name":"Mastery of Social Selling Competency","desc":""},{"name":"Video Proficient Competency","desc":""},{"name":"Early Adopter","desc":"This finding measures if an individual is proactive about using new Sales Technology."},{"name":"Technology Acumen","desc":"This finding measures if an individual effectively uses sales technology to reach prospects and address their needs."}],"extraSections":[{"heading":"","paras":["*Please review the latest updates to Sales Technology here (//kb.objectivemanagement.com/article/493-product-update-enhanced-sales-technology-competency)."],"bullets":[]}]},"coaching":{"competency":"Coaching","title":"Findings Reference: Coaching Competency","intro":["This competency reflects a sales manager’s ability to coach the salespeople who report to them. The attributes measured in this competency measure a manager’s management-specific skills and sales skills, as a sales manager must personally possess strong sales skills in order to encourage/teach those skills to others."],"components":["Consistently Coaches","Debriefs Efficiently","Asks Enough Questions","No Need for Approval from Salespeople","Able to Stay in the Moment","Effective Sales Process","Passion for Coaching","Beliefs Support Coaching","Uncovers Compelling Reasons to Buy","Knows How People Buy","Doesn't Rescue the Salespeople","Effective at Getting Commitments","Handles Joint Sales Calls Effectively"],"includedIn":["Sales Management Evaluation / Sales Management Candidate Assessment"],"findings":[{"name":"Consistently Coaches","desc":"This finding reflects whether sales managers allocate enough time to coaching their salespeople and frequently have conversations that involve both a lesson learned an an action plan.","alsoFoundIn":["Management Skills - Consistently Coaches"]},{"name":"Debriefs Efficiently","desc":"This finding reflects whether a sales manager has not only incorporated debriefing into his/her coaching, but also debriefs in way that helps the salesperson determine what went well or poorly, asking questions and leading the salesperson in a discussion rather than simply dictating to the salesperson.","alsoFoundIn":["Management Skills - Debriefs Efficiently"]},{"name":"Asks Enough Questions","desc":"This finding indicates whether the individual understands the importance of not dominating the conversation, by frequently asking questions. Just as in selling, successful coaching requires frequent question-asking.","alsoFoundIn":["Skills - Asks Enough Questions","Consultative Selling Competency - Asks Enough Questions","Presentation Approach and Context Competency - Asks Enough Questions","Selling Value Competency - Asks Enough Questions","Accountability Competency (Sales Management) - Asks Enough Questions","Recruiting Competency (Sales Management) - Great Interviewing Skills"]},{"name":"No Need for Approval from Salespeople","desc":"A weakness in this finding indicates that a sales manager is overly focused on keeping his/her salespeople happy, which reflects an unhealthy need for approval from those salespeople.","alsoFoundIn":["Management Skills - No Need for Approval from Salespeople","Recruiting Competency (Sales Management) - No Need for Approval from Salespeople","Accountability Competency (Sales Management) - No Need for Approval from Salespeople"]},{"name":"Able to Stay in the Moment","desc":"This finding reflects the individual's ability to stay in the moment and be focused on the now, instead of becoming emotional and worrying about what already has happened or what is going to happen.","alsoFoundIn":["Strengths - Able to Stay in the Moment","Sales DNA - Stays in the Moment","Consultative Selling Competency - Able to Stay in the Moment","Qualifying Competency - Able to Stay in the Moment","Closing Competency - Will Stay in the Moment at Closing Time","Negotiating Competency - Able to Stay in the Moment","Farming Competency - Won't Panic Over Objections"]},{"name":"Effective Sales Process","desc":"This finding will be strong if the Sales Process Competency has a score of 67% or higher."},{"name":"Passion for Coaching","desc":"This finding reflects whether this individual generally chooses to invest his/her time in coaching his/her salespeople over motivating, selling, or managing them."},{"name":"Beliefs Support Coaching","desc":"A strength in this finding indicates that this individual has fewer than 7 Self-Limiting Beliefs from the 22 Self-Limiting Beliefs we identify which undermine coaching success."},{"name":"Uncovers Compelling Reasons to Buy","desc":"A strength in this finding indicates that the individual listens and learns why their customer/prospect will make a purchase, and that the reasons for buying are truly compelling for the customer/prospect.  A weakness in this finding indicates that the individual might make assumptions about why the prospect/customer would buy, tells the prospect/customer why they should buy, or find reasons that aren't truly compelling.","alsoFoundIn":["Skills - Uncovers Reasons to Buy","Consultative Selling Competency - Uncovers Reasons to Buy + Reasons to Buy are Compelling","Selling Value Competency - Learns Why Prospects Will Buy","Qualifying Competency - Knows Why They Would Buy"]},{"name":"Knows How People Buy","desc":"This finding reflects whether the individual is successful in getting prospects to disclose the process they will use to decide whether to buy from them.","alsoFoundIn":["Skills - Understands How Prospects Will Buy","Consultative Selling Competency - Understands How Prospects Will Buy","Qualifying Competency - Knows Decision-Making Process"]},{"name":"Doesn't Rescue the Salespeople","desc":"This finding reflects whether a sales manager is, when on a call where a salesperson is in danger, willing to let the salesperson fail in order to learn a lesson.","alsoFoundIn":["Management Skills - Doesn't Rescue the Salespeople"]},{"name":"Effective at Getting Commitments","desc":"This finding reflects whether the individual gets the prospect or customer to agree to make a decision before trying to close.","alsoFoundIn":["Skills - Gets Prospects to Agree to Make a Decision","Closing Competency - Gets Prospects to Agree to Make a Decision"]},{"name":"Handles Joint Sales Calls Effectively","desc":"This finding reflects whether the sales manager has joint calls with his/her salespeople, and also whether the manager avoids having \"shared\" calls, as it is far more effective to either have the salesperson observe the manager on a call or lead the call himself/herself.","alsoFoundIn":["Management Skills - Handles Joint Sales Calls Effectively"]}]},"motivating":{"competency":"Motivating","title":"Findings Reference: Motivating Competency","intro":["This competency tells us how able sales managers are at understanding what motivates their salespeople and keeping them motivated. Note, the Motivating Competency is different from OMG’s Motivating Effectiveness (//kb.objectivemanagement.com/article/465-seia-findings-seia-analyses) finding."],"components":["Knows What Motivates Salespeople","Gives Recognition","Runs Effective Sales Meetings","Beliefs Support Motivation","Good Self-Image","Develops Strong Relationships","Takes Responsibility","Doesn't Accept Mediocrity","Has Goals and a Plan"],"includedIn":["Sales Management Evaluation / Sales Management Candidate Assessment"],"findings":[{"name":"Knows What Motivates Salespeople","desc":"This finding reflects whether sales managers both frequently discuss the financial needs of their salespeople and know the personal goals of their salespeople.","alsoFoundIn":["Management Skills - Knows What Motivates Salespeople"]},{"name":"Gives Recognition","desc":"This finding reflects whether sales managers encourage their salespeople and give them special recognition when they exceed expectations.","alsoFoundIn":["Management Skills - Gives Recognition"]},{"name":"Runs Effective Sales Meetings","desc":"This finding reflects whether a sales manager holds meetings, and whether those meetings are primarily held to train and/or motivate salespeople as opposed to sharing updates or complaints.","alsoFoundIn":["Management Skills - Runs Effective Sales Meetings"]},{"name":"Beliefs Support Motivation","desc":"A strength in this finding indicates that this individual has fewer than 3 Self-Limiting Beliefs from the 10 Self-Limiting Beliefs we identify which undermine a sales manager's ability to motivate his/her salespeople."},{"name":"Good Self-Image","desc":"This finding indicates whether the individual feels positively about themselves.  A negative finding means that the individual feels their life is a mess or people don't understand them, or that their difficulty handling rejection indicates that their self-image is not truly as strong as they believe it is.\n\nIt is difficult for a sales manager with weak self image to effectively motivate salespeople.\n\nNote that Self-Image is not the same thing as Outlook, but rather is one component that goes into determining Outlook.","alsoFoundIn":["Strength - Good Self-Image","Sales Posturing Competency - Good Self-Image"]},{"name":"Develops Strong Relationships","desc":"This finding will be strong if the Relationship Building Competency has a score of 50% or higher.","alsoFoundIn":["Consultative Selling Competency - Develops Strong Relationships","Sales Process Competency - Relationship Based","Account Management Competency - Has Strong Relationships","Recruiting Competency (Sales Management) - Develops Strong Relationships"]},{"name":"Takes Responsibility","desc":"This finding will be strong if the Responsibility Competency score has a score of 50% or higher.","alsoFoundIn":["Accountability Competency (Sales Management) - Takes Responsibility"]},{"name":"Doesn't Accept Mediocrity","desc":"This finding reflects whether sales managers won't accept mediocrity, even if that means salespeople may be unhappy with them.","alsoFoundIn":["Accountability Competency (Sales Management) - Doesn’t Accept Mediocrity","Recruiting Competency (Sales Management) - Hires the Best Person for the Position"]},{"name":"Has Goals and a Plan","desc":"This finding reflects whether an individual has personal goals and a tracking system that monitors progress toward reaching those goals.","alsoFoundIn":["Sales Skills - Personal Goals and Sales Skills - System to Track Progress"]}]},"accountability":{"competency":"Accountability","title":"Findings Reference: Accountability Competency","intro":["This competency measures how able sales managers are at holding their salespeople accountable to agreed-upon goals, metrics, and KPI's. Note, the Accountability Competency is different from OMG's Accountability Effectiveness (//kb.objectivemanagement.com/article/465-seia-findings-seia-analyses) finding."],"components":["Manages Behavior","Doesn't Accept Mediocrity","Takes Responsibility","No Need for Approval from Salespeople","Beliefs Support Accountability","Asks Enough Questions","Manages Pipeline"],"includedIn":["Sales Management Evaluation / Sales Management Candidate Assessment"],"findings":[{"name":"Manages Behavior","desc":"This finding reflects whether sales managers measure their salespeople's success based on KPI's related to daily activities or behaviors, as opposed to lagging activities such as sales or orders.","alsoFoundIn":["Management Skills - Manages Behavior"]},{"name":"Doesn't Accept Mediocrity","desc":"This finding reflects whether sales managers won't accept mediocrity, even if that means salespeople may be unhappy with them.","alsoFoundIn":["Motivating Competency (Sales Management) - Doesn't Accept Mediocrity","Recruiting Competency (Sales Management) - Hires the Best Person for the Position"]},{"name":"Takes Responsibility","desc":"This finding will be strong if the Responsibility Competency score has a score of 50% or higher.","alsoFoundIn":["Motivating Competency (Sales Management) - Takes Responsibility"]},{"name":"No Need for Approval from Salespeople","desc":"A strength in this finding indicates that a sales manager doesn't need his or her salespeople to like him.  Just as need for approval from prospects sabotages salespeople, need for approval from salespeople sabotages a manager's ability to be firm, demanding, and hold salespeople accountable.","alsoFoundIn":["Management Skills - No Need for Approval from Salespeople","Coaching Competency (Sales Management) - No Need for Approval from Salespeople","Recruiting Competency (Sales Management) - No Need for Approval from Salespeople"]},{"name":"Beliefs Support Accountability","desc":"A strength in this finding indicates that this individual has fewer than 3 Self-Limiting Beliefs from the 7 Self-Limiting Beliefs we identify which undermine a sales manager's ability to hold his/her salespeople accountable."},{"name":"Asks Enough Questions","desc":"This finding indicates whether the individual understands the importance of not dominating the conversation on sales calls, by frequently asking questions. Just as in selling, it is important for a sales manager to ask plenty of questions while holding a salesperson accountable.","alsoFoundIn":["Skills - Asks Enough Questions","Consultative Selling Competency - Asks Enough Questions","Presentation Approach and Context Competency - Asks Enough Questions","Selling Value Competency - Asks Enough Questions","Coaching Competency (Sales Management) - Asks Enough Questions","Recruiting Competency (Sales Management) - Great Interviewing Skills"]},{"name":"Manages Pipeline","desc":"This finding will be strong if the Pipeline Management Competency has a score of 67% or higher."}]},"recruiting":{"competency":"Recruiting","title":"Findings Reference: Recruiting Competency","intro":["This finding shows how effective sales managers will be at the recruiting process and sales selection."],"components":["Hires the Best Person for the Position","Great Interviewing Skills","Uses Correct Hiring Criteria","Upgrades the Sales Force","No Need for Approval from Salespeople","Recruits Consistently","Good Decision Maker","Beliefs Support Recruiting","Develops Strong Relationships"],"includedIn":["Sales Management Evaluation / Sales Management Candidate Assessment"],"findings":[{"name":"Hires the Best Person for the Position","desc":"This finding reflects whether sales managers won't accept mediocrity, even if that means salespeople may be unhappy with them.","alsoFoundIn":["Motivating Competency (Sales Management) - Doesn't Accept Mediocrity","Accountability Competency (Sales Management) - Doesn't Accept Mediocrity"]},{"name":"Great Interviewing Skills","desc":"This finding indicates whether the individual understands the importance of not dominating the conversation on sales calls, by frequently asking questions. While it is important for candidates to learn about the company they are applying to, it is also critical that an interviewer ask plenty of questions and listen to how the interviewee answers them.","alsoFoundIn":["Skills - Asks Enough Questions","Consultative Selling Competency - Asks Enough Questions","Presentation Approach and Context Competency - Asks Enough Questions","Selling Value Competency - Asks Enough Questions","Accountability Competency (Sales Management) - Asks Enough Questions","Coaching Competency (Sales Management) - Asks Enough Questions"]},{"name":"Uses Correct Hiring Criteria","desc":"This finding reflects whether a sales manager will prioritize a candidate's ability to sell over experience, honesty, or likability.","alsoFoundIn":["Management Skills - Uses Correct Hiring Criteria"]},{"name":"Upgrades the Sales Force","desc":"This finding reflects whether a sales manager views recruiting salespeople as an ongoing process, as opposed to something only done when someone needs to be replaced or the team expanded.","alsoFoundIn":["Management Skills - Upgrades the Sales Force"]},{"name":"No Need for Approval from Salespeople","desc":"A strength in this finding indicates that a sales manager doesn't need his or her salespeople to like him.  Just as need for approval from prospects sabotages salespeople, need for approval from salespeople sabotages a manager's ability to be ask tough questions while interviewing candidates.","alsoFoundIn":["Management Skills - No Need for Approval from Salespeople","Coaching Competency (Sales Management) - No Need for Approval from Salespeople","Accountability Competency (Sales Management) - No Need for Approval from Salespeople"]},{"name":"Recruits Consistently","desc":"This finding reflects whether a sales manager recruits consistently and also looks to improve with every hire.  Consistent recruiting provides a solid bench for replacing salespeople and also allows a company to interview from a position of strength rather than weakness.","alsoFoundIn":["Management Skills - Recruits Consistently"]},{"name":"Good Decision Maker","desc":"If this finding is negative, it indicates that the individual tends to think over purchases in their personal life, which indicates a lack of quick decision-making. When applied to recruiting, individuals with this weakness are unlikely to get commitments from candidates when making an offer, or potentially lose candidates by not deciding to make an offer quickly enough.","alsoFoundIn":["Strengths - Not Likely to Take \"Think It Overs\"","Sales DNA - Buy Cycle - 1 of 5 components","Closing Competency - Not Likely to Take \"Think it Overs\""]},{"name":"Beliefs Support Recruiting","desc":"A strength in this finding indicates that this individual has fewer than 6 Self-Limiting Beliefs from the 16 Self-Limiting Beliefs we identify which undermine a sales manager's ability to successful recruit salespeople."},{"name":"Develops Strong Relationships","desc":"This finding will be strong if the Relationship Building Competency has a score of 50% or higher.","alsoFoundIn":["Consultative Selling Competency - Develops Strong Relationships","Sales Process Competency - Relationship Based","Account Management Competency - Has Strong Relationships","Motivating Competency (Sales Management) - Develops Strong Relationships"]}]},"pipeline-management":{"competency":"Pipeline Management","title":"Findings Reference: Pipeline Management Competency","intro":["This competency measures how thoroughly and effectively a sales manager will both manage the pipeline and coach from the pipeline."],"components":["Focused on Keeping Pipeline Full","Properly Utilizing Pipeline Metrics","Focused on Best Pipeline Metrics","Focuses on New or Stalled Business","Regularly Reviews Pipeline","Spends Proper Time on Pipeline Reviews"],"includedIn":["Sales Management Evaluation / Sales Management Candidate Assessment"],"findings":[{"name":"Focused on Keeping Pipeline Full","desc":"This finding reflects whether a sales manager places more emphasis on keeping the pipeline full than making sure opportunities close, managing specific opportunities, or focusing on non pipeline-related issues."},{"name":"Properly Utilizing Pipeline Metrics","desc":"This finding reflects whether a sales manager considers the pipeline to be a tool for coaching, accountability, or regular review, as opposed to using it for forecasting or reporting."},{"name":"Focused on Best Pipeline Metrics","desc":"This finding reflects whether a sales manager prioritizes pipeline metrics centered around filling the pipeline or moving opportunities through the pipeline, as opposed to quality, quantity, or how closeable opportunities are."},{"name":"Focuses on New or Stalled Business","desc":"This finding reflects whether a sales manager places more focus on stalled business or generating new business, over closing business or ongoing business."},{"name":"Regularly Reviews Pipeline","desc":"This finding reflects whether sales managers spend time reviewing their salespeople's pipeline more than once per week."},{"name":"Spends Proper Time on Pipeline Reviews","desc":"This finding reflects whether sales managers generally spend 31-45 minutes reviewing their salespeople's pipeline."}]},"sales-posturing":{"competency":"Sales Posturing","title":"Findings Reference: Sales Posturing Competency","intro":["Sales Posturing is associated with first impressions, differentiation, and being memorable. OMG can't really measure first impressions, how effectively a salesperson differentiates, or how memorable a salesperson is, so we measure what we can -- attributes that would suggest whether or not a salesperson is successfully posturing."],"components":["Good Self-Image","Quickly Develops Rapport","Sales Optimism","Sales Assertiveness","Sales Empathy","Appropriate Amount of Patience","Will Build Trust","Good Listener","Healthy Skepticism"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment","Business Development Evaluation"],"findings":[{"name":"Good Self-Image","desc":"This finding indicates whether the individual feels positively about themselves.  A negative finding means that the individual feels pessimistic about their professional life, or that their difficulty handling rejection indicates that their self-image is not truly as strong as they believe it is.\n\nSalespeople who feel good about themselves are more likely to make a good first impression.  They will be more confident, are more likely to smile, and extend a strong handshake.\n\nNote that Self-Image is not the same thing as Outlook, but rather is one component that goes into determining Outlook.","alsoFoundIn":["Strength - Good Self-Image","Motivating Competency (Sales Management) - Good Self-Image"]},{"name":"Quickly Develops Rapport","desc":"This finding reflects whether an individually is generally able to build rapport on their first call or meeting.\n\nSalespeople who quickly and easily find common ground tend to be more likable and, as a result, more memorable.","alsoFoundIn":["Skills - Quickly Develops Rapport","Relationship Building Competency - Quickly Develops Rapport","Selling Value Competency - Quickly Develops Rapport","Building Trust Competency - Quickly Builds Rapport"]},{"name":"Sales Optimism","desc":"Sales Optimism is a component of the Sales Posturing Competency, and measures whether a salesperson's expectations are supportive of positive outcomes in selling situations. A salesperson with sales optimism is more likely to effectively differentiate themselves and their company.\n\nA salesperson with low Sales Optimism tends not to expect a positive outcome in selling situations. Prospects may notice this lack of optimism, and it could negatively impact their likelihood of buying from these salespeople. While it is still important to have healthy skepticism, these salespeople may benefit from trying to think more optimistically to improve the impression they make on prospects.\n\nA salesperson with fair Sales Optimism could expect either a positive or negative outcome depending on the situation.\n\nA salesperson with high Sales Optimism tends to expect the best in selling situations. This contributes positively to the salesperson's overall Sales Posture, helping him/her make a positive impression on prospects and making them feel more comfortable with the salesperson.\n\nDistinction from Outlook: Sales Optimism looks specifically at an individual's expectations in selling situations. Outlook, on the other hand, is a measurement of someone's broader feelings about, for example, their career. So you could say that Sales Optimism is about the near terms, whereas Outlook is about the longer term and broader picture.\n\nDistinction from Self-Limiting Beliefs:  Self-Limiting Beliefs cover a lot of different topics -- preconceptions about the world which undermine a salesperson's selling success -- but do not cover the topic of one's expectations for whether sales situations will result in a successful outcome."},{"name":"Sales Assertiveness","desc":"Sales Assertiveness measures the ability to confidently and professionally engage with prospective customers in a way that earns their trust and respect. It involves persistently pursuing opportunities and asking insightful questions to uncover needs. Assertive sales professionals are problem-solvers who handle confrontation tactfully and are able to maintain empathy and control while navigating the complexities of the sales process.","alsoFoundIn":["Strengths - Sales Assertiveness"]},{"name":"Sales Empathy","desc":"Sales Empathy is our measure of how effectively a salesperson relates to a prospect. We measure both good (supportive) empathy and bad (non-supportive) empathy. Picture a clock.  At 9 o'clock is a salesperson who is empathetic to a prospect's problems. That's good empathy.  At 3 o'clock is a salesperson who is empathetic to a prospect's stalls, put-offs, objections and excuses.  That's bad empathy. A salesperson with good empathy will be memorable.\n\nGood (Supportive) Empathy helps salespeople empathize with their prospects' issues and challenges.\n\nBad (Non-Supportive) Empathy causes salespeople to empathize with prospects' stalls, put-offs and excuses.\n\nThe combination of these two scores gives us the overall Sales Empathy score.\n\nHere are some of the terms we use when describing a salesperson's empathy:\n\nSupportive (High Good Empathy, Low Bad Empathy): The empathy is directed toward understanding the prospects' problems, issues, frustrations and situation. Salesperson has the ability or potential to be very effective at identifying the reasons why prospects will buy.\n\nSupportive but Vulnerable (High Good Empathy, Medium Bad Empathy): Has supportive empathy but is vulnerable because there is also a component of non-supportive empathy.\n\nSomewhat Supportive (Medium Good Empathy, Low Bad Empathy): Has low non-supportive empathy, but doesn't have enough supportive empathy to be consistently effective identifying reasons to buy.\n\nNot Supportive: The empathy is directed toward understanding the prospects' stalls, put-offs, excuses and objections. The salesperson does not currently have the ability to be effective identifying the reasons why prospects will buy and has trouble overcoming the reasons why they can't.","alsoFoundIn":["Strengths - Sales Empathy"]},{"name":"Appropriate Amount of Patience","desc":"Picture a clock. At 9 o'clock are salespeople who are so patient that their prospects can easily put them off time and time again.  At 3 o'clock are salespeople who are so impatient that they will blow up an opportunity if it doesn't close on their timeline. A good salesperson dials in 12 o'clock where they can balance just the right amount of patience, and as a result, differentiate themselves.\n\nWe measure patience on a spectrum from \"Too Impatient\" on one end to \"Too Patient\" on the other end.  Too much impatience can come across rude to a prospect and frustrate them.  Too much patience can delay closing.  An ideal score, representing an appropriate amount of patience, is in the middle of that spectrum, where an individual is neither too impatient nor too patient.","alsoFoundIn":["Strengths - Manages Appropriate Amount of Patience","Consultative Selling Competency - Manages Appropriate Amount of Patience","Closing Competency - Manages Appropriate Amount of Patience","Negotiating Competency - Manages Appropriate Amount of Patience"]},{"name":"Will Build Trust","desc":"This finding will be strong if the Building Trust Competency has a score of 67% or higher.\n\nSalespeople who effectively build trust achieve it long after the first impression, but make a lasting impression.  They're memorable.","alsoFoundIn":["Strength - Will Build Trust","Consultative Selling Competency - Will Build Trust"]},{"name":"Good Listener","desc":"A strength in this finding indicates that a salesperson does less than 1/3 of the talking in conversations with prospects or customers.\n\nSalespeople who use a consultative approach differentiate themselves from other salespeople.","alsoFoundIn":["Consultative Selling Competency - Able to Listen / Ask with Ease","Negotiating Competency - Able to Listen/Ask with Ease"]},{"name":"Healthy Skepticism","desc":"A strength in this finding reflects that the individual is not overly trusting of prospects.  Healthy skepticism helps individuals avoid being mislead by prospects, which results in getting more accurate answers to tough questions.\n\nSalespeople who are comfortable expressing their healthy skepticism ask more questions, get their prospects to explain themselves and are, in effect, more memorable.","alsoFoundIn":["Strengths - Healthy Skepticism","Consultative Selling Competency - Healthy Skepticism"]}]},"negotiating":{"competency":"Negotiating","title":"Findings Reference: Negotiating Competency","intro":["The attributes of the Negotiating Competency help you better understand the individual's capabilities for negotiating terms, prices, and conditions at closing time."],"components":["Seeks Win/Win","Willing to Walk","Manages Appropriate Amount of Patience","Able to Listen and Ask with Ease","Able to Stay in the Moment","Goal Oriented","Problem Solver","Doesn't Need to be Liked","Rejection Proof","Selling Value","Will Discuss Finances"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment"],"findings":[{"name":"Seeks Win/Win","desc":"This finding reflects whether an individual tends to find \"win/win\" outcomes while negotiating, where both the company and the prospect/customer get something they want.","alsoFoundIn":["Closing Competency - Seeks Win/Win"]},{"name":"Willing to Walk","desc":"This finding indicates whether the individual is willing to walk away from negotiations if they are not going well."},{"name":"Manages Appropriate Amount of Patience","desc":"We measure patience on a spectrum from \"Too Impatient\" on one end to \"Too Patient\" on the other end. Too much impatience can come across rude to a prospect and frustrate them. Too much patience can delay closing. An ideal score, representing an appropriate amount of patience, is in the middle of that spectrum, where an individual is neither too impatient not too patient.","alsoFoundIn":["Strengths - Manages Appropriate Amount of Patience","Consultative Selling Competency - Manages Appropriate Amount of Patience","Closing Competency - Manages Appropriate Amount of Patience","Sales Posturing Competency - Appropriate Amount of Patience"]},{"name":"Able to Listen/Ask with Ease","desc":"A strength in this finding indicates that a salesperson does less than 1/3 of the talking in conversations with prospects or customers.","alsoFoundIn":["Consultative Selling Competency - Able to Listen / Ask with Ease","Sales Posturing Competency - Good Listener"]},{"name":"Able to Stay in the Moment","desc":"This finding reflects the individual's ability to stay in the moment and be focused on the now, instead of becoming emotional and worrying about what already has happened or what is going to happen.","alsoFoundIn":["Strengths - Able to Stay in the Moment","Sales DNA - Stays in the Moment","Consultative Selling Competency - Able to Stay in the Moment","Qualifying Competency - Able to Stay in the Moment","Closing Competency - Will Stay in the Moment at Closing Time","Farming Competency - Won't Panic Over Objections","Coaching Competency (Sales Management) - Able to Stay in the Moment"]},{"name":"Goal Oriented","desc":"A positive finding indicates that the individual has personal goals, they are written, there are dates associated with them, and has a written plan to reach them.","alsoFoundIn":["Strengths - Personal Goals and Plan for Reaching Personal Goals"]},{"name":"Problem Solver","desc":"A positive finding indicates that a person tends to focus on problems or think of solutions. A negative finding indicates that a person worries about problems or get consumed by them.","alsoFoundIn":["Strengths - Is a Problem Solver","Closing Competency - Problem Solver"]},{"name":"Doesn't Need to be Liked","desc":"This finding shows to what degree the individual needs to be liked or (in severe cases) loved.  When an individual needs to be liked, they will have more trouble asking lots of questions or tough questions and having the difficult conversation that no one else has had, which will impede their ability to hunt for new business.","alsoFoundIn":["Strength - Does Not Need to be Liked","Sales DNA - Doesn't Need Approval","Hunting Competency - Has No Need for Approval","Consultative Selling Competency - Able to Ask Tough Questions","Selling Value Competency - Doesn't Need Approval","Qualifying Competency - Need to Be Liked Doesn't Get in the Way","Closing Competency - Isn't Hoping to be Liked","Reaching Decision-Makers Competency - Does Not Need to be Liked"],"opposite":["Account Management Competency - Won't Alienate People"]},{"name":"Rejection Proof","desc":"This finding reflects whether the individual can easily recover from rejection. Someone who has difficulty recovering from rejection will have trouble negotiating business deals.","alsoFoundIn":["Strength - Recovers from Rejection","Sales DNA - Handles Rejection","Hunting Competency - Recovers from Rejection"],"opposite":["Farming Competency - Won't Alienate Customers"]},{"name":"Selling Value","desc":"This finding will be strong if the Selling Value Competency has a score of 67% or higher."},{"name":"Will Discuss Finances","desc":"Note: before October 2021, this attribute was called \"Able to Discuss Money\"\n\nThis finding reflects whether the individual has the ability to talk about money with a great deal of ease. Individuals with a weakness in this finding don't think of talking about money as a normal part of selling, and may feel that talking about money is too invasive.","alsoFoundIn":["Strengths - Will Discuss Finances","Selling Value Competency - Will Discuss Finances","Qualifying Competency - Will Discuss Finances"]}]},"building-trust":{"competency":"Building Trust","title":"Findings Reference: Building Trust Competency","intro":["Building Trust is an important component of being able to successfully sell consultatively. This competency includes attributes which are evidence of a salesperson being successful in building trust with their customers or prospects."],"components":["Gains Trust Early","High Integrity Seller","Customers Share Information Early","Gets First Call from Customers","Quickly Builds Rapport","Believes They Are Quickly Liked by Customers"],"includedIn":["Sales Evaluation / Sales Candidate Assessment"],"findings":[{"name":"Gains Trust Early","desc":"This finding reflects whether this individual is able to get prospects to trust him/her early in their interactions.","alsoFoundIn":["Skills - Gains Trust Early"]},{"name":"High Integrity Seller","desc":"This finding measures whether the individual tends to favor integrity over opportunity.  A High Integrity Seller (1) honors an existing deal with a customer instead of taking advantage of a new conflicting opportunity, (2) tells the truth, even if it hurts or is uncomfortable, over telling someone only what they need to hear, and (3) ethically handles situations where a business promise must be broken rather than backtracking or making excuses.\n\nNote about addressing pushback: While high integrity supports building trust with customers and prospects, it also can make a salesperson less likely to take advantage of opportunities that are beneficial to the company.","alsoFoundIn":["Strengths - High Integrity Seller"]},{"name":"Customers Share Information Early","desc":"This finding reflects whether customers tend to share more information with this individual than they do with competitors trying to win the same information.","alsoFoundIn":["Skills - Customers Share Information Early"]},{"name":"Gets First Call from Customers","desc":"A strength in this finding indicates that customers tend to consult or include this individual early in the planning process, as opposed to simply letting them know when there is business or they are ready for a quote.","alsoFoundIn":["Skills - Gets First Call from Customers"]},{"name":"Quickly Builds Rapport","desc":"This finding reflects whether an individual is generally able to build rapport on their first call or meeting.","alsoFoundIn":["Skills - Quickly Develops Rapport","Relationship Building Competency - Quickly Develops Rapport","Selling Value Competency - Quickly Develops Rapport","Sales Posturing Competency - Quickly Develops Rapport"]},{"name":"Believes They Are Quickly Liked by Customers","desc":"This finding reflects whether this individual feels customers tend to quickly  like him/her, how quickly this individual develops rapport, and/or whether this i
