ndividual is known for being well-liked or loved by customers.","alsoFoundIn":["Hunting Competency - Believes They Are Quickly Liked by Customers","Farming Competency - Believes They Are Quickly Liked by Customers"]}]},"account-management":{"competency":"Account Management","title":"Findings Reference: Account Management Competency","intro":["The Account Management Competency is only relevant when an individual's role requires managing existing accounts. It is not considered one of OMG's Sales Core Competencies, and as such is not included in the Sales Percentile calculation. On the dashboards, it is included under \"Other Scores\"."],"components":["Has Strong Relationships","Will Handle Organizational Politics","Will Make Friends Everywhere","Will Follow Up Often","Will Meet/Talk with Decision Makers","Will Know the Real Budgets","Won't Feel Urgency to Close Business","Won't Alienate People","Will Focus on Current Accounts Rather than Looking for New Accounts","Will Manage Time Effectively"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Has Strong Relationships","desc":"This finding will be strong if the Relationship Building Competency has a score of 50% or higher.","alsoFoundIn":["Consultative Selling Competency - Develops Strong Relationships","Sales Process Competency - Relationship Based"]},{"name":"Will Handle Organizational Politics","desc":"This finding reflects whether a salesperson questions \"why\" when a prospect/client exhibits unpredictable behavior. Whether or not a salesperson understands why, it's best to ask why they did what they did instead of assuming to know or ignoring possible reasons. Discounting a customer's change in behavior makes things more difficult later in the process when one wonders \"why this had to happen to me\".  A salesperson who asks \"why\" unpredictable behaviors happen may also uncover opportunities that were previously hidden or be able to overcome an otherwise insurmountable obstacle.","alsoFoundIn":["Skills - Will Handle Organizational Politics"]},{"name":"Will Make Friends Everywhere","desc":"This finding is the opposite of what we usually look for in great salespeople, and reflects whether the individual feels it is important to be liked or considered a friend by prospects.  In other words, it shows whether being friends with customers matters to the individual.\n\nNote that this is not the same thing as Needing Approval.  Rather, this is one of several components that goes into determining whether a salespeople Doesn't Need Approval.","alsoFoundIn":["Self-Limiting Beliefs - I need my prospects to like me."]},{"name":"Will Follow Up Often","desc":"This finding is the opposite of what we usually look for in great salespeople, and reflects whether the individual will follow up frequently with customers to get additional details or commitments.  In other words, we want account managers to follow up regularly on opportunities, whereas we want great salespeople to have the information we need and push for a decision as opposed to following up later.","opposite":["Skills - Follow Up Calls"]},{"name":"Will Meet/Talk with Decision Makers","desc":"This finding will be strong if the Reaching Decision-Makers Competency has a score of 67% or higher.","alsoFoundIn":["Qualifying Competency - Meets with Decision Maker","Closing Competency - Will Meet with the Decision Maker"]},{"name":"Will Know the Real Budgets","desc":"Reflects whether the individual usually knows how much money prospects are able to spend before closing.","alsoFoundIn":["Skills - Uncovers Actual Budget","Qualifying Competency - Uncovers Actual Budget"]},{"name":"Won't Feel Urgency to Close Business","desc":"This finding is the opposite of what we usually look for in great salespeople, and reflects whether the individual does not have strong closing urgency.  This finding is strong when an individual does not push back strongly against being asked to call back / follow up later.","opposite":["Strengths - Closing Urgency","Closing Competency - Closing Urgency","Farming Competency - Has Closing Urgency"]},{"name":"Won't Alienate People","desc":"This finding is the opposite of what we usually look for in great salespeople, and reflects whether the individual needs approval.  In the context of managing existing accounts, someone who doesn't need any approval from customers may alienate those customers, especially when that individual is seen by the customer as their go-to account manager.","opposite":["Strengths - Does Not Need to be Liked","Sales DNA - Doesn't Need Approval","Hunting Competency - Has No Need for Approval","Consultative Selling Competency - Able to Ask Tough Questions","Selling Value Competency - Doesn't Need Approval","Qualifying Competency - Need to Be Liked Doesn't Get in the Way","Closing Competency - Isn't Hoping to be Liked","Negotiating Competency - Doesn't Need to be Liked","Reaching Decision-Makers Competency - Does Not Need to be Liked"]},{"name":"Will Focus on Current Accounts Rather than Looking for New Accounts","desc":"This finding is the opposite of whether an individual is likely to rely on cold calling when needing to find new customers.  In the context of managing existing accounts, someone who is strongly driven to hunt for new customers may lose focus on managing existing customers.","alsoFoundIn":["Farming Competency - Unlikely to be Distracted by New Accounts"],"opposite":["Strengths - Will Prospect","Hunting Competency - Will Prospect"]},{"name":"Will Manage Time Effectively","desc":"Reflects how the individual self-rates his/her organizational skills.","alsoFoundIn":["Skills - Will Manage Time Effectively"]}]},"farming":{"competency":"Farming","title":"Findings Reference: Farming Competency","intro":["The Farming Competency is only relevant when an individual's role requires farming -- where a salesperson is assigned 1, 2, or 3 huge accounts, and their task is to grow those accounts."],"components":["Attempts to Close","Has Closing Urgency","Won't \"Understand\" Most Objections","Won't Panic Over Objections","Handles \"It's a Lot of Money\" Objection","Won't Accept Put Offs","Believes They Are Quickly Liked by Customers","Won't Alienate Customers","Unlikely to be Distracted by New Accounts"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Attempts to Close","desc":"This findings reflects whether the individual has places tremendous importance on getting a prospect to agree to make a decision, and consistently gets the prospect to agree to make a decision before trying to close.","alsoFoundIn":["Skills - Will Find a Way to Close","Closing Competency - Will Find a Way to Close"]},{"name":"Has Closing Urgency","desc":"This finding reflects whether the individual has strong closing urgency.  This finding is strong when an individual pushes back strongly against being asked to call back / follow up later.","alsoFoundIn":["Strengths - Closing Urgency","Closing Competency - Closing Urgency"],"opposite":["Account Management Competency - Won't Feel Urgency to Close Business"]},{"name":"Won't \"Understand\" Most Objections","desc":"This finding reflects how a salesperson goes about the process of making a major purpose.  A strong finding indicates that the way this individual buys supports positive sales outcomes.  The five components that can detract from Supportive Buy Cycle are whether the individual thinks things over, comparison shops, price shops, does research, or thinks that something is a lot of money even when it isn't.","alsoFoundIn":["Sales DNA - Supportive Buy Cycle"]},{"name":"Won't Panic Over Objections","desc":"This finding reflects the individual's ability to stay in the moment and be focused on the now, instead of becoming emotional and worrying about what already has happened or what is going to happen.","alsoFoundIn":["Strengths - Able to Stay in the Moment","Sales DNA - Stays in the Moment","Consultative Selling Competency - Able to Stay in the Moment","Qualifying Competency - Able to Stay in the Moment","Closing Competency - Will Stay in the Moment at Closing Time","Negotiating Competency - Able to Stay in the Moment","Coaching Competency (Sales Management) - Able to Stay in the Moment"]},{"name":"Handles \"It's a Lot of Money\" Objection","desc":"This finding reflects how this individual is likely to respond to the customer's objections to something costing a lot of money, based on how the individual tends to think about money personally.","alsoFoundIn":["Strengths - High Threshold for Money","Sales DNA - Buy Cycle - 1 of 5 components","Selling Value Competency - High Threshold for Money","Qualifying Competency - Handles High-Ticket Pricing OK"]},{"name":"Won't Accept Put Offs","desc":"This finding reflects whether the individual will avoid put offs both when trying to schedule meetings / appointments and when trying to close an opportunity.","alsoFoundIn":["Skills - Unlikely to be Derailed by Put-Offs","Closing Competency - Unlikely to be Derailed by Put-Offs"]},{"name":"Believes They Are Quickly Liked by Customers","desc":"This finding reflects whether this individual feels customers tend to quickly  like him/her, how quickly this individual develops rapport, and/or whether this individual is known for being well-liked or loved by customers.","alsoFoundIn":["Hunting Competency - Believes They Are Quickly Liked by Customers","Building Trust Competency - Believes They Are Quickly Liked by Customers"]},{"name":"Won't Alienate Customers","desc":"This finding is the opposite of what we usually look for in great salespeople, and reflects whether the individual has difficulty recovering from rejection.  In the context of farming large accounts, someone who instantly moves on from being told \"no\" by a large customer may not dig deep enough to discover potential opportunities for additional business.","opposite":["Strengths - Recovers from Rejection","Sales DNA - Handles Rejection","Hunting Competency - Recovers from Rejection","Negotiating Competency - Rejection Proof"]},{"name":"Unlikely to be Distracted by New Accounts","desc":"This finding is the opposite of whether an individual is likely to rely on cold calling when needing to find new customers.  In the context of farming large accounts, someone who is strongly driven to hunt for new customers may lose focus on managing existing customers.","alsoFoundIn":["Account Management Competency - Will Focus on Current Accounts Rather than Looking for New Accounts"],"opposite":["Strengths - Will Prospect","Hunting Competency - Will Prospect"]}]},"will-to-sell":{"article":"desire-commitment-motivation","title":"Findings Reference: Desire, Commitment and Motivation","intro":["OMG's Will to Sell Competencies represent what we call the “grit” factors, or the inner drive that determines whether someone in sales can push through challenges, stretch beyond their comfort zone, and continuously improve.","Among these, <strong>Desire</strong>, <strong>Commitment</strong>, and <strong>Motivation</strong> often cause confusion because they sound similar but represent very different aspects of a salesperson’s 'grit'. This post clarifies the distinctions:"],"sections":[{"heading":"DESIRE - How strong is their drive for success?","paras":["Desire is a key factor in determining growth potential. Another way to look at Desire is an individual's drive, or how badly an individual <em>wants</em> to achieve greater success in sales. Salespeople who lack drive are difficult to motivate, even if they are committed. Often, their goals are too small or outdated, reducing their drive. The best way to increase desire is through goal setting, sometimes starting from scratch when existing goals fail to inspire. Individuals who have achieved past success or never wanted much may need new, exciting goals to reignite motivation. Without Desire, people are unlikely to change, and those who admit they don’t care about success are poor candidates for high performance."]},{"heading":"COMMITMENT - Will they do what's necessary to achieve it?","paras":["Commitment means the willingness to do, ethically, whatever it takes to achieve great success in sales. Commitment is one of the most critical sales competencies, but many salespeople exhibit <em>conditional</em> commitment (they stay committed only when tasks are easy or comfortable). A lack of strong personal goals often contributes to this issue, as company goals rarely inspire the same level of motivation. To strengthen Commitment, salespeople need meaningful personal goals tied to material desires or lifelong dreams, which drive higher performance. Those unaware of their weak commitment often work hard but ineffectively, failing to do the right things or enough of them. Others resist adapting to new methods, further limiting results."]},{"heading":"MOTIVATION - What inspires and sustains them?","paras":["OMG's Motivation Competency measures how motivated an individual is and how they are motivated (the 'what' and 'why' behind Desire). Extrinsically motivated salespeople, most of whom are found in the top 5 percentile, are motivated by money and things. Altruistically motivated salespeople, most of whom are found in the bottom 10 percentile, want to be of service, and intrinsically motivated salespeople, who make up 50% of the sales workforce, are motivated by being part of something bigger than themselves, mastery, love of what they do, and self-satisfaction."]}]},"buy-cycle":{"article":"buy-cycle","recovered":true,"title":"How Buy Cycle Awareness Helps Salespeople Keep Deals Moving","intro":["When a deal slows down, many sales teams look outward for the cause—perhaps it's the prospect's budget, competing priorities, or internal delays. But often, an overlooked factor lies closer to home: the salesperson's own buying habits.","Buy Cycle, as a sales competency, refers to a salesperson's ability to recognize how their personal buying behavior influences the objections they'll accept from a prospect. For example, a rep who tends to take their time when making purchases—shopping around, seeking multiple quotes, or delaying decisions—may unintentionally enable similar behaviors in prospects. This excessive empathy can stall deals at critical stages, turning what should be a straightforward sales process into a drawn-out one.","To keep a sale progressing, it's essential that salespeople develop awareness of their own tendencies. By doing so, they can better guide prospects, avoid unnecessary delays, and stay focused on moving opportunities forward."],"sections":[{"heading":"Where Buy Cycle Fits Within Sales DNA","paras":["Buy Cycle is one of several competencies that make up Sales DNA—the internal beliefs, habits, and instincts that shape how salespeople behave in the field. Unlike tactical selling skills, which can be learned through training and practice, Sales DNA reflects deeper mindsets and tendencies that influence whether reps consistently apply their skills effectively.","When salespeople lack awareness of their Buy Cycle, they may hesitate at critical moments. For example, a rep who personally avoids making quick decisions may empathize too much with a prospect's indecision, allowing the buyer to delay without challenge. Similarly, a rep who always seeks out the lowest price for personal purchases may project this onto their prospects, assuming that price is the central concern—even when it isn't.","This can make otherwise capable salespeople struggle to maintain control of the process. On the other hand, those who understand and manage their Buy Cycle tendencies are better equipped to guide prospects, ask for appropriate commitments, and confidently navigate each stage of the sales process."]},{"heading":"The Impact of Buy Cycle on Sales Performance","paras":["Salespeople who are strong in this competency often see measurable differences in their results, including:"],"bullets":["Fewer competitive situations. When reps avoid enabling endless comparison shopping, they help prospects stay focused on the solution rather than chasing alternatives, which reduces the risk of being caught in a price war.","Stronger timing of demos, pricing, and proposals. Confident in their ability to lead the process, these salespeople share information at the right moments—neither too soon, when it might overwhelm or distract the buyer, nor too late, when it could stall momentum.","Improved sales velocity. Without their own buying habits interfering, these salespeople help deals progress more smoothly through the pipeline, reducing unnecessary delays."]},{"heading":"How to Ensure Your Sales Team Is Proficient","paras":["While Buy Cycle might seem like a subtle factor, its impact on performance can be significant. Yet, it's also one of the least developed competencies across sales teams. Objective Management Group's data shows that only 27% of salespeople are proficient in understanding how their own buying habits affect their selling.","This presents an opportunity for sales leaders to strengthen their teams:","Promote self-awareness. Encourage reps to reflect on their own buying patterns. For example, do they seek extensive information before making personal decisions? Do they delay purchases until they've considered every possible option? Helping them connect these patterns to their sales behavior is the first step."],"bullets":["Coach with purpose. Use real scenarios where a deal slowed down and explore whether Buy Cycle tendencies played a role. Focus on how the rep could have guided the prospect differently, balancing empathy with leadership in the process.","Foster a mindset of guidance, not accommodation. When reps see their role as helping the buyer make a confident, timely decision, they're less likely to let their own hesitations interfere."]},{"heading":"How Assessments Help Uncover Buy Cycle Tendencies","paras":["While coaching and discussion are valuable, Buy Cycle tendencies can be difficult to observe without objective tools. This is where structured sales evaluations come in—they provide clear insights into how a salesperson's internal beliefs, including their Buy Cycle, might affect performance.","By understanding these underlying patterns, sales leaders can provide more targeted support, helping reps break free from self-imposed obstacles and guide deals more effectively.","To explore more about competencies like Buy Cycle and how they contribute to sales success, download our 21 Core Sales Competencies White Paper."]}]}},"links":{"Desire":["will-to-sell",0],"Commitment":["will-to-sell",1],"Motivation":["will-to-sell",2],"Supportive Buy Cycle":["buy-cycle",null],"Hunting":["hunting",null],"Relationship Building":["relationship-building",null],"Value Selling":["value-selling",null],"Qualifying":["qualifying",null],"Presentation Approach":["presentation-approach",null],"Closing":["closing",null],"Sales Process":["sales-process",null],"Sales Technology":["sales-technology",null],"Coaching":["coaching",null],"Motivating":["motivating",null],"Accountability":["accountability",null],"Recruiting":["recruiting",null],"Pipeline Management":["pipeline-management",null],"Sales Posturing":["sales-posturing",null],"Negotiating":["negotiating",null],"Building Trust":["building-trust",null],"Account Management":["account-management",null],"Farming":["farming",null]}};

function compSlug(name){ var l = COMP.links[name]; return l ? l[0] : null; }
function compAnchor(name){ var l = COMP.links[name]; return l && l[1] !== null ? l[1] : null; }

function cbox(f){
  var parts = "";
  if(f.alsoFoundIn && f.alsoFoundIn.length)
    parts += '<p class="cbh">Also found in</p><ul>' +
             f.alsoFoundIn.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
  if(f.opposite && f.opposite.length)
    parts += '<p class="cbh">Opposite findings</p><ul>' +
             f.opposite.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
  return parts ? '<div class="cbox">' + parts + '</div>' : "";
}

/* the printouts use blank lines inside one finding; keep them as paragraphs */
function paras(t){
  return String(t).split(/\n\s*\n/).filter(function(x){ return x.trim(); })
          .map(function(x){ return '<p>' + esc(x.trim()) + '</p>'; }).join("");
}

function articleView(r, slug){
  var a = COMP.articles[slug];
  if(!a) return panel('<p>That reference page is not available.</p>');

  var head = (a.intro || []).map(function(x){ return '<p>' + x + '</p>'; }).join("");

  /* a competency article: jump chips, the assessments it appears in, then the findings */
  if(a.findings){
    var jump = '<div class="cjump">' + a.findings.map(function(f, i){
      return '<a href="#f' + i + '" data-jump="f' + i + '">' + esc(f.name) + '</a>';
    }).join("") + '</div>';

    var meta = (a.includedIn && a.includedIn.length)
      ? '<p class="cmeta"><b>Included in:</b> ' + a.includedIn.map(esc).join(" &middot; ") + '</p>'
      : "";

    var body = a.findings.map(function(f, i){
      return '<section class="cfind" id="f' + i + '"><h3>' + esc(f.name) + '</h3>' +
             (f.desc ? paras(f.desc) : "") + cbox(f) + '</section>';
    }).join("");

    var extra = (a.extraSections || []).map(function(x){
      return '<section class="csec">' + (x.heading ? '<h3>' + esc(x.heading) + '</h3>' : "") +
             (x.paras || []).map(function(t){ return '<p class="cmeta">' + esc(t) + '</p>'; }).join("") +
             '</section>';
    }).join("");

    return panel(head + jump + meta) + body + extra;
  }

  /* a plain article: headed sections with paragraphs and bullets */
  var secs = (a.sections || []).map(function(x, i){
    return '<section class="cfind" id="f' + i + '">' +
      (x.heading ? '<h3>' + esc(x.heading) + '</h3>' : "") +
      (x.paras || []).map(function(t){ return '<p>' + esc(t) + '</p>'; }).join("") +
      (x.bullets && x.bullets.length
        ? '<div class="cbox"><ul>' + x.bullets.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join("") + '</ul></div>'
        : "") + '</section>';
  }).join("");

  return panel(head) + secs;
}

function wireArticle(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-jump]"), function(a){
    a.addEventListener("click", function(e){
      e.preventDefault();
      var el = document.getElementById(a.getAttribute("data-jump"));
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  /* Desire / Commitment / Motivation share one article \u2014 open at their part */
  var parts = location.hash.replace(/^#/,"").split("/");
  var n = COMP.__anchor;
  COMP.__anchor = null;
  if(n !== null && n !== undefined){
    var t = document.getElementById("f" + n);
    if(t) setTimeout(function(){ t.scrollIntoView({behavior:"smooth", block:"start"}); }, 60);
  }
}

a recibida","Sent Assessment?":"¿Evaluación enviada?","Follow Up?":"¿Seguimiento?","EMAIL 1":"CORREO 1","EMAIL 2":"CORREO 2","EMAIL 3":"CORREO 3","CALL 1":"LLAMADA 1","CALL 2":"LLAMADA 2","Yes":"Sí","No":"No","Anything in red is a placeholder — click it and type over it. You can edit any other line too.":"Todo lo que está en rojo es un campo por rellenar: haz clic y escribe encima. También puedes editar cualquier otra línea.","Copy Text":"Copiar texto","Download Word Doc":"Descargar en Word","Start over":"Empezar de nuevo","Copied":"Copiado","Copy":"Copiar","Opens the original chapter PDF":"Abre el PDF original del capítulo","Writing The Ad — the chapter as a PDF":"Redactar el anuncio: el capítulo en PDF","Onboarding — the chapter as a PDF":"Acogida: el capítulo en PDF","The posting is candidate-centered, not company-centered":"El anuncio gira en torno al candidato, no a la empresa","Candidates want to know why they should consider <em>your</em> opportunity. Will the culture appeal to them? Are the benefits attractive? Is the company expanding? Are the hours flexible? Can they work remotely?":"El candidato quiere saber por qué debería plantearse <em>tu</em> oportunidad. ¿Le atraerá la cultura? ¿Son buenos los beneficios? ¿Está creciendo la empresa? ¿Hay flexibilidad horaria? ¿Puede trabajar en remoto?","A posting about your decades of history, your CEO and your shiny new products will not move a top candidate.":"Un anuncio sobre tus décadas de historia, tu consejero delegado y tus productos nuevos no mueve a un buen candidato.","You are not trying to attract hundreds of applicants. You are trying to attract a handful of highly qualified ones.":"No buscas cientos de candidaturas. Buscas un puñado de candidaturas muy cualificadas.","Use your strengths from the previous chapter as the raw material.":"Usa como materia prima los puntos fuertes del capítulo anterior.","Six things the posting must do":"Seis cosas que el anuncio tiene que hacer","Sell an exciting vision.":"Vender una visión que ilusione.","Focus on the ideal candidate, their experiences and your requirements.":"Centrarse en el candidato ideal, en su experiencia y en tus requisitos.","Talk about the hard part of the job.":"Hablar de la parte difícil del puesto.","Minimize the focus on the company, but mention critical differentiators.":"Hablar poco de la empresa, pero mencionar los diferenciadores clave.","Include the total compensation you need them to earn, and whether there is a ceiling.":"Incluir la retribución total que necesitas que gane y si hay techo.","Sound different and exciting. If it reads like every other ad, it is boring and gets a low response rate.":"Sonar distinto y atractivo. Si se lee como cualquier otro anuncio, aburre y responde poca gente.","👀 Why the money number decides your pool size — read this before you write":"👀 Por qué la cifra de dinero decide el tamaño de tu pool: léelo antes de escribir","Response depends on mixing requirements with the right income level.":"La respuesta depende de combinar los requisitos con el nivel de ingresos adecuado.","Many requirements plus “opportunity to earn more than €125,000” gives you a sizeable pool who meet the requirements and want that income.":"Muchos requisitos más «posibilidad de ganar más de 125.000 €» te da un pool amplio de gente que cumple los requisitos y quiere esos ingresos.","Same requirements at €50,000 and the pool is zero — everyone who meets the requirements is turned off by the income, and most who want €50,000 do not meet the requirements.":"Los mismos requisitos a 50.000 € y el pool es cero: a quien cumple los requisitos le echa atrás la cifra, y quien se conforma con 50.000 € no cumple los requisitos.","If your number is on the low end for your country and industry, you are advertising for entry-level salespeople.":"Si tu cifra está en la parte baja para tu país y tu sector, estás anunciando un puesto de comercial junior.","Write your ad":"Redacta tu anuncio","Sell the vision or the dream":"Vende la visión o el sueño","Make the first sentence eye-catching and aspirational.":"Que la primera frase llame la atención y sea aspiracional.","You must have prior success selling…":"Debes tener éxito previo vendiendo…","Let candidates self-select on experience. This also determines how you configure the candidate assessment.":"Deja que el candidato se autoseleccione por experiencia. Esto también determina cómo configuras la evaluación.","…to [decision maker title]":"…a [cargo del decisor]","…of [target customer]":"…de [cliente objetivo]","In a [the biggest challenge]":"En un [el mayor reto]","You have [required skills]":"Tienes [competencias requeridas]","Experience with [parallel experiences] helpful but not required.":"La experiencia en [experiencia paralela] ayuda, pero no es imprescindible.","Travel [amount] required.":"Se requiere viajar un [porcentaje].","We need you to earn more than [amount] and our top producers make [amount].":"Necesitamos que ganes más de [importe] y nuestros mejores comerciales ganan [importe].","About the company and why us — location, benefits":"Sobre la empresa y por qué nosotros: ubicación, beneficios","Call to action":"Llamada a la acción","The steps and timeframe of your process":"Los pasos y los plazos de tu proceso","Publishing your timeline is critical for a positive candidate experience.":"Publicar los plazos es clave para una buena experiencia del candidato.","👀 The sample ad, written the way it should read":"👀 El anuncio de ejemplo, escrito como debería leerse","Sample posting":"Anuncio de ejemplo","🔗 AI tools for writing and checking the ad":"🔗 Herramientas de IA para redactar y revisar el anuncio","Reduces biased language in job ads":"Reduce el lenguaje sesgado en las ofertas","Composes to your brand tone and style":"Escribe con el tono y el estilo de tu marca","Reviews ads before posting for biased language and rule compliance":"Revisa el anuncio antes de publicarlo: lenguaje sesgado y cumplimiento normativo","Free generator, multiple languages":"Generador gratuito, varios idiomas","Generates ads from role and company":"Genera anuncios a partir del puesto y la empresa","Keyword optimisation for search engines and ATS":"Optimización de palabras clave para buscadores y ATS","Free unlimited job description generator":"Generador gratuito e ilimitado de descripciones de puesto","Choose industry and tone":"Elige sector y tono","Optimized for humans and search engines":"Optimizado para personas y para buscadores","Ninety days, not one week":"Noventa días, no una semana","Even the best salespeople need to be strategically onboarded, not left to figure it out.":"Incluso los mejores comerciales necesitan una acogida planificada, no que les dejes averiguarlo solos.","A traded professional athlete still has to learn the playbook, the team culture and practice before playing. Your experienced salespeople are the same.":"Un deportista profesional que cambia de equipo también tiene que aprenderse las jugadas, la cultura del equipo y entrenar antes de jugar. Con un comercial con experiencia pasa lo mismo.","Start day one with a <strong>wow factor</strong> that validates their decision to join. Avoid paperwork and busy work on the first day.":"Empieza el primer día con un <strong>efecto wow</strong> que confirme su decisión de entrar. Evita el papeleo y las tareas de relleno.","Onboarding should occur systematically over 90 days. Define each month, then break it into weeks.":"La acogida debe desarrollarse de forma sistemática durante 90 días. Define cada mes y luego divídelo en semanas.","Every topic that has to be covered — assign an owner and a date to each":"Todos los temas que hay que cubrir: asigna un responsable y una fecha a cada uno","Company history":"Historia de la empresa","Organization structure":"Estructura de la organización","Reporting structure":"Estructura de reporte","Coaching guidelines":"Pautas de acompañamiento","Product training":"Formación de producto","Provide examples of applications":"Ejemplos de aplicaciones","Profile of a typical customer":"Perfil de un cliente tipo","Explain typical problems we solve":"Problemas típicos que resolvemos","Our value proposition":"Nuestra propuesta de valor","Our market place":"Nuestro mercado","Our pricing strategy":"Nuestra estrategia de precios","Our sales process":"Nuestro proceso de venta","Our sales cycle":"Nuestro ciclo de venta","A typical prospecting call":"Una llamada de prospección tipo","A typical sales call":"Una visita comercial tipo","Typical objections and how to handle them":"Objeciones típicas y cómo gestionarlas","Our competition":"Nuestra competencia","Their value proposition":"Su propuesta de valor","How they position themselves":"Cómo se posicionan","How we position ourselves":"Cómo nos posicionamos","How we are different":"En qué nos diferenciamos","How we are the same":"En qué nos parecemos","What they say about us":"Qué dicen de nosotros","What we say about them":"Qué decimos de ellos","Expectations":"Expectativas","KPIs":"KPI","Accountability — to whom":"Rendición de cuentas: ante quién","Plan to hit quota":"Plan para llegar al objetivo","Where to go for help":"A quién acudir para pedir ayuda","📋 Sample plan — month one":"📋 Plan de ejemplo: primer mes","Set up accounts for email, CRM, content sharing, knowledge base, cloud servers.":"Dar de alta las cuentas: correo, CRM, gestor de contenidos, base de conocimiento, servidores en la nube.","Acclimate them to the business environment and begin training on products, services, applications and installations so they develop conceptual knowledge of the business problems you solve. Tour the facility and meet everyone relevant, including the people who will manage or report to them.":"Familiarízale con el entorno del negocio y empieza la formación en productos, servicios, aplicaciones e instalaciones para que entienda a fondo los problemas de negocio que resolvéis. Enséñale las instalaciones y preséntale a todas las personas relevantes, incluidas las que le dirigirán o le reportarán.","Become certified where appropriate or required.":"Obtener las certificaciones que correspondan o sean obligatorias.","Develop personal goals and a plan with KPIs, required daily activities and tracking. Begin pipeline development and use of the CRM.":"Definir objetivos personales y un plan con KPI, actividad diaria exigida y seguimiento. Empezar a construir pipeline y a usar el CRM.","<strong>Upgrade the OMG Sales Candidate Assessment to a full coaching report.</strong> Identify weaknesses that would interfere with the plan and write a plan to overcome them.":"<strong>Amplía la evaluación de candidato de OMG a un informe completo de coaching.</strong> Identifica las debilidades que puedan interferir con el plan y escribe un plan para superarlas.","Create positioning statements for use in calling prospects.":"Crear frases de posicionamiento para usar al llamar a clientes potenciales.","Begin making calls to reach prospects at targeted opportunities. Set targets with the manager for daily meetings, calls and emails. Debrief daily to discuss challenges and obstacles, receive coaching and plan the next day — including pre-call strategizing and post-call debriefing. Review actual performance against planned activity.":"Empezar a llamar para llegar a los contactos de las oportunidades objetivo. Fijar con el responsable objetivos diarios de reuniones, llamadas y correos. Hacer un repaso diario para tratar retos y obstáculos, recibir acompañamiento y planificar el día siguiente, incluida la estrategia previa a la llamada y el repaso posterior. Comparar el resultado real con la actividad planificada.","📋 Sample plan — months two and three":"📋 Plan de ejemplo: meses dos y tres","Develop a technical foundation for products and services through continued training.":"Construir una base técnica de productos y servicios con formación continua.","Continue sales training on the value proposition and elevator pitch, sales conversations, presentations, proposals and objections.":"Seguir con la formación comercial: propuesta de valor y discurso breve, conversaciones de venta, presentaciones, propuestas y objeciones.","Include joint sales calls.":"Incluir visitas comerciales conjuntas.","Continue daily debriefs and coaching.":"Mantener los repasos diarios y el acompañamiento.","Review activity at the end of each week and hold them accountable to the agreed KPIs.":"Revisar la actividad al final de cada semana y exigir los KPI acordados.","Break the monthly plan down into weekly goals, objectives and KPIs.":"Desglosar el plan mensual en metas, objetivos y KPI semanales.","KPIs must be forward-looking":"Los KPI deben mirar hacia delante","Set a goal and record the actual at the <strong>30, 60 and 90 day</strong> benchmarks.":"Fija una meta y registra el dato real en los hitos de <strong>30, 60 y 90 días</strong>.","Use the activity metrics that drive revenue: call attempts, conversations, meetings or calls scheduled, new meetings, referrals, introductions, new opportunities, qualified opportunities, demos, proposals, quotes.":"Usa las métricas de actividad que generan ingresos: intentos de llamada, conversaciones, reuniones o llamadas agendadas, reuniones nuevas, referencias, presentaciones, oportunidades nuevas, oportunidades cualificadas, demos, propuestas y presupuestos.","Your 30 / 60 / 90 benchmarks":"Tus hitos de 30 / 60 / 90 días","KPIs you will measure":"KPI que vas a medir","30-day benchmark":"Hito de 30 días","60-day benchmark":"Hito de 60 días","90-day benchmark":"Hito de 90 días","Weekly goals, weeks 1–12":"Metas semanales, semanas 1-12","An amazing opportunity to have a life that only the top 5% get to live! ABC Co. will show you the way if you have the grit!\n\nYou must have prior success selling high-end business services to Fortune 1000 CEOs in a competitive or resistant market. You must excel at finding and closing opportunities in a 45-day sales cycle. You must work well independently, be a self-starter, accept tough coaching, and be held accountable to the agreed-upon goals.\n\nWe need you to earn at least $250,000 (no ceiling) and be willing to travel 35% of the time. Experience with executive recruiting is helpful.\n\nQualifications:\n• MBA or Bachelor's degree in business administration, human resources or similar experience.\n• Minimum of five years of experience in sales and developing customer partnerships.\n• Excellent communication skills, both written and verbal.\n• Must be able to speak executive strategy and financial statements.\n\nWho we are:\n• Our employees rate us 4.5 out of 5 on Indeed.\n• 12-month mentor program for professional development.\n• We offer health insurance.\n• 5% of our profits go to charity.\n\nSteps of our interview process:\n• Week one: submit an application\n• Week two: the screening process\n• Week three: schedule an in-person interview\n• Week four: attend the in-person interview\n• Weeks five and six: follow-up interviews\n• Week seven: meeting upper management\n• Week eight: receiving a job offer\n• Week nine: start the new job":"¡Una oportunidad increíble para tener la vida que solo vive el 5% de la gente! En ABC Co. te enseñamos el camino si tienes la garra.\n\nDebes tener éxito previo vendiendo servicios profesionales de alto valor a directores generales de grandes empresas en un mercado competitivo o reacio. Tienes que destacar encontrando y cerrando oportunidades en un ciclo de venta de 45 días. Trabajas bien de forma autónoma, tomas la iniciativa, aceptas un acompañamiento exigente y respondes de los objetivos acordados.\n\nNecesitamos que ganes al menos 250.000 € (sin techo) y que estés dispuesto a viajar un 35% del tiempo. La experiencia en selección de directivos es un plus.\n\nRequisitos:\n• MBA o grado en administración de empresas, recursos humanos o experiencia equivalente.\n• Mínimo cinco años de experiencia en ventas y en desarrollo de relaciones con clientes.\n• Excelente comunicación, escrita y oral.\n• Capacidad para hablar de estrategia y de cuentas con la dirección.\n\nQuiénes somos:\n• Nuestra plantilla nos puntúa 4,5 sobre 5.\n• Programa de mentoría de 12 meses para tu desarrollo profesional.\n• Seguro médico privado.\n• Destinamos el 5% de nuestros beneficios a causas sociales.\n\nPasos de nuestro proceso de selección:\n• Semana 1: envías tu candidatura\n• Semana 2: proceso de criba\n• Semana 3: agendamos la entrevista presencial\n• Semana 4: entrevista presencial\n• Semanas 5 y 6: entrevistas de seguimiento\n• Semana 7: reunión con dirección\n• Semana 8: recibes la oferta\n• Semana 9: te incorporas","BDM English":"BDM Inglés","BDM German":"BDM Alemán","BDM Spanish":"BDM Español"},"de":{"Hubexo Sales Hiring Hub":"Hubexo · Portal für Vertriebsrecruiting","Continental Europe":"Kontinentaleuropa","Findings Reference":"Kompetenz-Referenz","Filter competencies":"Kompetenzen filtern","No competency matches that.":"Keine Kompetenz passt dazu.","All sessions":"Alle Sessions","Chapters":"Kapitel","Outline":"Übersicht","Process Checklist":"Prozess-Checkliste","Email Templates":"E-Mail-Vorlagen","Training Sessions":"Schulungsvideos","Hiring Mini-Course":"Minikurs Recruiting","Writing The Ad":"Anzeige schreiben","Onboarding Plan":"Onboarding-Plan","Applicant Tracking Sheet":"Bewerber-Tracking","Hiring Process - Simple Checklist:":"Einstellungsprozess – die einfache Checkliste","Write & Post The Ad":"Anzeige schreiben und veröffentlichen","(Indeed/LinkedIn/ZipRecruiter… whatever platform you use)":"(Indeed/LinkedIn/ZipRecruiter… welche Plattform Sie auch nutzen)","How to Write the Ad":"So schreiben Sie die Anzeige","link":"Link","Applications Come In":"Bewerbungen gehen ein","Send The Assessment Email":"Assessment-E-Mail versenden","Add to Tracking Sheet Immediately":"Sofort in die Tracking-Liste eintragen","(If you have an Applicant Tracking System, use that)":"(Wenn Sie ein Bewerbermanagementsystem haben, nutzen Sie das)","If resume looks great, put “Yes” for follow up":"Wenn der Lebenslauf überzeugt: «Ja» beim Nachfassen","If resume doesn’t look great, put “No” for follow up":"Wenn der Lebenslauf nicht überzeugt: «Nein» beim Nachfassen","Follow up with the good ones 3-5 times":"Bei den Guten drei- bis fünfmal nachfassen","The goal is to get as many completed assessments as possible.":"Ziel sind so viele abgeschlossene Assessments wie möglich.","When you get a “Recommended” Candidate, Schedule interview ASAP":"Sobald ein Kandidat als «Empfohlen» zurückkommt: Gespräch schnellstmöglich ansetzen","Interview Process":"Interviewprozess","(the five steps are below)":"(die fünf Schritte stehen unten)","90 Day Onboarding - Absolutely Key":"90-Tage-Onboarding – absolut entscheidend","Example Applicant Tracking Sheet":"Beispiel Bewerber-Tracking","Fill it in here, or download it as a spreadsheet":"Hier ausfüllen oder als Tabelle herunterladen","Open the Interview Guide":"Interview-Leitfaden öffnen","Questions by competency for the first interview":"Fragen nach Kompetenz für das erste Gespräch","Interview Process — the five steps":"Interviewprozess – die fünf Schritte","The five steps":"Die fünf Schritte","Five-minute phone interview":"Fünfminütiges Telefoninterview","Purpose: qualify the candidate quickly.":"Zweck: den Kandidaten schnell qualifizieren.","What you are listening for:":"Worauf Sie achten:","How they sound on the phone — tone, clarity, presence.":"Wie er am Telefon klingt – Ton, Klarheit, Präsenz.","Whether they can build rapport.":"Ob er einen Draht aufbauen kann.","Whether their experience matches the ad.":"Ob seine Erfahrung zur Anzeige passt.","How they handle push-back or a put-off.":"Wie er mit Widerspruch oder einer Vertröstung umgeht.","First interview":"Erstes Gespräch","Objective: validate the assessment and the resume through live conversation.":"Ziel: Assessment und Lebenslauf im echten Gespräch überprüfen.","Push back on the resume. Check for accuracy, patterns and truth.":"Hinterfragen Sie den Lebenslauf. Prüfen Sie Genauigkeit, Muster und Wahrheitsgehalt.","Evaluate soft skills and cultural fit.":"Bewerten Sie Soft Skills und kulturelle Passung.","Watch body language, confidence and conversation flow.":"Achten Sie auf Körpersprache, Selbstsicherheit und Gesprächsfluss.","Do not discuss compensation or benefits at this stage.":"Sprechen Sie in dieser Phase nicht über Vergütung oder Zusatzleistungen.","Final interview":"Abschlussgespräch","Goals: sell the opportunity, introduce key stakeholders, confirm mutual fit and close the candidate.":"Ziele: die Chance verkaufen, wichtige Ansprechpartner vorstellen, die beidseitige Passung bestätigen und den Kandidaten gewinnen.","Cover job expectations, compensation, the sales cycle, who they report to, and what a typical client looks like.":"Klären Sie Erwartungen an die Rolle, Vergütung, Vertriebszyklus, Berichtsweg und wie ein typischer Kunde aussieht.","Job offer":"Angebot","Be ready to make the offer at the end of the final interview if it has gone well.":"Seien Sie bereit, das Angebot am Ende des Abschlussgesprächs zu machen, wenn es gut gelaufen ist.","The offer must match what was discussed. No surprises.":"Das Angebot muss dem Besprochenen entsprechen. Keine Überraschungen.","Onboarding preparation":"Onboarding vorbereiten","Once the offer is accepted, shift straight into onboarding.":"Sobald das Angebot angenommen ist, geht es direkt ins Onboarding.","Clarify daily, weekly and monthly expectations.":"Klären Sie tägliche, wöchentliche und monatliche Erwartungen.","Train on product, market, competition, sales process and positioning.":"Schulen Sie Produkt, Markt, Wettbewerb, Vertriebsprozess und Positionierung.","Assign coaching responsibilities and onboarding milestones.":"Legen Sie Verantwortliche für das Coaching und Onboarding-Meilensteine fest.","“Recommended” does not mean automatic hire.":"«Empfohlen» heißt nicht automatisch Einstellung.","If the candidate sounds poor on the phone, interview hat drive revenue: call attempts, conversations, meetings or calls scheduled, new meetings, referrals, introductions, new opportunities, qualified opportunities, demos, proposals, quotes.":"Nutzen Sie die Aktivitätskennzahlen, die Umsatz treiben: Anrufversuche, Gespräche, vereinbarte Termine oder Calls, neue Termine, Empfehlungen, Vorstellungen, neue Opportunities, qualifizierte Opportunities, Demos, Angebote, Kalkulationen.","Your 30 / 60 / 90 benchmarks":"Ihre Marken bei 30 / 60 / 90 Tagen","KPIs you will measure":"KPIs, die Sie messen","30-day benchmark":"Marke 30 Tage","60-day benchmark":"Marke 60 Tage","90-day benchmark":"Marke 90 Tage","Weekly goals, weeks 1–12":"Wochenziele, Wochen 1–12","An amazing opportunity to have a life that only the top 5% get to live! ABC Co. will show you the way if you have the grit!\n\nYou must have prior success selling high-end business services to Fortune 1000 CEOs in a competitive or resistant market. You must excel at finding and closing opportunities in a 45-day sales cycle. You must work well independently, be a self-starter, accept tough coaching, and be held accountable to the agreed-upon goals.\n\nWe need you to earn at least $250,000 (no ceiling) and be willing to travel 35% of the time. Experience with executive recruiting is helpful.\n\nQualifications:\n• MBA or Bachelor's degree in business administration, human resources or similar experience.\n• Minimum of five years of experience in sales and developing customer partnerships.\n• Excellent communication skills, both written and verbal.\n• Must be able to speak executive strategy and financial statements.\n\nWho we are:\n• Our employees rate us 4.5 out of 5 on Indeed.\n• 12-month mentor program for professional development.\n• We offer health insurance.\n• 5% of our profits go to charity.\n\nSteps of our interview process:\n• Week one: submit an application\n• Week two: the screening process\n• Week three: schedule an in-person interview\n• Week four: attend the in-p var LANG_NAMES = {en:"English", es:"Español", de:"Deutsch"};
var LANG = "en";
try{ LANG = localStorage.getItem("hubexo-hub-lang") || "en"; }catch(e){}

/* the editable email body is already written in its own language, and the
   training outlines describe English-language recordings — leave both alone */
var NO_TRANSLATE = {"em-out":1, "ad-out":1, "yt-host":1};

function langsFor(r){ return (r && r.langs) || null; }

function tr(str){
  var d = I18N[LANG];
  if(!d) return str;
  var k = String(str).trim();
  return d[k] || str;
}

/* A handful of strings carry inline <em> / <strong>, so they arrive as two or
   three separate text nodes and the whole-string key never matches. Match the
   element's innerHTML first; the walk below then skips what this already did. */
var MARKUP_HOSTS = ".chpoints li, .chlabel, .chfields .fl, .chfields .fh";
function translateMarkup(root, d){
  Array.prototype.forEach.call(root.querySelectorAll(MARKUP_HOSTS), function(el){
    if(el.children.length === 0) return;      /* plain text — the walk handles it */
    var hit = d[el.innerHTML.trim()];
    if(hit) el.innerHTML = hit;
  });
}

function translateTree(root){
  var d = I18N[LANG];
  if(!d || !root) return;
  translateMarkup(root, d);
  var walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      for(var p = n.parentNode; p && p !== root; p = p.parentNode){
        if(p.id && NO_TRANSLATE[p.id]) return NodeFilter.FILTER_REJECT;
        if(p.classList && p.classList.contains("osec")) return NodeFilter.FILTER_REJECT;
        if(p.classList && p.classList.contains("chips")) return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var n, hits = 0;
  while((n = walk.nextNode())){
    var raw = n.nodeValue, k = raw.trim();
    if(!k) continue;
    var hit = d[k];
    if(hit){ n.nodeValue = raw.replace(k, hit); hits++; }
  }
  /* placeholders and titles live in attributes, not text nodes */
  Array.prototype.forEach.call(root.querySelectorAll("[placeholder]"), function(el){
    var v = d[el.getAttribute("placeholder")]; if(v) el.setAttribute("placeholder", v);
  });
  return hits;
}

/* the nav tiles carry their label as artwork, so each language has its own set */
function localiseTiles(root){
  if(LANG === "en" || !root) return;
  Array.prototype.forEach.call(root.querySelectorAll(".navtile img"), function(img){
    var src = img.getAttribute("src");
    if(src.indexOf("/nav/") === -1 || src.indexOf("/nav/" + LANG + "/") !== -1) return;
    img.setAttribute("src", src.replace("/nav/", "/nav/" + LANG + "/"));
    img.setAttribute("alt", tr(img.getAttribute("alt") || ""));
  });
}

function paintLangPick(r){
  var box = document.getElementById("langpick");
  var langs = langsFor(r);
  if(!langs){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = langs.map(function(l){
    var on = (l === LANG);
    return '<button data-lang="' + l + '"' + (on ? ' class="on" style="background:' + grad(r) + '"' : '') +
           '>' + LANG_NAMES[l] + '</button>';
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll("[data-lang]"), function(b){
    b.addEventListener("click", function(){
      LANG = b.getAttribute("data-lang");
      try{ localStorage.setItem("hubexo-hub-lang", LANG); }catch(e){}
      route();
    });
  });
}

/* ==========================================================================
   ROUTER
   ========================================================================== */
function route(){
  var parts = location.hash.replace(/^#/,"").split("/").filter(Boolean);
  var r = parts.length ? findRegion(parts[0]) : null;
  var s = (r && parts[1]) ? findSection(parts[1]) : null;
  var view = document.getElementById("view");

  if(!r){
    document.documentElement.setAttribute("data-view","home");
    view.innerHTML = homeView();
    document.title = "Hubexo Sales Hiring Hub";
  } else if(!s){
    document.documentElement.setAttribute("data-view","region");
    view.innerHTML = regionView(themed(r));
    document.title = r.name + " — Hubexo Sales Hiring Hub";
  } else if(s.href){
    /* link-only section (Hiring Mini-Course) — bounce straight out */
    window.location.replace(s.href);
    return;
  } else {
    document.documentElement.setAttribute("data-view","section");
    view.innerHTML = sectionView(themed(r),s);
    document.title = s.title + " — " + r.name;
    if(s.key === "emails")   wireEmail(themed(r));
    if(s.key === "tracking") wireTracking(themed(r));
    if(s.key === "training") wireTraining(themed(r));
    if(s.key === "rewritten-ads") wireAds(themed(r));
    if(s.key === "writing-ad" || s.key === "onboarding") wireChapter();
    if(s.key === "omg-overview") wireClip();
    if(s.key === "findings"){
      var fp = location.hash.replace(/^#/,"").split("/");
      if(fp[2] && COMP.articles[fp[2]]) wireArticle(); else wireFindings();
    }
    wireChecks();
  }
  wireCopy();

  /* English first, then swap — see the LANGUAGE block above */
  if(!langsFor(r)) LANG = "en";
  paintLangPick(r ? themed(r) : null);
  if(LANG !== "en"){
    translateTree(view);
    localiseTiles(view);
    document.title = document.title.split(" — ").map(tr).join(" — ");
  }
  document.documentElement.setAttribute("lang", LANG);

  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ==========================================================================
   WIRING
   ========================================================================== */
function wireCopy(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function(b){
    b.addEventListener("click", function(){
      var t = (window.__COPY || {})[b.getAttribute("data-copy")] || "";
      /* copy what the reader sees, not the English source */
      t = tr(t);
      copyText(t, b, tr("Copied"), tr("Copy"));
    });
  });
}

function wireChecks(){
  Array.prototype.forEach.call(document.querySelectorAll("input[data-k]"), function(cb){
    var k = cb.getAttribute("data-k");
    var on = cb.style.getPropertyValue("--on") || "#321432";
    try{ if(localStorage.getItem("hx:" + k) === "1") cb.checked = true; }catch(e){}
    if(cb.checked) cb.style.background = on;
    cb.addEventListener("change", function(){
      cb.style.background = cb.checked ? on : "";
      try{ localStorage.setItem("hx:" + k, cb.checked ? "1" : "0"); }catch(e){}
    });
  });
}

function wireEmail(r){
  EM.region = r;
  emLoad();
  var valid = r.options.some(function(o){ return o.key === EM.opt; });
  if(!valid) EM.opt = (r.options[0] || {}).key;

  /* the language toggle, where the region has one */
  var langs = emLangsFor(r);
  if(langs && langs.indexOf(EM.lang) === -1) EM.lang = langs[0];

  var box = document.getElementById("em-langs");
  function paintOpts(){
    box.innerHTML = r.options.map(function(o){
      var on = (o.key === EM.opt);
      return '<button class="langbtn' + (on ? " on" : "") + '" data-opt="' + o.key + '"' +
             (on ? ' style="background:' + grad(r) + ';color:' + r.ink + '"' : "") + '>' +
             esc(o.emLabel || o.label) + '</button>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("[data-opt]"), function(b){
      b.addEventListener("click", function(){
        EM.opt = b.getAttribute("data-opt");
        emSave(); paintOpts(); emRender();
      });
    });
  }

  var lbox = document.getElementById("em-lang-row");
  function paintLangs(){
    if(!lbox || !langs) return;
    lbox.innerHTML = langs.map(function(l){
      var t = EMAIL_COPY[l]; if(!t) return "";
      var on = (l === EM.lang);
      return '<button data-emlang="' + l + '"' + (on ? ' class="on" style="background:' + grad(r) + ';color:' + r.ink + '"' : "") +
             '>' + esc(t.name) + '</button>';
    }).join("");
    Array.prototype.forEach.call(lbox.querySelectorAll("[data-emlang]"), function(b){
      b.addEventListener("click", function(){
        EM.lang = b.getAttribute("data-emlang");
        emSave(); paintLangs(); emRender();
      });
    });
  }

  paintOpts();
  paintLangs();
  emRender();

  /* a placeholder stops being red the moment it is edited */
  var out = document.getElementById("em-out");
  out.addEventListener("input", function(){
    Array.prototype.forEach.call(out.querySelectorAll("[data-ph]"), function(sp){
      if(sp.textContent.trim() !== sp.getAttribute("data-ph")){
        sp.className = sp.className.replace(/\btoken\b/, "").trim();
        sp.removeAttribute("data-ph");
      }
    });
  });

  document.getElementById("em-copy").addEventListener("click", function(){
    copyText(emText(), this, tr("Copied"), tr("Copy Text"));
  });
  document.getElementById("em-docx").addEventListener("click", function(){ downloadDocx("em-out"); });
  document.getElementById("em-reset").addEventListener("click", function(){
    if(!confirm("Put the template back the way it started?")) return;
    emRender();
  });
}

   COPY

function copyText(text, btn, doneLabel, restoreLabel){
  var prevBg = btn.style.background;
  function ok(){
    btn.textContent = doneLabel;
    btn.classList.add("done");
    if(!prevBg) btn.style.background = btn.style.getPropertyValue("--on") || "#321432";
    setTimeout(function(){
      btn.textContent = restoreLabel;
      btn.classList.remove("done");
      btn.style.background = prevBg;
    }, 1600);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){}
  document.body.removeChild(ta);
}

/* ==========================================================================
   Word (.docx) builder — no libraries, builds a real zip
   ========================================================================== */
var CRC_TABLE=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function sb(s){var o=[],i,cp;for(i=0;i<s.length;i++){cp=s.charCodeAt(i);
  if(cp<0x80)o.push(cp);
  else if(cp<0x800){o.push(0xC0|(cp>>6),0x80|(cp&63));}
  else if(cp>=0xD800&&cp<=0xDBFF){var lo=s.charCodeAt(++i);var u=0x10000+((cp-0xD800)<<10)+(lo-0xDC00);o.push(0xF0|(u>>18),0x80|((u>>12)&63),0x80|((u>>6)&63),0x80|(u&63));}
  else{o.push(0xE0|(cp>>12),0x80|((cp>>6)&63),0x80|(cp&63));}}
  return new Uint8Array(o);}
function zipFiles(files){
  var chunks=[],central=[],offset=0;
  function u16(n){return [n&255,(n>>8)&255];}
  function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];}
  files.forEach(function(f){
    var name=sb(f.name),data=sb(f.data),c=crc32(data);
    var lh=[].concat([80,75,3,4],u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(data.length),u32(data.length),u16(name.length),u16(0));
    chunks.push(new Uint8Array(lh),name,data);
    central.push([].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset)),name);
    offset+=lh.length+name.length+data.length;
  });
  var cd=[],cdStart=offset,cdLen=0;
  for(var i=0;i<central.length;i+=2){cd.push(new Uint8Array(central[i]),central[i+1]);}
  cd.forEach(function(b){cdLen+=b.length;});
  var eocd=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(files.length),u16(files.length),u32(cdLen),u32(cdStart),u16(0)));
  var all=chunks.concat(cd,[eocd]),total=0;
  all.forEach(function(b){total+=b.length;});
  var out=new Uint8Array(total),p=0;
  all.forEach(function(b){out.set(b,p);p+=b.length;});
  return out;
}
function xe(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");}
function wr(t,b){return '<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/>'+(b?'<w:b/>':'')+'</w:rPr><w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>';}
function wp(r,bullet){
  return '<w:p><w:pPr>'+(bullet?'<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>':'')+'<w:spacing w:after="0" w:line="259" w:lineRule="auto"/></w:pPr>'+r+'</w:p>';
}
function wblank(){return wp("");}

var DOCX_LINK = "";
function wlink(t){
  return '<w:hyperlink r:id="rIdLink"><w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>'
       + '<w:sz w:val="22"/><w:color w:val="0563C1"/><w:u w:val="single"/></w:rPr>'
       + '<w:t xml:space="preserve">' + xe(t) + '</w:t></w:r></w:hyperlink>';
}
function runsFrom(node){
  var s = "";
  Array.prototype.forEach.call(node.childNodes, function(c){
    if(c.nodeType === 3){ s += wr(c.nodeValue); return; }
    if(c.nodeType !== 1) return;
    if(c.tagName === "BR") return;
    if(c.tagName === "A"){ s += wlink(c.textContent); return; }
    if(c.tagName === "B" || c.tagName === "STRONG"){ s += wr(c.textContent, true); return; }
    s += runsFrom(c);
  });
  return s;
}
function buildDocx(id){
  /* built from what is on screen, so the reader's edits come through */
  var el = document.getElementById(id || "em-out");
  var a  = el ? el.querySelector("a[href]") : null;
  var isUrl = !!(a && /^https?:\/\//i.test(a.getAttribute("href") || ""));
  DOCX_LINK = isUrl ? a.getAttribute("href") : "";
  var b = "";
  if(el) Array.prototype.forEach.call(el.childNodes, function(n){
    if(n.nodeType !== 1) return;
    if(n.tagName === "UL"){
      Array.prototype.forEach.call(n.children, function(li){ b += wp(runsFrom(li), true); });
      return;
    }
    b += wp(runsFrom(n));
    if(String(n.className).indexOf("tight") === -1) b += wblank();
  });

  var doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>'
    + b + '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>';

  var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
    + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';

  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';

  var drels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
    + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + (isUrl ? '<Relationship Id="rIdLink" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + xe(DOCX_LINK) + '" TargetMode="External"/>' : "")
    + '</Relationships>';

  var numbering = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="&#8226;"/>'
    + '<w:lvlJc w:val="left"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr>'
    + '<w:rPr><w:rFonts w:ascii="Symbol" w:hAnsi="Symbol" w:hint="default"/></w:rPr></w:lvl></w:abstractNum>'
    + '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>';

  var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults>'
    + '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>';

  return zipFiles([
    {name:"[Content_Types].xml",     data:ct},
    {name:"_rels/.rels",             data:rels},
    {name:"word/document.xml",       data:doc},
    {name:"word/_rels/document.xml.rels", data:drels},
    {name:"word/numbering.xml",      data:numbering},
    {name:"word/styles.xml",         data:styles}
  ]);
}

function downloadDocx(id, filename){
  var bytes = buildDocx(id);
  var blob  = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  var a     = document.createElement("a");
  var name  = filename || ("Email Template - " + (emOpt().label || "BDM") +
                           (emLangsFor(EM.region) ? " (" + emCopy().name + ")" : "") + ".docx");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
}

var SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z"/></svg>';
function paintTheme(){
  document.getElementById("theme").innerHTML =
    document.documentElement.getAttribute("data-theme") === "dark" ? SUN : MOON;
}
/* Always opens light. Dark only if the reader has toggled it on this browser. */
try{
  if(localStorage.getItem("hubexo-hub-theme") === "dark")
    document.documentElement.setAttribute("data-theme","dark");
}catch(e){}
document.getElementById("theme").addEventListener("click", function(){
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("hubexo-hub-theme", next); }catch(e){}
  paintTheme();
});

paintTheme();
route();
