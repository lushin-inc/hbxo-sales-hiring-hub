<!DOCTYPE html>
<html lang="en" data-theme="light" data-view="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Hubexo Sales Hiring Hub</title>
<link rel="icon" href="Assets/OS Icons/Light Blue Lushin.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   HUBEXO BRAND PALETTE
   plum #321432 · atomic yellow #DCFF3C · earth #F7F7F2
   blue #008CFF · red #E6284B · orange #FF8700 · purple #A54CFF
   ========================================================================== */
:root{
  --bg:#F7F7F2;
  --surface:#FFFFFF;
  --plate:#FFFFFF;
  --line:#E7E5DF;
  --line-soft:#F0EFE9;
  --ink:#321432;
  --ink-2:#6B5A6B;
  --ink-3:#9E909E;
  --hover:#EFEEE8;
  --zebra:#F7F8FA;
  --accentring:rgba(0,140,255,.45);
  --shadow:0 1px 2px rgba(50,20,50,.05), 0 10px 28px -18px rgba(50,20,50,.4);
}
html[data-theme="dark"]{
  --bg:#1A0A1A;
  --surface:#261026;
  --plate:#FFFFFF;
  --line:#3C213C;
  --line-soft:#2E162E;
  --ink:#F7F7F2;
  --ink-2:#C4B0C4;
  --ink-3:#8F7C8F;
  --hover:#301630;
  --zebra:#20122A;
  --accentring:rgba(0,140,255,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.75);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:Poppins,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

.wrap{
  width:100%;max-width:min(1900px,94vw);margin:0 auto;padding:26px 40px 40px;
  flex:1;display:flex;flex-direction:column;min-height:0;
}
#view{flex:1;display:flex;flex-direction:column;min-height:0;}
html[data-view="home"] #view{justify-content:center;padding-bottom:3vh;}
/* section pages read like documents — hold them to a comfortable measure */
html[data-view="section"] .wrap{max-width:min(1120px,94vw);}

/* ==========================================================================
   HEADER
   ========================================================================== */
.pagehead{display:flex;align-items:center;gap:18px;margin:0 0 26px;flex:0 0 auto;}
.marks{display:flex;align-items:center;gap:17px;}
.hx{display:block;height:23px;width:auto;color:var(--ink);}
.marks .div{width:1px;height:26px;background:var(--line);}
.lu img{height:27px;width:auto;display:block;}
.lu .dk{display:none;}
html[data-theme="dark"] .lu .lt{display:none;}
html[data-theme="dark"] .lu .dk{display:block;}

.iconbtn{
  margin-left:auto;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.iconbtn:hover{background:var(--hover);color:var(--ink);}

/* ---- language toggle (Continental Europe) ---- */
.langpick{
  margin-left:auto;display:inline-flex;gap:3px;padding:4px;
  border:1px solid var(--line);background:var(--surface);border-radius:13px;
  box-shadow:var(--shadow);
}
.langpick + .iconbtn{margin-left:12px;}
.langpick button{
  border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  font:inherit;font-size:15px;font-weight:600;letter-spacing:-.005em;
  padding:9px 18px;border-radius:10px;line-height:1.1;white-space:nowrap;
  transition:background .12s ease,color .12s ease;
}
.langpick button:hover{color:var(--ink);background:var(--hover);}
.langpick button.on{color:#fff;}
.langpick button.on:hover{color:#fff;}
@media (max-width:820px){
  .pagehead{flex-wrap:wrap;}
  .langpick{margin-left:0;order:3;width:100%;}
  .langpick button{flex:1;padding:9px 6px;font-size:14px;}
}
.iconbtn svg{width:18px;height:18px;display:block;}

.page-title{
  font-size:21px;font-weight:500;letter-spacing:-.01em;
  color:var(--ink-2);margin:0 0 20px;flex:0 0 auto;
}

/* ==========================================================================
   HOME — region chooser
   ========================================================================== */
.regions{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;}
.region{
  aspect-ratio:5/7;max-height:68vh;border-radius:24px;
  display:flex;align-items:flex-end;padding:30px 26px;
  transition:transform .16s ease;
}
.region:hover{transform:translateY(-5px);}
.region .rn{font-size:32px;font-weight:600;letter-spacing:-.022em;line-height:1.12;}

/* ==========================================================================
   BANNER — region + section headers
   ========================================================================== */
.banner{border-radius:24px;padding:42px 36px;margin:0 0 26px;flex:0 0 auto;}
.banner .eyebrow{font-size:15px;font-weight:200;opacity:.82;margin:0 0 6px;}
.banner h1{font-size:46px;font-weight:600;letter-spacing:-.026em;line-height:1.08;margin:0;}
.banner.sec{padding:30px 32px;}
.banner.sec h1{font-size:34px;}

.backlink{
  display:inline-flex;align-items:center;gap:8px;
  font-size:14.5px;font-weight:400;color:var(--ink-3);
  margin:0 0 18px;transition:color .12s ease;
}
.backlink:hover{color:var(--ink);}
.backlink svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ==========================================================================
   REGION PAGE — assessment buttons + nav tiles
   ========================================================================== */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 30px;}
.role{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-radius:16px;padding:22px 26px;
  color:#fff;font-size:19px;font-weight:600;letter-spacing:-.012em;
  transition:transform .14s ease,filter .14s ease;
}
.role:hover{transform:translateY(-3px);filter:brightness(1.06);}
.role svg{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8;}

.navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.navtile{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  display:flex;align-items:center;justify-content:center;
  min-height:168px;
  box-shadow:var(--shadow);
  transition:transform .14s ease,box-shadow .14s ease;
}
.navtile:hover{transform:translateY(-4px);}
/* an odd tile left alone on the last row stretches rather than sitting orphaned */
.navgrid .navtile:nth-child(3n+1):last-child{grid-column:1/-1;min-height:118px;}
.navgrid .navtile:nth-child(3n+1):last-child img{max-width:230px;}
.navtile img{width:100%;max-width:300px;height:auto;display:block;}
/* the artwork is transparent with dark ink — flip its lightness in dark mode
   so it reads on the dark tile while keeping the icon hues */
html[data-theme="dark"] .navtile img{filter:invert(1) hue-rotate(180deg) brightness(1.08);}
.navtile.wide{min-height:96px;padding:12px;margin:0 0 20px;}
.navtile.wide img{max-width:196px;}

/* ==========================================================================
   SECTION PAGE — document styling
   ========================================================================== */
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:30px 34px;margin-bottom:18px;
  box-shadow:var(--shadow);
}
.panel h2{
  font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25;
  margin:0 0 18px;color:var(--ink);
}
.panel h3{
  font-size:17px;font-weight:600;letter-spacing:-.01em;
  margin:24px 0 10px;color:var(--ink);
}
.panel h3:first-child{margin-top:0;}
.panel p{font-size:16.5px;line-height:1.68;color:var(--ink-2);margin:0 0 14px;}
.panel p:last-child{margin-bottom:0;}
.panel ul{margin:0 0 14px;padding-left:22px;}
.panel li{font-size:16.5px;line-height:1.68;color:var(--ink-2);margin-bottom:8px;padding-left:4px;}
.panel li::marker{color:var(--ink-3);}
.panel strong{font-weight:600;color:var(--ink);}
.panel a.inline{border-bottom:1.5px solid currentColor;padding-bottom:1px;font-weight:500;}

.lead{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 22px;}
.doc [contenteditable]{outline:none;}
.doc [contenteditable]:focus-visible{outline:none;}
.edithint{font-size:14px;color:var(--ink-3);margin:14px 0 0;}

/* ==========================================================================
   TRAINING SESSIONS
   ========================================================================== */
.vidgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.vidcard{
  display:block;border-radius:16px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .16s ease,box-shadow .16s ease;
}
.vidcard:hover{transform:translateY(-4px);}
.vidcard .thumb{position:relative;display:block;}
.vidcard img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;}
.vidcard .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .16s ease;background:rgba(4,18,44,.30);
}
.vidcard:hover .play{opacity:1;}
.vidcard .play span{
  width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;
}
.vidcard .play svg{width:22px;height:22px;fill:#04122c;margin-left:3px;}


.stage{
  width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 20px 52px -26px rgba(4,18,44,.7);margin:0 0 26px;
}
.stage iframe{display:block;width:100%;height:100%;border:0;}

.shead{
  font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:30px 0 14px;
}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.chip{
  display:flex;align-items:baseline;gap:12px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink-2);
  transition:border-color .12s ease,color .12s ease,background .12s ease;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink);background:var(--hover);}
.chip .ct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;}
.chip .cl{font-size:15px;font-weight:500;line-height:1.35;}

/* ---- the slim video bar that sits with the region grid ---- */
.watchbar{
  display:flex;align-items:center;gap:16px;width:100%;
  border-radius:16px;padding:20px 24px;margin:20px 0 0;
  text-decoration:none;transition:transform .13s ease,filter .13s ease;
}
.watchbar:hover{transform:translateY(-3px);filter:brightness(1.05);}
.watchbar .wp{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.22);display:grid;place-items:center;
}
.watchbar .wp svg{width:17px;height:17px;fill:currentColor;margin-left:2px;}
/* an outline glyph brings its own stroke and must not be filled */
.watchbar .wp svg[stroke]{fill:none;margin-left:0;width:18px;height:18px;}
.watchbar .wt{font-size:19px;font-weight:600;letter-spacing:-.015em;}
.watchbar .wa{margin-left:auto;flex:0 0 auto;opacity:.85;}
.watchbar .wa svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;}

/* timestamps stay visible when the player cannot be seeked from the page */
/* ---- findings reference ---- */
.ffilter{
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 16px;margin:0 0 6px;transition:border-color .12s ease;
}
.ffilter:focus{outline:none;border-color:var(--ink-3);}
.fnone{font-size:15.5px;color:var(--ink-3);margin:16px 0 0;}
.frow .fn a{
  border-bottom:1.5px solid var(--accentring);padding-bottom:1px;
  transition:color .12s ease,border-color .12s ease;
}
.frow .fn a:hover{color:var(--accentText,inherit);border-color:currentColor;}

/* ---- one competency article ---- */
.cjump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px;}
.cjump a{
  font-size:14.5px;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  transition:border-color .12s ease,color .12s ease,background .12s ease;
}
.cjump a:hover{border-color:var(--ink-3);color:var(--ink);background:var(--hover);}
.cmeta{font-size:14.5px;color:var(--ink-3);margin:18px 0 0;line-height:1.55;}
.cmeta b{font-weight:600;color:var(--ink-2);}
.cfind{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:24px 26px;margin:0 0 14px;box-shadow:var(--shadow);scroll-margin-top:18px;
}
.cfind h3{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 10px;color:var(--ink);}
.cfind p{font-size:16.5px;line-height:1.62;color:var(--ink-2);margin:0 0 11px;}
.cfind p:last-child{margin-bottom:0;}
.cbox{
  margin:16px 0 0;padding:14px 18px;border-radius:12px;
  border-left:3px solid var(--line);background:var(--hover);
}
.cbox .cbh{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 7px;
}
.cbox .cbh + ul{margin:0 0 14px;}
.cbox ul{list-style:none;margin:0;padding:0;}
.cbox li{
  position:relative;padding-left:15px;margin:0 0 4px;
  font-size:14.5px;line-height:1.5;color:var(--ink-2);
}
.cbox li::before{
  content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;
  border-radius:50%;background:var(--ink-3);opacity:.6;
}
.csec{margin:0 0 14px;}
.csec h3{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 10px;color:var(--ink);}
@media (max-width:820px){
  .cfind{padding:20px 18px;border-radius:14px;}
}
.fgroup{margin:26px 0 0;}
.fgroup:first-of-type{margin-top:22px;}
.fglabel{
  font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 10px;
}
.frow{
  display:grid;grid-template-columns:250px 1fr;gap:10px 24px;
  padding:14px 0;border-top:1px solid var(--line);
}
.frow .fn{font-size:16.5px;font-weight:600;color:var(--ink);line-height:1.4;}
.frow .fd{font-size:16.5px;line-height:1.6;color:var(--ink-2);}
@media (max-width:820px){
  .frow{grid-template-columns:1fr;gap:4px;padding:13px 0;}
}

.tchip.static,.tmini.static,.chip.static{cursor:default;}
.tchip.static:hover,.tmini.static:hover{filter:none;}
@media (max-width:640px){
  .watchbar{padding:17px 18px;gap:13px;}
  .watchbar .wt{font-size:17px;}
}

.osec{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:26px 28px;margin:0 0 18px;box-shadow:var(--shadow);
}
.osec-h{display:flex;align-items:flex-start;gap:14px;margin:0 0 16px;}
.osec-h h3{font-size:21px;font-weight:600;letter-spacing:-.018em;line-height:1.3;margin:0;color:var(--ink);}
.tchip{
  flex:0 0 auto;border:0;border-radius:9px;padding:6px 11px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  color:#fff;transition:filter .12s ease;
}
.tchip:hover{filter:brightness(1.12);}
.pts{list-style:none;margin:0;padding:0;}
.pts > li{display:flex;gap:13px;align-items:flex-start;margin:0 0 13px;}
.pts > li:last-child{margin-bottom:0;}
.pts p{margin:0;font-size:16.5px;line-height:1.62;color:var(--ink-2);}
.tmini{
  flex:0 0 auto;margin-top:2px;
  border:1.5px solid;border-radius:999px;padding:2px 9px;cursor:pointer;
  font:inherit;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:transparent;transition:filter .12s ease;
}
.tmini:hover{filter:brightness(.85);}
.subs{list-style:none;margin:8px 0 0;padding:0;}
.subs li{
  position:relative;padding-left:16px;margin:0 0 5px;
  font-size:15px;line-height:1.55;color:var(--ink-3);
}
.subs li::before{
  content:"";position:absolute;left:2px;top:.68em;width:4px;height:4px;
  border-radius:50%;background:var(--ink-3);opacity:.6;
}
.oquote{
  margin:18px 0 0;padding:14px 18px;border-radius:12px;border-left:4px solid;
  font-size:16.5px;line-height:1.55;font-style:italic;color:var(--ink);
}
.oquote .tmini{font-style:normal;margin-left:8px;vertical-align:2px;}
.figs{display:grid;gap:14px;margin:18px 0 0;grid-template-columns:1fr;}
.figs.two{grid-template-columns:1fr 1fr;}
.figs img{
  display:block;width:100%;height:auto;border-radius:10px;
  border:1px solid var(--line);background:#fff;
}
@media (max-width:820px){
  .vidgrid{grid-template-columns:1fr;gap:14px;}
  .chips{grid-template-columns:1fr;}
  .osec{padding:22px 20px;border-radius:16px;}
  .osec-h h3{font-size:19px;}
  .figs.two{grid-template-columns:1fr;}
}

/* ---- Applicant tracking sheet ---- */
.trkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px;}
.trkbar .sp{margin-left:auto;}
.tbtn{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:10px;padding:10px 16px;font-size:14.5px;font-weight:600;
  cursor:pointer;transition:border-color .12s ease,color .12s ease,background .12s ease;
}
.tbtn:hover{color:var(--ink);border-color:var(--ink-3);background:var(--hover);}
.tbtn.go{color:#fff;border-color:transparent;}
.trkwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);}
table.trk{border-collapse:separate;border-spacing:0;width:100%;min-width:1060px;font-size:14.5px;}
table.trk th{
  position:sticky;top:0;z-index:2;
  background:#5B95F9;color:#fff;
  font-weight:600;text-align:left;white-space:nowrap;
  padding:12px 11px;font-size:13.5px;letter-spacing:.01em;
  text-transform:none;                       /* keep the sheet's own casing */
}
table.trk th:first-child{border-top-left-radius:13px;}
table.trk th:last-child{border-top-right-radius:13px;}
table.trk td{padding:0;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
table.trk tbody tr:nth-child(even){background:var(--zebra);}
table.trk tbody tr:hover{background:var(--hover);}
table.trk input{
  width:100%;border:0;background:transparent;color:var(--ink);
  font-family:inherit;font-size:14.5px;padding:12px;outline:none;
}
table.trk input:focus{box-shadow:inset 0 0 0 2px var(--accentring);border-radius:8px;}
table.trk td.mark{text-align:center;cursor:pointer;user-select:none;width:74px;}
table.trk td.mark span{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;margin:9px auto;border-radius:8px;
  border:1.5px solid var(--line);color:transparent;font-size:15px;font-weight:700;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
table.trk td.mark.on span{color:#fff;border-color:transparent;}
table.trk td.yn{text-align:center;cursor:pointer;user-select:none;width:104px;font-weight:600;}
table.trk td.yn span{display:inline-block;padding:5px 14px;border-radius:999px;font-size:13px;}
.trknote{font-size:14px;color:var(--ink-3);margin:14px 0 0;}

/* ---- Process Checklist outline ---- */
.outline{margin:0;padding-left:26px;}
.outline > li{
  font-size:17.5px;line-height:1.55;color:var(--ink);
  margin:0 0 22px;padding-left:6px;
}
.outline > li:last-child{margin-bottom:0;}
.outline > li::marker{color:var(--ink-3);font-weight:600;}
.outline .o1{font-weight:600;color:var(--ink);}
.outline .o-note{font-weight:400;color:var(--ink-3);font-size:15.5px;}
.outline ul{list-style:none;margin:10px 0 0;padding-left:0;}
.outline ul li{
  position:relative;
  font-size:16.5px;line-height:1.6;font-weight:400;color:var(--ink-2);
  margin:0 0 7px;padding-left:18px;
}
.outline ul li::before{
  content:"";position:absolute;left:2px;top:.72em;
  width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.55;
}
.outline ul ul{margin-top:6px;}
.outline ul ul li{font-size:15.5px;color:var(--ink-3);}
a.lnk{
  display:inline-block;
  font-size:13px;font-weight:600;letter-spacing:.01em;
  padding:1px 9px 2px;margin-left:4px;
  border:1.5px solid;border-radius:999px;
  vertical-align:1px;
}
a.lnk:hover{filter:brightness(.88);}

/* numbered steps */
.step{display:flex;gap:20px;padding:22px 0;}
.step + .step{border-top:1px solid var(--line-soft);}
.step:first-child{padding-top:0;}
.step:last-child{padding-bottom:0;}
.step .num{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:#fff;
}
.step .sb{min-width:0;flex:1;}
.step .sb h3{margin-top:0;}

/* checklist */
.check{display:flex;gap:14px;align-items:flex-start;padding:11px 0;cursor:pointer;}
.check + .check{border-top:1px solid var(--line-soft);}
.check input{
  appearance:none;-webkit-appearance:none;
  width:21px;height:21px;flex:0 0 21px;margin:3px 0 0;
  border:1.7px solid var(--ink-3);border-radius:6px;background:var(--surface);
  cursor:pointer;transition:background .13s ease,border-color .13s ease;
}
.check input:checked{border-color:transparent;}
.check input:checked::after{
  content:"";display:block;width:5px;height:10px;margin:2px 0 0 6px;
  border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(43deg);
}
.check span{font-size:16.5px;line-height:1.6;color:var(--ink-2);}
.check input:checked ~ span{color:var(--ink-3);text-decoration:line-through;}
.check input:checked ~ span strong{color:var(--ink-3);font-weight:500;}
.check .sub{display:block;font-size:14.5px;color:var(--ink-3);margin-top:3px;}

/* collapsible */
.fold{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.fold > summary{
  list-style:none;cursor:pointer;padding:16px 20px;
  font-size:16px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;gap:11px;
}
.fold > summary::-webkit-details-marker{display:none;}
.fold > summary::after{
  content:"";margin-left:auto;width:9px;height:9px;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);
  transform:rotate(45deg);transition:transform .18s ease;
}
.fold[open] > summary::after{transform:rotate(-135deg);}
.fold .foldbody{padding:2px 20px 20px;}
.fold .foldbody > :last-child{margin-bottom:0;}

/* copyable block */
.copyblock{margin-bottom:16px;}
.copyblock .cbhead{
  display:flex;align-items:center;gap:12px;margin-bottom:8px;
}
.copyblock .cblabel{font-size:14px;font-weight:500;color:var(--ink-3);}
.copybtn{
  margin-left:auto;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);border-radius:9px;padding:7px 14px;
  font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.copybtn:hover{background:var(--hover);color:var(--ink);}
.copybtn.done{color:#fff;border-color:transparent;}
.pre{
  background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;font-size:15.5px;line-height:1.62;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word;
}

/* callout */
.note{
  border-radius:14px;padding:20px 22px;margin-bottom:16px;
  font-size:16px;line-height:1.62;
}
.note strong{font-weight:600;}

/* table */
.tblwrap{overflow-x:auto;margin-bottom:16px;}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15.5px;}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);}
th{font-weight:600;color:var(--ink);font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;}

/* big outbound card */
.bigcard{
  display:flex;align-items:center;gap:22px;
  border-radius:20px;padding:34px;color:#fff;
  transition:transform .14s ease;
}
.bigcard:hover{transform:translateY(-3px);}
.bigcard .bt{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.bigcard .bs{display:block;font-size:15px;opacity:.85;margin-top:4px;}
.bigcard svg{width:26px;height:26px;flex:0 0 26px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ==========================================================================
   EMAIL TEMPLATE BUILDER
   ========================================================================== */
.langrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px;}
.langbtn{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:13px;padding:15px 12px;font-size:16px;font-weight:500;
  cursor:pointer;transition:all .13s ease;
}
.langbtn:hover{background:var(--hover);color:var(--ink);}
.langbtn.on{color:#fff;border-color:transparent;font-weight:600;}

/* the role row keeps its bottom margin only when no language row follows */
.langrow.hasSub{margin-bottom:12px;}
/* language sub-toggle — quieter than the role buttons above it */
.emlangs{
  display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px;
}
.emlangs button{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:11px;padding:9px 15px;font:inherit;font-size:14.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:all .13s ease;
}
.emlangs button:hover{background:var(--hover);color:var(--ink);}
.emlangs button.on{color:#fff;border-color:transparent;font-weight:600;}

label{display:block;font-size:13.5px;font-weight:500;color:var(--ink);margin:0 0 8px;}
.field{margin-bottom:22px;}
input[type=text]{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  padding:15px 17px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surface);transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus{outline:none;}
input[type=text]::placeholder{color:var(--ink-3);}

.btn{
  display:block;width:100%;font-family:inherit;font-size:17px;font-weight:500;
  padding:19px 24px;border:none;border-radius:999px;cursor:pointer;
  transition:transform .12s,filter .18s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{color:#fff;margin-top:8px;}
.btn-primary:hover{filter:brightness(1.07);}
.btn-outline{color:var(--ink);background:var(--surface);border:1.5px solid var(--line);}
.btn-outline:hover{background:var(--hover);}

.doc{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:28px 30px;}
.doc .body{font-size:15.5px;line-height:1.68;color:var(--ink-2);}
.doc .body p{margin:0 0 15px;}
.doc .body p.tight{margin:0 0 4px;}
.doc .body b{font-weight:600;color:var(--ink);}
.doc .body ul{margin:6px 0 15px;padding-left:22px;}
.doc .body li{margin-bottom:5px;}
.doc .body a{color:#008CFF;word-break:break-all;}
.missing,.token{
  background:rgba(230,40,75,.13);color:#E6284B;
  border-radius:4px;padding:1px 5px;font-weight:500;
}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:26px;}

/* ---- Re-written ads ---- */
.adpick{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.adpick .p{
  display:flex;flex-direction:column;justify-content:flex-end;
  min-height:250px;border-radius:18px;padding:26px 24px;
  transition:transform .16s ease,box-shadow .16s ease;
}
.adpick .p:hover{transform:translateY(-4px);}
.adpick .p .sc{font-size:13.5px;font-weight:500;opacity:.85;margin:0 0 7px;}
.adpick .p .nm{font-size:26px;font-weight:600;letter-spacing:-.022em;line-height:1.15;}
.adhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 18px;}
.adhead h2{font-size:19px;font-weight:600;letter-spacing:-.018em;margin:0;color:var(--ink);}
.adnote{font-size:15.5px;line-height:1.62;color:var(--ink-2);margin:0 0 18px;}
.adtbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:2px 0 0;}
.adtbl th{
  text-align:left;text-transform:none;font-size:12px;font-weight:700;letter-spacing:.06em;
  color:var(--ink-3);padding:0 14px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap;
}
.adtbl td{padding:11px 14px 11px 0;border-bottom:1px solid var(--line-soft);
  vertical-align:top;color:var(--ink-2);line-height:1.5;}
.adtbl td:first-child{color:var(--ink);font-weight:600;}
.adtbl td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;}
.adtbl tr:last-child td{border-bottom:0;}
.fixlist{list-style:none;margin:0;padding:0;counter-reset:fx;}
.fixlist li{position:relative;padding-left:38px;margin:0 0 16px;counter-increment:fx;}
.fixlist li:last-child{margin-bottom:0;}
.fixlist li::before{
  content:counter(fx);position:absolute;left:0;top:1px;
  width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;
}
.fixlist .fh{display:block;font-size:16px;font-weight:600;color:var(--ink);line-height:1.4;}
.fixlist .fb{display:block;font-size:15.5px;color:var(--ink-2);line-height:1.6;margin-top:3px;}

/* ---- STAR chapters, rendered in-platform ---- */
.chgroup{margin:0 0 26px;}
.chgroup:last-child{margin-bottom:0;}
.chlabel{
  font-size:17.5px;font-weight:600;letter-spacing:-.014em;line-height:1.35;
  color:var(--ink);margin:0 0 12px;
}
.chpoints{list-style:none;margin:0;padding:0;}
.chpoints li{
  position:relative;padding-left:19px;margin:0 0 11px;
  font-size:16.5px;line-height:1.62;color:var(--ink-2);
}
.chpoints li:last-child{margin-bottom:0;}
.chpoints li::before{
  content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--ink-3);opacity:.55;
}
.chpoints strong,.chpoints em{color:var(--ink);}
.chvid{
  width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 20px 52px -26px rgba(4,18,44,.7);margin:0 0 26px;display:block;
}
.chvid video{display:block;width:100%;height:100%;}
.chfields{display:grid;gap:16px;}
.chfields label{display:block;}
.chfields .fl{
  display:block;font-size:15px;font-weight:600;color:var(--ink);margin:0 0 5px;line-height:1.4;
}
.chfields .fh{display:block;font-size:13.5px;color:var(--ink-3);margin:0 0 7px;line-height:1.5;}
.chfields input,.chfields textarea{
  width:100%;font:inherit;font-size:15.5px;color:var(--ink);
  background:var(--bg);border:1.5px solid var(--line);border-radius:11px;
  padding:11px 14px;transition:border-color .12s ease;
}
.chfields input:focus,.chfields textarea:focus{outline:none;border-color:var(--ink-3);}
.chfields textarea{min-height:88px;resize:vertical;line-height:1.55;}
.chchecks{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px;}
.chchecks label{
  display:flex;gap:11px;align-items:flex-start;cursor:pointer;
  font-size:15.5px;line-height:1.5;color:var(--ink-2);
}
.chchecks input{margin:3px 0 0;width:17px;height:17px;flex:0 0 17px;accent-color:currentColor;}
.chchecks input:checked + span{color:var(--ink-3);text-decoration:line-through;}
.chfiles{display:grid;gap:10px;}
.chfile{
  display:flex;gap:14px;align-items:baseline;
  border:1px solid var(--line);border-radius:12px;padding:13px 16px;
  background:var(--surface);transition:border-color .12s ease,background .12s ease;
}
.chfile:hover{border-color:var(--ink-3);background:var(--hover);}
.chfile .fn{font-size:15.5px;font-weight:600;color:var(--ink);flex:0 0 auto;}
.chfile .fd{font-size:14px;color:var(--ink-3);line-height:1.45;}
@media (max-width:820px){
  .chchecks{grid-template-columns:1fr;}
  .chfile{flex-direction:column;gap:3px;}
}
@media (max-width:820px){
  .adpick{grid-template-columns:1fr;gap:14px;}
  .adpick .p{min-height:150px;}
  .adtbl{font-size:14px;}
  .adtbl th:nth-child(3),.adtbl td:nth-child(3){display:none;}
}
.hidden{display:none;}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-height:820px){ .region .rn{font-size:28px;} }
@media (max-width:1180px){
  .regions{grid-template-columns:repeat(3,1fr);}
  .region{aspect-ratio:4/3;max-height:none;}
  .navgrid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:820px){
  body{font-size:16.5px;}
  .wrap{padding:20px 18px 40px;}
  .regions{grid-template-columns:1fr;gap:13px;}
  .region{aspect-ratio:auto;min-height:120px;padding:22px 22px;border-radius:18px;}
  .region .rn{font-size:26px;}
  .banner{padding:30px 24px;border-radius:18px;}
  .banner h1{font-size:33px;}
  .banner.sec h1{font-size:27px;}
  .roles{grid-template-columns:1fr;gap:11px;}
  .role{padding:19px 22px;font-size:17.5px;}
  .navgrid{grid-template-columns:1fr;gap:14px;}
  .navtile{min-height:132px;border-radius:16px;}
  .navtile.wide{min-height:104px;padding:12px;margin-bottom:14px;}
  .navtile.wide img{max-width:200px;}
  .panel{padding:24px 22px;border-radius:16px;}
  .panel h2{font-size:21px;}
  .bigcard{padding:26px;gap:16px;}
  .bigcard .bt{font-size:22px;}
  .langrow{grid-template-columns:1fr;gap:10px;}
  .emlangs button{flex:1 0 30%;padding:9px 6px;}
  .step{gap:15px;}
  .hx{height:20px;}
  .lu img{height:24px;}
}
@media print{
  .pagehead,.backlink,.copybtn,.actions{display:none!important;}
  .panel{box-shadow:none;break-inside:avoid;}
}
</style>

<script>
/* ==========================================================================
   TO EDIT CONTENT

   Swap a region's assessment links : edit that region's "roles" array below —
                                      label + url per button. Nothing else moves.
   Swap the email assessment links  : edit that region's "evals" object.
   Add a region                     : copy a whole REGIONS block.
   Change a section's writing       : edit its entry in SECTIONS. Every region
                                      shares SECTIONS, so one edit updates all five.

   Colours are Hubexo's own brand palette:
     plum #321432 · atomic yellow #DCFF3C · earth #F7F7F2
     blue #008CFF · red #E6284B · orange #FF8700 · purple #A54CFF
   ========================================================================== */

var STAR_URL      = "https://lushin-inc.github.io/star/";
var INTERVIEW_URL = "https://lushin-inc.github.io/interview-guide/";
var TRACKER_URL   = "https://docs.google.com/spreadsheets/d/123oS0ye0pynqgMY-IaLpH_bpdx7j58vAEEdis4_S4Z4/edit?usp=sharing";

/* PLACEHOLDER — regions whose links have not come in yet still point at the
   Lushin demo license. Replace that region's "options" array as they arrive. */
var PLACEHOLDER = "https://info.objectivemanagement.com/License.aspx?ID=2885&MI=1&bc1=Search+Licenses&bc1u=Licenses.aspx%3fstatus%3d2%26d1%3d%26d2%3d%26d%3d61%26c%3d357%26pt%3d1%26csr%3d&bc2=Assessments";

/* Each option is one button across the top of the region page AND one choice
   on the Email Templates page.
     label — the button text
     job   — the role title written into the email
     copy  — which language the email is written in (en / de / es)
     reg   — OMG registration page (the top button)
     eval  — candidate assessment link (fills the email)                       */
var PLACEHOLDER_OPTIONS = [
  {key:"bdm", label:"BDM", job:"Business Development Manager", copy:"en", reg:PLACEHOLDER, eval:""}
];

/* Home keeps five colours so each region is recognisable at a glance.
   Every page BELOW home runs on one blue theme with a gold accent —
   edit PAGE_THEME once and all five regions follow. */
var PAGE_THEME = {
  from:"#008CFF",      /* banners, buttons, gradients            */
  to:"#0057A8",
  ink:"#FFFFFF",       /* text on those gradients                */
  accent:"#FAB040",    /* icon strokes, rules, focus rings       */
  accentText:"#B07407" /* the same gold, deepened so small text and
                          white-on-gold buttons stay readable    */
};
function themed(r){
  var o = {}; for(var k in r) o[k] = r[k];
  o.from = PAGE_THEME.from; o.to = PAGE_THEME.to; o.ink = PAGE_THEME.ink;
  o.accent = PAGE_THEME.accent; o.accentText = PAGE_THEME.accentText;

   HELPERS
   ========================================================================== */
function grad(r){ return "linear-gradient(150deg," + r.from + " 0%," + r.to + " 100%)"; }
function tint(hex,a){
  var n = parseInt(hex.slice(1),16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
var ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h13M12.5 6l6 6-6 6"/></svg>';
var BACK  = '<svg viewBox="0 0 24 24"><path d="M19 12H6M11.5 6l-6 6 6 6"/></svg>';

/* panel with a coloured left accent */
function panel(inner){ return '<div class="panel">' + inner + '</div>'; }

function note(r,inner){
  return '<div class="note" style="background:' + tint(r.from,.10) +
         ';border-left:4px solid ' + r.accent + '">' + inner + '</div>';
}

function steps(r,list){
  return list.map(function(s,i){
    return '<div class="step">' +
      '<span class="num" style="background:' + grad(r) + '">' + (i+1) + '</span>' +
      '<div class="sb"><h3>' + s.h + '</h3>' + s.b + '</div></div>';
  }).join("");
}

function checklist(r,id,list){
  return '<div data-check="' + id + '">' + list.map(function(c,i){
    return '<label class="check">' +
      '<input type="checkbox" data-k="' + id + ':' + i + '" style="--on:' + (r.accentText||r.accent) + '">' +
      '<span>' + c.t + (c.s ? '<span class="sub">' + c.s + '</span>' : '') + '</span></label>';
  }).join("") + '</div>';
}

function fold(label,inner,open){
  return '<details class="fold"' + (open ? ' open' : '') + '><summary>' + label + '</summary>' +
         '<div class="foldbody">' + inner + '</div></details>';
}

function copyblock(r,label,text){
  var id = "cb" + (copyblock._n = (copyblock._n||0) + 1);
  window.__COPY = window.__COPY || {};
  window.__COPY[id] = text;
  return '<div class="copyblock"><div class="cbhead"><span class="cblabel">' + label + '</span>' +
    '<button class="copybtn" data-copy="' + id + '" style="--on:' + (r.accentText||r.accent) + '">Copy</button></div>' +
    '<div class="pre">' + esc(text) + '</div></div>';
}

function bigcard(r,href,title,sub){
  return '<a class="bigcard" href="' + href + '" target="_blank" rel="noopener" ' +
    'style="background:' + grad(r) + ';color:' + r.ink +
    ';box-shadow:0 18px 40px -22px ' + tint(r.from,.7) + '">' +
    '<span><span class="bt">' + title + '</span><span class="bs">' + sub + '</span></span>' + ARROW + '</a>';
}


/* The interview detail lives on the checklist now — step 4 is where a reader
   actually needs it. INTERVIEW_SECTION keeps its own URL working. */
function interviewSteps(r){
  return steps(r,[
    {h:"Five-minute phone interview",
     b:"<p>Purpose: qualify the candidate quickly.</p><p>What you are listening for:</p><ul>" +
       "<li>How they sound on the phone \u2014 tone, clarity, presence.</li>" +
       "<li>Whether they can build rapport.</li>" +
       "<li>Whether their experience matches the ad.</li>" +
       "<li>How they handle push-back or a put-off.</li></ul>"},
    {h:"First interview",
     b:"<p>Objective: validate the assessment and the resume through live conversation.</p><ul>" +
       "<li>Push back on the resume. Check for accuracy, patterns and truth.</li>" +
       "<li>Evaluate soft skills and cultural fit.</li>" +
       "<li>Watch body language, confidence and conversation flow.</li>" +
       "<li>Do not discuss compensation or benefits at this stage.</li></ul>"},
    {h:"Final interview",
     b:"<p>Goals: sell the opportunity, introduce key stakeholders, confirm mutual fit and close the candidate.</p>" +
       "<p>Cover job expectations, compensation, the sales cycle, who they report to, and what a typical client looks like.</p>"},
    {h:"Job offer",
     b:"<p>Be ready to make the offer at the end of the final interview if it has gone well.</p>" +
       "<p>The offer must match what was discussed. No surprises.</p>"},
    {h:"Onboarding preparation",
     b:"<p>Once the offer is accepted, shift straight into onboarding.</p><ul>" +
       "<li>Clarify daily, weekly and monthly expectations.</li>" +
       "<li>Train on product, market, competition, sales process and positioning.</li>" +
       "<li>Assign coaching responsibilities and onboarding milestones.</li></ul>"}
  ]);
}
function interviewNote(r){
  return note(r,"<strong>&ldquo;Recommended&rdquo; does not mean automatic hire.</strong> If the candidate " +
    "sounds poor on the phone, interviews badly, or lacks the experience the role needs, you can and should " +
    "say no. And &ldquo;Not Recommended&rdquo; does not mean the process failed &mdash; it did its job.");
}

/* the option currently selected on the Email Templates page */
function emOpt(){
  var opts = (EM.region && EM.region.options) || [];
  for(var i=0;i<opts.length;i++) if(opts[i].key === EM.opt) return opts[i];
  return opts[0] || {key:"", label:"", job:"", copy:"en", eval:""};
}
/* A region with emLangs picks its language from the toggle; everywhere else
   the language is baked into the selected role option. */
function emLangsFor(r){ return (r && r.emLangs) || null; }
function emCopy(){
  var ls = emLangsFor(EM.region);
  if(ls && EMAIL_COPY[EM.lang]) return EMAIL_COPY[EM.lang];
  return EMAIL_COPY[emOpt().copy] || EMAIL_COPY.en;
}
var COMPANY      = "Hubexo";
var NAME_TOKEN   = "[NAME]";
var SENDER_TOKEN = "[SENDER\u2019S NAME]";
var STORE        = "hubexoEmailV1";

var EM = { opt:null, lang:null, region:null };

function emSave(){ try{ localStorage.setItem(STORE, JSON.stringify({opt:EM.opt, lang:EM.lang})); }catch(e){} }
function emLoad(){
  try{ var o = JSON.parse(localStorage.getItem(STORE) || "{}");
        if(o.opt) EM.opt = o.opt; if(o.lang) EM.lang = o.lang; }catch(e){}
}

/* ---------------- build one line, swapping {tokens} for text or markup ---- */
function emLine(str, map){
  var out = "", rest = String(str), m;
  while((m = rest.match(/\{(name|company|job|sender)\}/))){
    out += esc(rest.slice(0, m.index));
    var e = map[m[1]] || {};
    out += e.html ? e.html : esc(e.text || "");
    rest = rest.slice(m.index + m[0].length);
  }
  return out + esc(rest);
}
/* a red placeholder — it turns black as soon as the reader edits it */
function emTok(t){ return '<span class="token" data-ph="' + esc(t) + '">' + esc(t) + '</span>'; }

/* ---------------- the editable template ---------------- */
function emRender(){
  var el = document.getElementById("em-out");
  if(!el) return;
  var o = emOpt(), T = emCopy();
  var link = o.eval || "";
  var linkHtml = /^https?:\/\//i.test(link)
    ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link) + '</a>'
    : emTok("[ASSESSMENT LINK]");
  var map = {
    name:    {html: emTok(NAME_TOKEN)},
    sender:  {html: emTok(SENDER_TOKEN)},
    company: {text: COMPANY},
    job:     {text: o.job || "[JOB TITLE]"}
  };
  el.setAttribute("lang", T.hreflang);
  el.innerHTML =
      '<p class="tight"><b>' + esc(T.subjectLabel) + '</b></p>'
    + '<p>' + esc(T.subject) + '</p>'
    + '<p><b>' + esc(T.emailLabel) + '</b></p>'
    + '<p>' + emLine(T.greet, map) + '</p>'
    + '<p>' + emLine(T.thanks, map) + '</p>'
    + '<p>' + esc(T.review) + '</p>'
    + '<p><b>' + esc(T.nextH) + '</b></p>'
    + '<p>' + esc(T.nextP) + '</p>'
    + '<p class="tight"><b>' + esc(T.tipsH) + '</b></p>'
    + '<ul>' + T.tips.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>'
    + '<p class="tight"><b>' + esc(T.linkH) + '</b></p>'
    + '<p>' + linkHtml + '</p>'
    + '<p class="tight"><b>' + esc(T.byH) + '</b></p>'
    + '<p>' + esc(T.byP) + '</p>'
    + '<p>' + esc(T.after) + '</p>'
    + '<p>' + emLine(T.closeP, map) + '</p>'
    + '<p class="tight">' + esc(T.best) + '</p>'
    + '<p>' + map.sender.html + '</p>';
}

/* ---------------- plain text, read back off the edited page ---------------- */
function emText(){ return docText("em-out"); }
function docText(id){
  var el = document.getElementById(id);
  if(!el) return "";
  var out = [];
  Array.prototype.forEach.call(el.childNodes, function(n){
    if(n.nodeType !== 1) return;
    if(n.tagName === "UL"){
      Array.prototype.forEach.call(n.children, function(li){
        out.push("\u2022 " + li.textContent.trim());
      });
      out.push("");
      return;
    }
    out.push(n.textContent.trim());
    if(String(n.className).indexOf("tight") === -1) out.push("");
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

ng vivid, omits the hiring process, and gives too little compensation detail to let strong candidates judge the upside. The likely result is application volume rather than a small, self-selecting pool of people who are genuinely suited to phone-led new-business work.","pool":"This ad does not fail because it asks for too much experience for the money. It fails in the opposite direction: the £32,000 OTE is paired with a very broad, mostly behavioural entry bar. That can attract plenty of people, but the ad gives them too little objective evidence by which to self-select. The first number to change is not necessarily the pay number; it is the qualification bar. Define the minimum evidence of prior success Hubexo will accept for an entry-level BDR. Then validate that £32,000 OTE, including its base/variable split, is competitive for candidates who meet that bar. If Hubexo truly requires prior successful B2B selling, the compensation must be re-tested because the current pool could shrink sharply.","fixes":[{"h":"Define the candidate with checkable evidence.","b":"State the minimum prior success required, the buyer titles contacted, and the customer type. If prior sales experience is genuinely not required, define the equivalent evidence of outbound, customer-facing or target-driven success that is acceptable."},{"h":"Make the hard part explicit.","b":"Say what sustained outbound work actually demands: cold prospecting, rejection, activity expectations, resistant buyers, meeting-quality standards, or the real challenge Hubexo measures."},{"h":"Complete the candidate proposition.","b":"Add base/variable compensation detail, target and top-producer earnings, cap/no-cap status, real differentiators and the hiring steps with timeframes."}],"scorecard":[["Opening hook","4/10","“Entry point into B2B new-business sales” gives the role a career-development angle.","The first impression is title/location/role description, not an aspirational reason for a strong early-career sell var AD_STORE = "hubexoAdsV1";

function findAd(k){
  for(var i=0;i<ADS.length;i++) if(ADS[i].key === k) return ADS[i];
  return null;
}

/* every [bracketed] item in the rewrite is something Hubexo still has to supply,
   so it renders red and turns black the moment it is typed over */
function adLine(str){
  var out = "", rest = String(str), m;
  while((m = rest.match(/\[[^\]\n]+\]/))){
    out += esc(rest.slice(0, m.index));
    out += '<span class="token" data-ph="' + esc(m[0]) + '">' + esc(m[0]) + '</span>';
    rest = rest.slice(m.index + m[0].length);
  }
  return out + esc(rest);
}

function adRender(a){
  var el = document.getElementById("ad-out");
  if(!el) return;
  el.innerHTML = a.ad.map(function(b){
    if(b.t === "h")  return '<p class="tight"><b>' + adLine(b.x) + '</b></p>';
    if(b.t === "ul") return '<ul>' + b.x.map(function(li){
                              return '<li>' + adLine(li) + '</li>'; }).join("") + '</ul>';
    return '<p>' + adLine(b.x) + '</p>';
  }).join("");
}

/* ---------------- the chooser ---------------- */
function adIndex(r){
  return '<div class="adpick">' + ADS.map(function(a){
    return '<a class="p" href="#' + r.key + '/rewritten-ads/' + a.key + '" ' +
      'style="background:' + grad(r) + ';color:' + r.ink +
      ';box-shadow:0 18px 40px -22px ' + tint(r.from,.7) + '">' +
      '<span class="sc">Current ad scored ' + a.score + '/100</span>' +
      '<span class="nm">' + esc(a.label) + '</span></a>';
  }).join("") + '</div>';
}

/* ---------------- one rewritten ad ---------------- */
function adView(r, a){
  var acc = r.accentText || r.accent;

  var fixes = '<ol class="fixlist">' + a.fixes.map(function(f){
    return '<li><span class="fh">' + esc(f.h) + '</span>' +
           (f.b ? '<span class="fb">' + esc(f.b) + '</span>' : '') + '</li>';
  }).join("") + '</ol>';

  var score = '<table class="adtbl"><tr><th>What was measured</th><th>Score</th>' +
    '<th>What to fix</th></tr>' + a.scorecard.map(function(row){
      return '<tr><td>' + esc(row[0]) + '</td><td class="num" style="color:' + acc + '">' +
             esc(row[1]) + '</td><td>' + esc(row[3]) + '</td></tr>';
    }).join("") + '</table>';

  var mhead = a.missing[0] || [];
  var missing = '<table class="adtbl"><tr>' + mhead.map(function(h){
      return '<th>' + esc(h) + '</th>'; }).join("") + '</tr>' +
    a.missing.slice(1).map(function(row){
      return '<tr>' + row.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join("") + '</tr>';
    }).join("") + '</table>';

  return panel(
      '<div class="adhead"><h2>What to fix first</h2></div>' +
      fixes
    ) +
    panel(
      '<div class="doc"><div class="body" id="ad-out" contenteditable="true" spellcheck="false"></div></div>' +
      '<p class="edithint">Anything in red is a placeholder \u2014 click it and type over it. ' +
        'You can edit any other line too.</p>' +
      '<div class="actions">' +
        '<button class="btn btn-primary" id="ad-copy" style="background:' + grad(r) +
          ';color:' + r.ink + ';box-shadow:0 12px 28px -14px ' + tint(r.from,.8) + '">Copy Text</button>' +
        '<button class="btn btn-outline" id="ad-docx">Download Word Doc</button>' +
        '<button class="btn btn-outline" id="ad-reset">Start over</button>' +
      '</div>'
    ) +
    fold("What is still missing \u2014 and who to ask for it", missing) +
    fold("How the current ad scored (" + a.score + "/100)",
         '<p class="adnote">' + esc(a.verdict) + '</p>' + score);
}

function wireAds(r){
  var parts = location.hash.replace(/^#/,"").split("/");
  var a = parts[2] ? findAd(parts[2]) : null;
  if(!a) return;
  adRender(a);

  var out = document.getElementById("ad-out");
  out.addEventListener("input", function(){
    Array.prototype.forEach.call(out.querySelectorAll("[data-ph]"), function(sp){
      if(sp.textContent.trim() !== sp.getAttribute("data-ph")){
        sp.className = sp.className.replace(/\btoken\b/, "").trim();
        sp.removeAttribute("data-ph");
      }
    });
  });

  document.getElementById("ad-copy").addEventListener("click", function(){
    copyText(docText("ad-out"), this, tr("Copied"), tr("Copy Text"));
  });
  document.getElementById("ad-docx").addEventListener("click", function(){
    downloadDocx("ad-out", "Job Ad - " + a.label + ".docx");
  });
  document.getElementById("ad-reset").addEventListener("click", function(){
    if(!confirm("Put the ad back the way it started?")) return;
    adRender(a);
  });
}

/* ==========================================================================
   APPLICANT TRACKING SHEET — mirrors the example spreadsheet.
   Add a column: add it to TRK_COLS. type "text" = typed in,
   "yn" = Yes/No, "mark" = click to tick.
   ========================================================================== */
var TRK_COLS = [
  {k:"name",  h:"Name",                 type:"text"},
  {k:"email", h:"Email",                type:"text"},
  {k:"phone", h:"Phone",                type:"text"},
  {k:"recv",  h:"Application Received", type:"text"},
  {k:"sent",  h:"Sent Assessment?",     type:"yn"},
  {k:"fu",    h:"Follow Up?",           type:"yn"},
  {k:"e1",    h:"EMAIL 1",              type:"mark"},
  {k:"c1",    h:"CALL 1",               type:"mark"},
  {k:"e2",    h:"EMAIL 2",              type:"mark"},
  {k:"e3",    h:"EMAIL 3",              type:"mark"},
  {k:"c2",    h:"CALL 2",               type:"mark"}
];
var TRK_START_ROWS = 7;
var TRK = { rows:[], key:"" };

function trkLoad(r){
  TRK.key = "hx:trk:" + r.key;
  var rows = null;
  try{ rows = JSON.parse(localStorage.getItem(TRK.key) || "null"); }catch(e){}
  if(!rows || !rows.length){
    rows = [];
    for(var i=0;i<TRK_START_ROWS;i++) rows.push({});
  }
  TRK.rows = rows;
}
function trkSave(){ try{ localStorage.setItem(TRK.key, JSON.stringify(TRK.rows)); }catch(e){} }

function trkTable(r){
  var head = TRK_COLS.map(function(c){ return "<th>" + esc(c.h) + "</th>"; }).join("");
  var body = TRK.rows.map(function(row,i){
    return "<tr>" + TRK_COLS.map(function(c){
      var v = row[c.k] || "";
      if(c.type === "text"){
        return '<td><input type="text" data-r="' + i + '" data-c="' + c.k + '" value="' + esc(v) + '"></td>';
      }
      if(c.type === "yn"){
        var on = v === "Yes", off = v === "No";
        var st = on  ? 'background:' + tint(r.from,.16) + ';color:' + r.from
               : off ? 'background:rgba(150,150,160,.16);color:var(--ink-3)'
                     : 'color:var(--ink-3)';
        return '<td class="yn" data-r="' + i + '" data-c="' + c.k + '"><span style="' + st + '">' +
               (v || "—") + '</span></td>';
      }
      return '<td class="mark' + (v ? " on" : "") + '" data-r="' + i + '" data-c="' + c.k + '">' +
             '<span style="' + (v ? "background:" + r.from : "") + '">\u2713</span></td>';
    }).join("") + "</tr>";
  }).join("");
  return '<div class="trkwrap"><table class="trk"><thead><tr>' + head +
         '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

var TRACKING_SECTION = {
key:"tracking", title:"Applicant Tracking Sheet",
render:function(r){
  trkLoad(r);
  return panel(
    '<div class="trkbar">' +
      '<button class="tbtn go" id="trk-add" style="background:' + grad(r) + '">Add row</button>' +
      '<button class="tbtn" id="trk-csv">Download as spreadsheet</button>' +
      '<span class="sp"></span>' +
      '<button class="tbtn" id="trk-clear">Clear</button>' +
    '</div>' +
    '<div id="trk-host">' + trkTable(r) + '</div>' +
    '<p class="trknote">Click the tick columns to mark a touch. Yes / No cycles when you click it. Everything you type is saved in this browser.</p>'
  );
}};

function wireTracking(r){
  var host = document.getElementById("trk-host");
  function paint(){ host.innerHTML = trkTable(r); wire();
    if(LANG !== "en") translateTree(host); }
  function wire(){
    Array.prototype.forEach.call(host.querySelectorAll("input[data-c]"), function(el){
      el.addEventListener("input", function(){
        TRK.rows[+el.getAttribute("data-r")][el.getAttribute("data-c")] = el.value;
        trkSave();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll("td.mark,td.yn"), function(td){
      td.addEventListener("click", function(){
        var i = +td.getAttribute("data-r"), c = td.getAttribute("data-c");
        var cur = TRK.rows[i][c] || "";
        if(td.className.indexOf("yn") > -1){
          TRK.rows[i][c] = cur === "" ? "Yes" : cur === "Yes" ? "No" : "";
        } else {
          TRK.rows[i][c] = cur ? "" : "x";
        }
        trkSave(); paint();
      });
    });
  }
  wire();
  document.getElementById("trk-add").addEventListener("click", function(){
    TRK.rows.push({}); trkSave(); paint();
  });
  document.getElementById("trk-clear").addEventListener("click", function(){
    if(!confirm("Clear every row on this device?")) return;
    TRK.rows = []; for(var i=0;i<TRK_START_ROWS;i++) TRK.rows.push({});
    trkSave(); paint();
  });
  document.getElementById("trk-csv").addEventListener("click", function(){
    var q = function(v){ return '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"'; };
    var lines = [TRK_COLS.map(function(c){ return q(c.h); }).join(",")];
    TRK.rows.forEach(function(row){
      lines.push(TRK_COLS.map(function(c){ return q(row[c.k] || ""); }).join(","));
    });
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Applicant Tracking Sheet - " + r.name + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  });
}
