{key:"role", title:"Role Identification, Assessments & Interviewing", yt:"aJ18a9VoIlE", cover:"Assets/training/role.jpg", slidedir:"Assets/slides/role/",
 chapters:[{"t": 0, "label": "Session scope and how the two sessions fit together", "points": [{"t": 0, "p": "Today covers the front end of hiring: defining roles, using pre-screening tools, and interviewing.", "subs": ["Most of the time goes to the interviewing side", "Real stats from live searches are included"]}, {"t": 0, "p": "Hiring is the trickiest part of the job — this conversation could run eight hours."}, {"t": 37, "p": "Today is content and framework; the follow-up session in two weeks is pure application."}, {"t": 37, "p": "Interviewing sales professionals is different, because good salespeople sell themselves well in an interview."}, {"t": 77, "p": "The goal is to avoid hiring people who look great on paper and fall apart six months later."}]}, {"t": 111, "label": "Why new hires don't work out and what a bad hire costs", "points": [{"t": 111, "p": "Either they were dead when you hired them, or you killed them after."}, {"t": 111, "p": "Hires get killed by missing training, process and structure to support them."}, {"t": 148, "p": "Coachability is a top reason people fail — so ask how you are actually validating it in an interview."}, {"t": 148, "p": "There is no magic bullet in hiring, only things that raise the likelihood of success."}, {"t": 180, "p": "Bad culture fit sinks hires because we get enamored with skill set and never factor in culture."}, {"t": 216, "p": "Do the math on a bad hire and the number is brutal in any industry.", "subs": ["Hourly cost of everyone's time invested in onboarding", "Compensation paid to the person", "Lost clients and revenue that never got created"]}, {"t": 249, "p": "The flip side is holding on to people too long, justified by how hard it is to find and onboard someone new — and once you finally act, your energy spikes and everyone asks what took so long."}], "quote": {"t": 111, "text": "There's a great rule out there that exists that people were either dead when you hired them or you killed them."}}, {"t": 288, "label": "Recruiting process flow and why the phone screen comes first", "slides": [6], "points": [{"t": 288, "p": "Your recruiting process has to mimic what the person will actually do in the job."}, {"t": 288, "p": "Salespeople live on the phone, so screen on the phone — plenty of people are great in person and terrible on a call."}, {"t": 320, "p": "The ideal order is assess before you ever talk to them, then a short phone or virtual screen, then decide if there's a fit, then interview."}, {"t": 320, "p": "The first interview should carry as much pressure as the job itself carries."}, {"t": 355, "p": "An orthopedics client ran 60-minute first interviews for a role that gets five minutes in front of a doctor — the interview should have been five minutes."}]}, {"t": 429, "label": "Writing the ad to identify, not attract", "slides": [8], "points": [{"t": 429, "p": "The most common bad ad is the unicorn ad — a big-picture thinker who is also extremely detailed, with 98 requirements listed."}, {"t": 470, "p": "Buzzwords don't identify anyone; characteristics of the person do."}, {"t": 470, "p": "Most ads describe the job function instead of the person — perks and ping-pong tables get you 'that looks fun,' not 'that's me.'"}, {"t": 518, "p": "The ad is the first gate of disqualification, exactly like the first step of a sales process."}, {"t": 559, "p": "Write to the must-haves only; should-haves and nice-to-haves are icing."}, {"t": 596, "p": "Get proactive if your industry isn't seen as sexy, and post to multiple locations rather than one.", "subs": ["Less perceived glamour means fewer applicants", "Post Atlanta plus Alpharetta and the surrounding sub-areas", "Yes it costs more — you're fishing for talent"]}], "quote": {"t": 518, "text": "Think of your ad like a sales call. It's your first gate of disqualification."}}, {"t": 644, "label": "The three parts of an ad", "points": [{"t": 644, "p": "Part one is about us — a plain description of the company, no PR firm required."}, {"t": 644, "p": "SEO keywords matter on every board: CareerBuilder, ZipRecruiter, Indeed, LinkedIn."}, {"t": 684, "p": "List alternate job titles pulled from O*NET so candidates who call themselves something else still self-identify.", "subs": ["People get hung up on titles", "More titles listed means better search visibility"]}, {"t": 684, "p": "Part two describes the person, not the position — a coaching business would be hypocritical hiring people who aren't coachable."}, {"t": 716, "p": "Describe capabilities, not experience, when you write the person section."}], "quote": {"t": 716, "text": "Here's a great hiring rule to follow. When there is doubt, there is no doubt."}}, {"t": 759, "label": "Red flags, self-awareness and challenging buzzwords", "points": [{"t": 759, "p": "A candidate scored in the 90s with strong desire and commitment, still felt off, got hired, and was fired two months later for being strange."}, {"t": 801, "p": "There's a difference between a quirk or a lack of self-awareness and something baked into someone's DNA.", "subs": ["Some abrasive people simply never had a leader who made them self-aware", "Validate the concern with a behavioral question next time you talk"]}, {"t": 842, "p": "Ask why there's a bloody trail behind them — constant outward blame is a red flag, shared responsibility is workable."}, {"t": 880, "p": "Candidates who list sales training as an accomplishment repeat the buzzwords back in the interview."}, {"t": 917, "p": "Make them perform it, not describe it.", "subs": ["'Give me your upfront contract, go.'", "'Pretend I'm a prospect with late deliveries — run your pain step.'", "'You're a fan of the upfront contract? Then why didn't you set one at the start of this interview?'"]}, {"t": 917, "p": "Leaders hear the right words, get excited, and never validate that the candidate knows what they mean or how to apply them."}]}, {"t": 952, "label": "Industry experience versus the intangibles", "points": [{"t": 952, "p": "Define ideal and minimally acceptable: ideal is industry experience plus strong will to sell, coachable and trainable."}, {"t": 952, "p": "Too many people screen only for industry experience and pass on desire, commitment and coachability."}, {"t": 1006, "p": "Transferable experience counts when it matches on the important dimensions.", "subs": ["Similar buyer", "Similar sales cycle", "Similar dollar amount", "Similar level of complexity"]}, {"t": 1006, "p": "Being great at selling $400 canoes doesn't mean being great at selling $4 million yachts."}, {"t": 1044, "p": "Write the experience line around the selling situation, not the industry.", "subs": ["'Experience selling conceptual services'", "'Experience selling high-ticket items in the residential space'", "'Experience selling to CIOs in a short sales cycle'", "'Experience selling in a highly competitive environment'"]}, {"t": 1044, "p": "It comes down to how the person is hardwired, not a track record bullet."}]}, {"t": 1095, "label": "Never-sold candidates and reading assessment results", "points": [{"t": 1095, "p": "For someone who has never sold, look for entrepreneurial, leadership or selling behavior earlier in life — you're still describing the person, just without the sales history."}, {"t": 1133, "p": "Nobody can answer a commitment question about something they haven't lived — the same way nobody could answer a marriage assessment before getting married."}, {"t": 1175, "p": "With never-sold candidates, insist on high desire and expect commitment to read low, because people don't know what they'd be committing to until bullets are flying."}, {"t": 1199, "p": "Set them up to fail early on purpose: let them try the thing you know won't work so they get burned and come back ready to listen."}, {"t": 1242, "p": "A live search showed 26 applicants, 20 completed the assessment, 3 came back recommended and 7 came back worth considering.", "subs": ["A 96th-percentile sales score had 13 positions in 13 years and was flagged for low longevity", "A low recommend rate saved a lot of bad hires — celebrate it, don't panic"]}, {"t": 1282, "p": "Recommended plus worth-considering usually lands in the 30 to 35 percent range; one client screening for $300,000 earners runs closer to 60 percent."}], "quote": {"t": 1199, "text": "No means no. Yes does not always mean yes."}}, {"t": 1319, "label": "What to know about someone before you hire them", "points": [{"t": 1319, "p": "Hungry, humble and smart is a clean hiring filter, straight out of The Ideal Team Player."}, {"t": 1360, "p": "Remote roles demand high responsibility, high motivation, a genuine self-starter, and someone who actually works better independently."}, {"t": 1360, "p": "'I don't want to babysit' really means self-starter — so write behavioral questions for all four of those traits."}, {"t": 1401, "p": "No one outgrows accountability; the strongest people in the room crave it because nobody else challenges them."}]}, {"t": 1439, "label": "Anatomy of an interview with a low-desire candidate", "points": [{"t": 1439, "p": "A candidate assessed low desire and low commitment cleared a sales manager and a divisional manager before anyone looked at the results."}, {"t": 1470, "p": "Interview and record the questionable candidate once, prove the point, and never have the argument again."}, {"t": 1506, "p": "Ask what their ideal role would be — this sales applicant said he loves running equipment and just bought an excavator.", "subs": ["High-desire salespeople answer that they just want to sell", "The assessment measures desire for sales specifically, not desire to succeed"]}, {"t": 1547, "p": "'Any questions for me?' answered with 'I don't believe so' is a red flag."}, {"t": 1589, "p": "He said salespeople fail by not listening to what the customer wants, then couldn't say what the hiring client wanted out of the role — his third interview.", "subs": ["Strong candidates answer specifically: they want someone highly coachable who can generate new business", "Buzzwords about listening and relationships excite interviewers and prove nothing"]}, {"t": 1620, "p": "The assessment had already flagged him for not listening and not asking enough questions — the interview simply confirmed it."}, {"t": 1691, "p": "Know the answer you're fishing for before you ask the question."}], "quote": {"t": 1620, "text": "Do we ask the questions that allow us to get in depth or do we have a tendency to stop too short?"}}, {"t": 1734, "label": "Pressure, reversing and how candidates handle it", "points": [{"t": 1734, "p": "Listen for 'I think' versus knowing — someone who has actually lived it states it as fact."}, {"t": 1772, "p": "When a candidate tries to reverse you, hand it back: 'You already know the answer to that. Just answer the question.'"}, {"t": 1801, "p": "Run them through the ringer; the good ones stay calm and never let on that it rattled them."}, {"t": 1840, "p": "Pressure belongs in sales-role interviews to see how fast they move; at director level and above it's a respect conversation."}, {"t": 1874, "p": "A candidate once slammed the table, cursed the interviewer and walked out — his references had already flagged that he doesn't stay calm under pressure."}, {"t": 1913, "p": "The design is deliberate: find every flaw, watch how they respond, then tell them you're fine with the flaws.", "subs": ["Candidates leave each round sure it went badly", "By the end there's no confusion about where anyone stands"]}, {"t": 1954, "p": "Two employees confirmed it from the candidate side — certain they'd blown it, and called back every time."}], "quote": {"t": 1772, "text": "You already know the answer to that."}}, {"t": 1990, "label": "First interview: the resume shred", "slides": [17, 18, 19, 20], "points": [{"t": 1990, "p": "Every claim on the resume needs a challenge: what does that mean, and how do you do it?", "subs": ["'Powerful relationship builder who exponentiates my network' — what does that mean?", "'Progressive leader' — how exactly do you do that?"]}, {"t": 1990, "p": "Dig three layers deep, same as a sales call — the third layer is where the truth shows up."}, {"t": 2028, "p": "'I was number two in the company' turned into number two out of three when challenged."}, {"t": 2065, "p": "A candidate leaving because he carried the majority of the business was ranked one of four and later admitted he did about 20 percent — the math didn't add up."}, {"t": 2065, "p": "The first two interviews are resume shred and matching back to the assessment; only after that do you sell them on the company."}], "quote": {"t": 1990, "text": "Every claim needs a challenge."}}, {"t": 2102, "label": "Later interviews, alignment, culture fit and coachability", "slides": [21, 23], "points": [{"t": 2102, "p": "Late-stage interviews shift to why you believe they fit, with a few remaining things to validate."}, {"t": 2102, "p": "Get specific on money and align on goals and expectations before an offer."}, {"t": 2102, "p": "The simplest culture test: would you ride in a car with this person for two hours to the company retreat?", "subs": ["Seven minutes in, some candidates are an obvious no regardless of skill"]}, {"t": 2139, "p": "Ask if they're coachable, then ask for the most recent piece of advice from a leader that they implemented."}, {"t": 2177, "p": "A real answer is specific — a boss told them to go deeper in discovery and document it — and you keep digging from there."}, {"t": 2177, "p": "'That's a good question,' or a story about advice they disagreed with and ignored, fails the test."}, {"t": 2214, "p": "It has to be the person they directly report to — not a father, pastor, mentor or best friend.", "subs": ["'How would you demonstrate you're coachable?' invites book answers", "One candidate cited Good to Great and, asked what he implemented, said it's about going from good to great"]}], "quote": {"t": 2139, "text": "18 years of doing this, no one's ever said no."}}, {"t": 2253, "label": "Questions for responsibility, need for approval and emotional involvement", "points": [{"t": 2253, "p": "Ask about the last three opportunities they should have won and didn't, and why."}, {"t": 2295, "p": "Better product, faster delivery and price are external locus of control answers — low responsibility."}, {"t": 2295, "p": "High responsibility sounds like: I wasn't talking to the right person, I failed to build value, I skipped steps, I didn't qualify them.", "subs": ["On a price answer, ask whether they've ever won while being higher priced", "If they dig in and insist you don't understand, you're done; if they reconsider, there's something to coach"]}, {"t": 2335, "p": "For need for approval, ask what matters more — being liked by a customer or winning the business.", "subs": ["An instant 'winning the business' means low need for approval", "'If they like me they'll eventually buy from me' means high need for approval", "'I'd like both' is fine"]}, {"t": 2406, "p": "Asked why he wanted to be in sales, a candidate pointed to a brother-in-law who travels and wins reward trips — he was sold on the perks."}, {"t": 2438, "p": "Told bluntly he wasn't cut out for the role, he answered 'you're the expert' — no pushback at all, which exposed low commitment and weak emotional involvement."}, {"t": 2476, "p": "Strong emotional involvement stays calm and asks where that's coming from; a cheat sheet of these questions is available on request."}]}, {"t": 2513, "label": "The phone interview: 30 minutes, matched to the ad", "slides": [12, 13, 14, 15], "points": [{"t": 2513, "p": "Keep it to 30 minutes or less and open by asking if they have the ad in front of them."}, {"t": 2548, "p": "Read the key requirements back and ask them to tell you how that's them.", "subs": ["'You must have a strong ability to sell value'", "'We're looking for people who are highly coachable and admit their failures'", "'You have to be very accountable to your own goals'"]}, {"t": 2548, "p": "Score presence and warmth: do they hold your attention, and do they sound like a person rather than a robot."}, {"t": 2591, "p": "Warmth is 'absolutely, let me give you an example and tell me if that's what you're looking for' — not a recited situation from 1987."}, {"t": 2591, "p": "If you're on the fence, use the blow-off at the end and watch how they handle it.", "subs": ["'If you don't hear from us by Wednesday, we shake hands, part friends and wish you the best'", "'If you do, the next step is a 60-minute virtual conversation'", "A candidate who just says okay is a concern; one who asks whether they're a good fit is showing something"]}, {"t": 2626, "p": "Don't blow off the strong ones — ask if it's worthwhile to keep talking and move them straight to scheduling."}, {"t": 2662, "p": "Raise any high-level concern right on that call, like someone from a big company joining a small entrepreneurial shop."}], "quote": {"t": 2548, "text": "Match them back to the ad. Don't get creative. 30 minutes or less."}}, {"t": 2694, "label": "Homework and next steps", "points": [{"t": 2694, "p": "The next session is entirely application — scenarios, and what question you'd ask."}, {"t": 2694, "p": "Before then, list the additional behaviors you want to validate and write the questions for each.", "subs": ["Coachability was the worked example", "Validating the capability behind claimed experience is the open one"]}, {"t": 2735, "p": "Knowing what to listen for matters as much as the question itself — plenty of people ask great questions and miss the answer."}, {"t": 2735, "p": "Two commitments out of the session: tighten up the ad, and match candidates back to it more crisply."}, {"t": 2769, "p": "Closing: go sell."}], "quote": {"t": 2735, "text": "What's also as important as a question you ask is knowing what to listen for."}}]},
{key:"clinic", title:"Interviewing Clinic", yt:"192qSyr-1c8", cover:"Assets/training/clinic.jpg", slidedir:"Assets/slides/clinic/",
 chapters:[{"t": 0, "label": "Screening candidates before the first interview", "slides": [22, 23], "points": [{"t": 0, "p": "How you run the assessment step depends on candidate flow. When flow gets low, insert a short 15-minute conversation so the candidate earns the right to the assessment.", "subs": ["Heavy flow and people just aren't completing? Then it's email, not a call.", "Low flow means you work it a little and prompt candidates proactively."]}, {"t": 44, "p": "Don't fire the assessment invite out automatically. Wait a day so it doesn't read as an auto-reply, then nudge again on day three.", "subs": ["Day 3 nudge: \"Notice you haven't completed. Has something changed?\""]}, {"t": 85, "p": "Decide the three to five background items you require before you scan a single resume."}, {"t": 117, "p": "Screen with an assessment, because resume quality and candidate quality don't track each other. Never base the decision solely on a resume."}, {"t": 155, "p": "Write down the immediate disqualifiers too, not just the must-haves.", "subs": ["Who are they selling to? What type of sales cycle? Any real hunter experience?", "Retail-only background against a B2B consultative role is a no."]}, {"t": 189, "p": "Most of what you need isn't on the resume anyway. Plan to get it in the first phone call."}]}, {"t": 203, "label": "Making candidates prove the sales training they claim", "slides": [11, 20, 21, 27], "points": [{"t": 206, "p": "Open with the broad version: \"Over that time, what type of professional development, specifically sales training, have you had?\""}, {"t": 225, "p": "Never stop at the first answer. Dig layer after layer.", "subs": ["\"Did you do any other formal training similar to that?\"", "\"How long ago was that?\"", "\"You said it was really good, so why did you stop?\"", "\"Why didn't you pay for it out of pocket?\""]}, {"t": 240, "p": "Listen for blame. \"The company stopped paying for it because they didn't appreciate us anymore\" is excuse-making, and it shows up on the assessment too."}, {"t": 267, "p": "Better questions than the hypothetical ones: \"What did you take out of it?\" and \"Walk me through that process.\""}, {"t": 291, "p": "The number one trap leaders fall into is asking if they've been through training, hearing yes plus a few buzzwords, and assuming they have it.", "subs": ["Candidates will hand you pain, up-front contracts, and every other term they know.", "Make them role play it: \"What does that sound like? How are you using it?\"", "People who loved the training but can't demonstrate it were often vacationers who liked training because it let them avoid prospecting."]}, {"t": 329, "p": "Hypotheticals can be faked. \"What did you take out of it, now role play it\" cannot. Inspect what you expect."}, {"t": 394, "p": "When a candidate says he builds trust, ask him how, right then, and see if he can do it without missing a beat."}], "quote": {"t": 394, "text": "Sellers know buzzwords. Sellers know what buzzwords to say."}}, {"t": 459, "label": "Onboarding priorities for a new salesperson", "points": [{"t": 502, "p": "Ask yourself what the new hire must know in the first month. Start with your sales process and the problems you solve."}, {"t": 599, "p": "The longer you're in it, the easier you think it is. Template onboarding as if the person knows nothing, then validate quickly on the pieces they already have.", "subs": ["Don't skip a step because they seem experienced. Just move fast through it.", "Long-tenured owners forget it took them eight months to do what they now expect in four weeks."]}, {"t": 637, "p": "Onboarding, like selling, is not based on time. It's based on milestones achieved."}, {"t": 675, "p": "Set a progression of development. They get good at prospecting first, then move to the selling skills.", "subs": ["Prospecting level: 30-second commercial, setting meetings on LinkedIn, prospecting for free talks, commercials for referrals and networking, preparing for a cold call.", "Selling level: sending homework, setting the initial up-front contract, building the case, running pain-budget-decision, getting comfortable yes/no's."]}, {"t": 709, "p": "Week one is mostly administrative, plus the sales process and the problems you solve. Teach what you solve, not how you solve it.", "subs": ["Publish the warning signs that they aren't going to make it: behavior dropping off, avoiding adversity, hiding, more coaching than prospecting and selling, to-do's not executed, falling behind onboarding items."]}, {"t": 779, "p": "The longer you let bad habits go at the start, the harder they are to reel back in. Most leaders simply don't spend enough time with people early."}, {"t": 817, "p": "Repeat everything at least three times in the first nine weeks and 90% of the time it still hasn't stuck. Template the ramp so the calendar time is already blocked.", "subs": ["The whole 12 weeks is built out with who owns which part and how much time each week takes.", "When someone is hired, the invites just go out for three months. No conversation required."]}], "quote": {"t": 779, "text": "The first 90 days are the most important 90 days of an employee life cycle."}}, {"t": 916, "label": "Writing the job ad for the person, not the position", "slides": [3], "points": [{"t": 916, "p": "Most postings describe the position. Switch it to describe the person."}, {"t": 950, "p": "The target reaction is a candidate telling you they read the posting and said, that's me."}, {"t": 958, "p": "Add a section on who this position is not a fit for.", "subs": ["Example: someone who relies on inbound leads."]}, {"t": 978, "p": "Make nearly everything preferred and keep only what is genuinely required as a must."}, {"t": 990, "p": "Hold the one real must-have. You can't put someone in front of your people who has never found, sold and closed business at a high level."}, {"t": 1020, "p": "The appealing part should be culture, and it has to be authentic. Not ping pong tables and kegs.", "subs": ["\"We lift as we climb\" and \"we genuinely make an impact\" attract the right person.", "You want them there for the passion, not because it looks fun."]}], "quote": {"t": 916, "text": "You want someone to read it and say, that's me. Not, ooh, that looks fun. Or, I can do that."}}, {"t": 1089, "label": "Hiring realities: tracking tools, odds, and speed", "points": [{"t": 1089, "p": "The tracking platform barely matters. Planner, Asana, Trello all work. Pick one where you can move cards and copy boards so you don't recreate the wheel."}, {"t": 1135, "p": "There is no silver bullet. Ten for the last fourteen on the sales side, and this is the first year turnover on new hires got budgeted for.", "subs": ["You can validate resumes, run assessments, follow a process, and still be wrong.", "The last one fired looked like a rock star and was gone in two months."]}, {"t": 1170, "p": "Hire slow, fire fast. Get a little better every time."}, {"t": 1197, "p": "Most companies need a year to figure out someone isn't working, because there is no onboarding, no accountability and no weekly measurements. That's why resumes are full of one-year stints."}], "quote": {"t": 1170, "text": "You're either gone after three months or you're here for your entire life."}}, {"t": 1254, "label": "Structuring the first interview around real pressure", "slides": [6, 15], "points": [{"t": 1254, "p": "Put more than one person in the process. The group meets the candidate, then makes a joint recommendation to the owner."}, {"t": 1280, "p": "The process doesn't change by department. Isolate the piece that actually matters for that role and interview for it.", "subs": ["For a young marketing hire, the only real question was whether she could handle direct people."]}, {"t": 1319, "p": "Interview for culture by throwing a curveball and watching the reaction.", "subs": ["\"I'm not here to build small talk\" told him everything in the first five seconds.", "If it offends them, they won't survive the office. If they fire back, they'll fit."]}, {"t": 1354, "p": "A sales candidate's first interview must not be conversational. It should carry as much pressure as the job does."}, {"t": 1396, "p": "Match the format to the real selling environment.", "subs": ["An orthopedic client ran hour-long HR interviews for reps who get eight to ten minutes with a doctor at a scrub sink.", "Changed to ten minutes with a sales leader throwing curveballs. Crumble and you're out, hang in and you move forward, then HR."]}], "quote": {"t": 1431, "text": "That's by design. I just want to see if you can handle some pressure. We're in a pressure world."}}, {"t": 1463, "label": "Opening the interview and making them drive", "points": [{"t": 1492, "p": "Use the same up-front contract every time: thanks for the 30 minutes, not looking to be a pain, if we move quick it means you gave me exactly what I was looking for, then hand it to them to start."}, {"t": 1504, "p": "Handing them the start tests whether they can drive and lead the conversation. \"Well, what would you like to know?\" is a bad sign.", "subs": ["A prospect never volunteers their pains first and then asks you to present. They say, what do you got?"]}, {"t": 1519, "p": "A good candidate takes it and runs: \"I'll give you a little bit about me and why I'm interested in this position.\""}, {"t": 1540, "p": "Go quiet on purpose mid-interview and see where they take it. Nine minutes in, this one got uncomfortable and asked whether you have kids."}, {"t": 1566, "p": "Shut up more in interviews. Let them either drive it or bury themselves."}, {"t": 1576, "p": "The strong ones handle the silence and ask a real question.", "subs": ["One asked, \"What's running through your head?\" during the pause.", "Another's question wasn't fluff. It was, can you walk me through a normal day in your company?"]}]}, {"t": 1620, "label": "Weaknesses, transparency, and reading the assessment live", "slides": [19], "points": [{"t": 1620, "p": "One candidate volunteered his own list: doesn't like being rushed, over-words emails, life outside work matters, uses a calculator for all math, reads slowly, called too nice and a boy scout."}, {"t": 1634, "p": "Refuse the humble-brag weakness. \"I work too much\" dressed as a flaw fools nobody."}, {"t": 1678, "p": "Three of the things he confessed were already in the assessment, sitting in front of you.", "subs": ["High altruistic motivation: bends over backwards for others to his own detriment.", "Perfectionism flagged in the hunter competency, which delays opportunities.", "High need for approval."]}, {"t": 1704, "p": "None of those findings are automatic no's. The question is whether they can handle adversity and are willing and able to do something about it."}, {"t": 1739, "p": "Test whether they can hold your attention. Someone who can't hold attention in an interview won't hold a room of leaders for 90 minutes."}], "quote": {"t": 1697, "text": "Ain't none of us perfect."}}, {"t": 1759, "label": "Validating coachability", "points": [{"t": 1772, "p": "Validate coachability in the interview even when the assessment already scores it."}, {"t": 1809, "p": "Question one: \"Would you consider yourself a coachable person?\" In 19 years, no candidate has ever said no."}, {"t": 1843, "p": "Question two does the real work: \"What's the most recent piece of advice you took from a leader that you implemented?\"", "subs": ["Say leader, in a business setting. Ask it loosely and they'll quote a pastor or a friend."]}, {"t": 1874, "p": "A strong answer is specific. This one described keeping a glass of water nearby to pause and think before answering instead of firing back the first thing."}, {"t": 1913, "p": "Then apply the pressure: \"So you've got a glass of water next to you now?\" If the answer is no, ask why they didn't follow the advice they claim they took."}, {"t": 1943, "p": "Interview for coachability regardless of the position."}], "quote": {"t": 1943, "text": "If someone's not willing to take advice from a leader to help them, then you're just going to want to do things your way."}}, {"t": 1956, "label": "Red flags in the first two minutes", "points": [{"t": 1956, "p": "His girlfriend told him he looked like a waiter before the interview and he did nothing about it. The question is, \"So why didn't you do something about it?\""}, {"t": 1986, "p": "Play back the first two minutes of any recorded interview and ask what scares you."}, {"t": 1999, "p": "This one took the interview from his car while running errands on a snow day, in a hat and flannel."}, {"t": 2010, "p": "If they say they have plenty of time, they had time to take the call somewhere other than the car."}, {"t": 2015, "p": "Dress matters. You don't need a fashionista, but jeans, boots and a shirt clear the bar."}, {"t": 2051, "p": "Look at the vehicle. A few stale goldfish and a sippy cup is nothing. A back seat you can't fit a mouse into is a problem."}], "quote": {"t": 2051, "text": "Cluttered car, cluttered mind."}}, {"t": 2121, "label": "Matching the candidate against the job ad", "slides": [7], "points": [{"t": 2121, "p": "Restate the up-front contract, and remember that moving fast is not good news for the candidate. It means they gave you what you were looking for and you're moving on."}, {"t": 2150, "p": "Screen share the actual posting and read the key pieces back to them."}, {"t": 2159, "p": "Take one line at a time and put it on them.", "subs": ["\"Passionate about helping others. You have thick skin.\"", "\"You excel at prospecting, qualifying and closing new business in a competitive market. Tell me how that's you.\""]}, {"t": 2192, "p": "Throw the hardest objection they'd actually face and grade the response.", "subs": ["To a 22-year-old: what do you do when a 55-year-old sales guru making $700,000 asks what you're going to teach him?", "His answer, without missing a beat: \"I tell him I'm here for a reason.\""]}], "quote": {"t": 2150, "text": "Let me reread back to you some of the key pieces we're looking for and you can tell me how that's you."}}, {"t": 2219, "label": "Fixing onboarding that started out informal", "points": [{"t": 2241, "p": "The golden rule of onboarding: everything is a scavenger hunt. Shadowing only counts if they knew what they were looking for."}, {"t": 2259, "p": "Brief the ride-along like an up-front contract.", "subs": ["Here are the points we're covering, here's where they came from, here's how it applies to our process.", "Here's what I want you to look for. Then debrief it on the drive back."]}, {"t": 2284, "p": "Most leaders say \"spend a day with this person,\" then ask what they learned, and get back whatever the new hire happened to notice. Tell them what to look for."}, {"t": 2298, "p": "Three months in, judge it by one question: are they where you expected them to be? If they're ahead, stop beating yourself up over the process."}, {"t": 2304, "p": "Take the lesson, structure it better next time, and let the outcome stand."}], "quote": {"t": 2304, "text": "The result wins over the how."}}, {"t": 2338, "label": "Re-engaging a client who has gone silent", "points": [{"t": 2338, "p": "The scenario: an existing client, a $15,000 project delivered well, a verbal yes on the next program, then four weeks of silence after the statement of work went over."}, {"t": 2433, "p": "Cut \"I know you're busy\" and \"I know your busy season is upon us.\" You're handing them fuel for the excuse."}, {"t": 2463, "p": "First email after the ghost, and nothing more: \"Bob, how do we reconnect?\"", "subs": ["Confirm first that this person is actually the one who says yes or no."]}, {"t": 2466, "p": "No response? Forward that same email with one line: \"Did this make it through to you?\" It psychologically compels a reply.", "subs": ["Not \"Hi, hope you're doing well, I was just curious if this happened to make its way through.\" Just the one line."]}, {"t": 2501, "p": "Third step is the two-option email: either something changed and this is no longer a priority, which is perfectly fine, or life has been crazy and you're committed to a short conversation in the next three to five business days. Which one are you?"}, {"t": 2538, "p": "Give them permission to say no. They may have changed their mind and feel bad because they made a commitment."}, {"t": 2570, "p": "Practical version: forward the calendar invite they no-showed and type, how do we reconnect?"}], "quote": {"t": 2538, "text": "We put too many words in emails. Make it simple and quick and to the point."}}]},
{key:"onboarding", title:"Orientation vs Onboarding", yt:"dO_hl4YLUBw", cover:"Assets/training/onboarding.jpg", slidedir:"Assets/slides/onboarding/",
 chapters:[{"t": 0, "label": "Orientation and onboarding are not the same thing", "slides": [4], "points": [{"t": 0, "p": "Today covers four things: the difference between orientation and onboarding, the holes in our own onboarding, how to strengthen the first 90 days, and specific actions to leave with.", "subs": ["Our own first 90 days is about 90% built, and we're now extending onboarding across the full first year."]}, {"t": 35, "p": "Leaders are not selfish enough with their time. They get caught in today instead of front-loading time with new people."}, {"t": 73, "p": "A six-year-old lab sat two feet into the cattails without moving and retrieved every bird on command. A 14-month-old lab wouldn't even come back, and the guide admitted they hadn't put in the same hours with him.", "subs": ["Two whistles means go left, one whistle means go right. That level of response only comes from time spent up front.", "Anything well trained and disciplined has a lot of hours behind it, the same way mastery takes 10,000 hours."]}, {"t": 112, "p": "Orientation is a one-time event. Think freshman orientation: you go for a day, someone shows you where you eat and where things are, and at the end of the day it's done."}, {"t": 149, "p": "Onboarding is ongoing. That's the biggest difference between the two."}, {"t": 187, "p": "Plenty of companies have solid onboarding structure and simply fail to implement it, which is exactly what you get angry at your salespeople for doing with sales process."}], "quote": {"t": 35, "text": "If I spend more time with you up front, that's less time I have to spend with you in the long run."}}, {"t": 218, "label": "Where ramp-up time is being lost right now", "points": [{"t": 218, "p": "A great leader is somebody where your people see in you what they want to see in themselves. Onboarding is how you set that stage.", "subs": ["Tell the kids to start eating vegetables when they've never seen you eat anything green and they'll throw Doritos at you."]}, {"t": 218, "p": "Exercise for the room: to increase ramp-up time for new hires, what are we not doing that we could or should be doing?"}, {"t": 256, "p": "The longer you let a bad behavior go in the beginning, the harder it is to reel it back in."}, {"t": 291, "p": "Day one of fall break there was whining in the car and it got chopped off at the knees immediately, before it could set.", "subs": ["It worked because the rules were agreed up front. Everyone had the sheet, so there were no surprises to argue about."]}], "quote": {"t": 256, "text": "The longer you let a bad behavior go in the very beginning, the harder it is to reel it back in."}}, {"t": 325, "label": "Judging new hires and the weight of the first 90 days", "slides": [6, 7], "points": [{"t": 325, "p": "Three things to judge a new hire on, and to tell them you're judging them on: are they learning, are they building internal and external trust, and are they getting our way."}, {"t": 369, "p": "Here, getting our way means it is safe to screw things up, and it takes people a couple of months before they believe you mean it.", "subs": ["People who came from somewhere with no psychological safety, or where perfection was the standard, need to hear it repeatedly."]}, {"t": 369, "p": "One of nine sales hires was let go at day 87 for not getting our way. He tried to lone-wolf everything and said he liked to learn the hard way."}, {"t": 411, "p": "The first 90 days are the most important 90 days of an employee's life cycle."}, {"t": 411, "p": "New hires are dealing with possible job remorse, and so are you. Where there's no clarity there's no energy, so clarity has to be manufactured from both sides."}, {"t": 447, "p": "When people leave they blame something else, but the real cause is that habits were never formed in the first place."}, {"t": 487, "p": "\"He's been successful, we'll just let him do his thing\" is code for you don't have time to manage and you're hoping he does it all himself. That's pressure, not a plan."}], "quote": {"t": 447, "text": "Top performers must have strong onboarding plans. If not, they think you're just winging it."}}, {"t": 487, "label": "A rock star changes the timeline, not the milestones", "slides": [16], "points": [{"t": 487, "p": "Hiring a superstar, or a rehire, does not change the milestones. It changes the speed at which they get through them."}, {"t": 521, "p": "His son joined a team where most of the boys had played together for years. The coach walks every single boy through the same material; the son just takes longer on some of it."}, {"t": 561, "p": "The veterans nod and say they've got it. The new person is the one who has to ask what \"black kit\" actually means.", "subs": ["Black kit meant black socks, black shorts, black shirt and black warmup. Obvious to everyone who'd been there, meaningless to a newcomer."]}, {"t": 561, "p": "Almost nobody has enough competency checks built into their onboarding, and that's exactly the gap those checks are meant to catch."}, {"t": 603, "p": "Competency checks never end. Pilots never stop having them."}, {"t": 603, "p": "The coaching hat is where competency checks live, because you're asking. The trainer hat is telling, and telling proves nothing about what they can do."}, {"t": 643, "p": "Don't accept \"I asked it.\" Make them say the words they actually used, then you know what to train."}], "quote": {"t": 603, "text": "We don't know what to train unless we properly coach."}}, {"t": 643, "label": "Scavenger hunts and feedback from your newest hires", "slides": [14, 15], "points": [{"t": 643, "p": "Make onboarding a scavenger hunt. On Easter you quietly tell the youngest where some of the eggs are hidden so they actually find some."}, {"t": 682, "p": "A rep sent to spend the day with a top performer came back having learned all the wrong things, because no objective was ever set for the day."}, {"t": 720, "p": "Every card in the onboarding board carries an objective for what to look for.", "subs": ["Watch how they set expectations before an evaluation.", "Watch how they connect the dots between data and the story.", "Pay attention to how they ask the last question to frame things up."]}, {"t": 755, "p": "Perfection is a setup for failure. Play the improvement game instead."}, {"t": 789, "p": "Before onboarding the next hire, ask the last one two questions: what wasn't covered that you wish had been, and what did we cover that was too soon or not relevant?", "subs": ["A decade of that feedback is the single biggest reason the plan has gotten stronger.", "People closest in tenure typically give the best feedback."]}, {"t": 856, "p": "A recent hire asked for direct links instead of \"it's somewhere in SharePoint.\" Obvious to a ten-year veteran, invisible to somebody in week one."}], "quote": {"t": 682, "text": "If people don't know what to look for, they're not going to find it."}}, {"t": 892, "label": "Common pitfalls of onboarding", "slides": [9], "points": [{"t": 892, "p": "The room's own list of pitfalls: managers not held accountable to the process, the process not defined, and not enough role play."}, {"t": 937, "p": "The biggest issue is no repetition, or not enough of it."}, {"t": 966, "p": "He asks his kids the alarm code every second or third day so it's embedded before they ever need it. Repetition is about muscle memory."}, {"t": 1002, "p": "Too short: a one-week plan. Teach this Monday, that Tuesday, that Thursday, start selling next Monday."}, {"t": 1044, "p": "Too broad: operational onboarding instead of sales onboarding. Email setup, product lists and who to ask, with nothing that turns product information into sales knowledge.", "subs": ["One large orthopedic company's onboarding ran 312 pages of product learning, then wondered why every rep was trapped in unpaid consulting.", "Four months of learning product and the rep's instinct is to prove how smart they are."]}, {"t": 1084, "p": "Ride-with-a-veteran-only: the new person watches four referrals land from a duck blind and concludes the job is easy.", "subs": ["The veteran walks into a 20-year relationship and asks for the order. The new rep tries the same line cold the next week and gets shut down."]}, {"t": 1154, "p": "Time with veterans isn't the problem. You just have to tell them what to look for: how they plant their feet in a bad moment, how they navigate the money conversation.", "subs": ["Onboarding also means finding two people outside the building: one just a smidgen ahead to chase, and one far enough ahead to stretch you."]}], "quote": {"t": 1084, "text": "You're seeing year 17, not year one."}}, {"t": 1226, "label": "The four levels of onboarding", "slides": [10], "points": [{"t": 1226, "p": "Level one is awareness: moving from not knowing what you don't know to knowing what you don't know. That gap is not their fault."}, {"t": 1260, "p": "The levels mirror learn, know, own, live. You have to think about it before you do it, until eventually it happens without you realizing."}, {"t": 1295, "p": "Teaching a teenager to drive runs the same ladder: awareness of why you look ahead, knowledge of when to start looking, application while someone sits beside you, then it just happens."}, {"t": 1295, "p": "He won't tell his son what to do at a jacked-up five-way intersection. If mom narrates every move, the kid is following a direction, not thinking."}, {"t": 1328, "p": "Task completion is following a direction. Behavioral change is knowing what to do and being able to shift to the moment."}], "quote": {"t": 1295, "text": "I want you to think, not follow a direction."}}, {"t": 1363, "label": "Building the plan and spreading ownership", "slides": [12], "points": [{"t": 1363, "p": "The easiest way to build a plan: write out everything they need to know or do in their first 90 days to be successful. Whiteboard, Word, whatever. The mechanism doesn't matter."}, {"t": 1400, "p": "Once the list exists, drop it into weeks. What do they need first, what's the next level of priority after that."}, {"t": 1400, "p": "Multiple people should own sections of the plan rather than one person carrying all of it."}, {"t": 1437, "p": "Spreading ownership speeds up relationship building and pulls them into the culture faster. The hardest part of being new is fitting into the family, so force the family a little."}, {"t": 1475, "p": "Strong people want a role in onboarding because they think they can do it better than you did. Most of the time they're right, and they find it fulfilling."}, {"t": 1516, "p": "Be careful whose feedback you weight. Somebody flagged low in responsibility on an assessment will point outward, at what was set up wrong, instead of at what they wish they'd known."}, {"t": 1549, "p": "He takes feedback from the kid who asks where she screwed up, not from the one who suggests dad start doing the homework."}]}, {"t": 1583, "label": "The big-picture buckets and onboarding culture", "slides": [13], "points": [{"t": 1583, "p": "Build the list from buckets: administration and key players, products, services, culture, delivery process, formal offsite training, and operations."}, {"t": 1583, "p": "Culture has to be onboarded deliberately. Make it glaringly obvious instead of hoping people connect dots."}, {"t": 1625, "p": "You can indoctrinate people into culture all day long. If they don't trust you, it doesn't matter."}, {"t": 1625, "p": "On day two his boss told him the goal was to get him to a point where he'd jump off a cliff with him. It sounded strange at the time, and it worked."}, {"t": 1662, "p": "Day one was blunter: you're dressed badly, go buy some nice clothes. Then five hundred-dollar bills, specific stores to go to, and 3,000 cold calls to make in the first six months."}], "quote": {"t": 1625, "text": "My goal is to get you to a point where you would follow me and jump with me off of a cliff."}}, {"t": 1696, "label": "Ways to run competency checks", "slides": [18], "points": [{"t": 1696, "p": "Competency checks must be inserted into onboarding, and they go well beyond role play. Live calls count."}, {"t": 1696, "p": "Video checks work well: have them record their 30-second commercial, or two rules for each step of the process, and send it in."}, {"t": 1735, "p": "Video is the check for leaders running ragged. No face-to-face required, and it's stored so you can watch it whenever you want."}, {"t": 1735, "p": "Other people can play competency checker. Send them out to find two coaches this week to give their commercial to, which also gets them different perspectives."}, {"t": 1775, "p": "His boss would call at 9:30 at night: I see you have a meeting at 10 tomorrow, give me your up-front contract."}, {"t": 1803, "p": "The calls stopped when there was a pattern, not when he got it right once."}], "quote": {"t": 1775, "text": "Hey, I see you have a meeting at 10 o'clock tomorrow. Give me your up-front contract."}}, {"t": 1840, "label": "Give them the plan, then repeat it", "slides": [19, 20], "points": [{"t": 1840, "p": "A lot of people never share the onboarding plan with the person being onboarded. It is not a secret."}, {"t": 1840, "p": "When they hold the plan, strong hires flag what you skipped: we never got into this, we zipped past that. Behind a curtain, they can't help drive accountability with you."}, {"t": 1882, "p": "Repeat, then repeat again, and when you believe you have repeated enough, repeat four more times."}, {"t": 1882, "p": "Attention spans keep collapsing. The onboarding and learning specialists revise their number down every time, and every ding and ring makes it worse."}], "quote": {"t": 1882, "text": "The further you get away from the beginning, the less time you think something takes."}}, {"t": 1917, "label": "Clear direct communication versus ripping heads off", "points": [{"t": 1917, "p": "A rep and her leader had been butting heads for six or eight months. People are never fighting you, they're fighting a need."}, {"t": 1953, "p": "Her need was appreciation. She paid attention to seven corrections precisely because she got the two things she did well first."}, {"t": 1953, "p": "Don't assume everyone learns the way you learn. He learns by being shredded, and defaulted to handing people the same thing."}, {"t": 1994, "p": "It isn't the head-ripping that works, it's clear direct communication. You can be serious and completely blunt without degrading someone."}, {"t": 2035, "p": "Motivation used to be money or not money. Now there are intrinsic and even altruistic motivations, including reps who help the prospect at their own or the company's expense.", "subs": ["Some people would flatten another person's tires for one more penny.", "Others don't care about money at all and are driven by how they look in front of others."]}], "quote": {"t": 1917, "text": "People are never fighting you. They're fighting a need."}}, {"t": 2067, "label": "Inside the actual onboarding board", "points": [{"t": 2067, "p": "The onboarding board is a template with no names attached. It gets copied for each new hire and people get assigned then, so nothing has to be rebuilt when the roster shifts."}, {"t": 2067, "p": "Every item on it has a description of what to look for."}, {"t": 2109, "p": "Week three includes role-played cold calls to associates and a role-played first 15 minutes."}, {"t": 2109, "p": "Culture tiles hang in the office and each one has a video behind it. New hires watch it and send back what it means to them."}, {"t": 2145, "p": "There's a lot of review built in and a lot of competency checks, and it still isn't finished. It gets a little better every time."}], "quote": {"t": 2145, "text": "I don't have enough faith in people always picking up dots, and it's not their fault, because a lot of times they don't know what to look for."}}, {"t": 2179, "label": "Extending onboarding past year one", "points": [{"t": 2179, "p": "Open floor: what has worked for the rest of the group, what areas each person will strengthen, how, and by when."}, {"t": 2179, "p": "After 26 years they realized they got people through year one well, then assumed the rest was just bigger clients and deeper conversations. Month 18 brings different problems than month 2."}, {"t": 2221, "p": "They're building rites of passage instead of the old approach of taking on bad clients cheaply so a rep learns how it feels to waste a lot of time.", "subs": ["They sat down and listed the rites of passage everyone went through, then looked for ways to keep the lesson and change how it's learned.", "Months 12 to 18 will probably be about six items; months 18 to 24 maybe three. Not many, but big ones."]}, {"t": 2261, "p": "Don't wear a bad onboarding as a badge of honor. Saying it's why we are who we are isn't doing the next person justice."}, {"t": 2299, "p": "The quicker a new hire gets a result, the longer they stay. Get them out of new-toy phase fast, because you learn nothing about someone until they're frustrated and their back is against the wall."}], "quote": {"t": 2261, "text": "It's not about providing handouts. It's just how can you help people ramp up faster, better, quicker."}}, {"t": 2333, "label": "Working the list, the weeks and the board colours", "points": [{"t": 2333, "p": "Go back to the buckets, administration, products, services, and start writing out everything they need to know at the beginning."}, {"t": 2370, "p": "Their list includes items like the top three to five problems we solve for clients, the top three third-party stories, and when to push back on leadership."}, {"t": 2370, "p": "Take that big list and put it into weeks. What's the biggest priority for week one, what's the next level of priority for week two."}, {"t": 2402, "p": "Cards slide forward and backward between weeks constantly. Nobody's board ends up looking like the template, and that's fine as long as every card gets taken care of."}, {"t": 2402, "p": "Colours track status: green is accomplished, yellow is in the works or waiting on a competency check, red is badly behind. Address the reds before moving on."}]}, {"t": 2438, "label": "Closing and commitments", "points": [{"t": 2438, "p": "He still has the paper-thin T-shirt from his 1996 college orientation. A one-day whirlwind in the summer before campus started. That's what an orientation is."}, {"t": 2438, "p": "Be good selfish. The more you front-load your time, effort and energy with newer people, the more it helps them and the more it helps you."}, {"t": 2480, "p": "Leave with two to three very specific action steps, written down before lunch or before your head hits the pillow tonight."}, {"t": 2480, "p": "Otherwise you walk out saying that was good and I've got a lot of work to do, and two weeks later you're in the exact same spot."}], "quote": {"t": 2438, "text": "We're not in the orientation game, we're in the onboarding game."}}]},
];


function hhmm(t){
  t = Math.max(0, Math.round(t));
  var h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h + ":" + (m<10?"0":"") : "") + m + ":" + (s<10?"0":"") + s;
}
function findSession(k){
  for(var i=0;i<TRAINING.length;i++) if(TRAINING[i].key === k) return TRAINING[i];
  return null;
}

/* ---------------- the YouTube player ---------------- */
var YT_READY = false, PLAYER = null, PENDING = null;
window.onYouTubeIframeAPIReady = function(){
  YT_READY = true;
  if(PENDING){ var v = PENDING; PENDING = null; mountPlayer(v); }
};
function mountPlayer(videoId){
  var host = document.getElementById("yt-host");
  if(!host) return;
  if(!YT_READY || !window.YT || !YT.Player){
    PENDING = videoId;
    if(!document.getElementById("yt-api")){
      var sc = document.createElement("script");
      sc.id = "yt-api"; sc.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(sc);
    }
    return;
  }
  PLAYER = new YT.Player("yt-host", {
    videoId: videoId,
    playerVars: {rel:0, modestbranding:1, playsinline:1}
  });
}
function seekTo(t, videoId){
  if(PLAYER && PLAYER.seekTo){
    PLAYER.seekTo(t, true);
    if(PLAYER.playVideo) PLAYER.playVideo();
    var st = document.querySelector(".stage");
    if(st) st.scrollIntoView({behavior:"smooth", block:"start"});
  } else {
    /* the API never loaded — fall back to opening YouTube at that moment */
    window.open("https://youtu.be/" + videoId + "?t=" + Math.round(t), "_blank", "noopener");
  }
}

var TRAINING_SECTION = {
key:"training", img:"Assets/nav/training-sessions.svg", title:"Training Sessions",
render:function(r){
  var parts = location.hash.replace(/^#/,"").split("/");
  var ses = parts[2] ? findSession(parts[2]) : null;
  return ses ? trainingSession(r, ses) : trainingIndex(r);
}};

function trainingIndex(r){
  return '<div class="vidgrid">' + TRAINING.map(function(s){
    return '<a class="vidcard" href="#' + r.key + '/training/' + s.key + '">' +
             '<span class="thumb"><img src="' + s.cover + '" alt="" loading="lazy">' +
               '<span class="play"><span><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span></span>' +
             '</span></a>';
  }).join("") + '</div>';
}

function trainingSession(r, s){
  var acc = r.accentText || r.accent;

  var chips = '<div class="chips">' + s.chapters.map(function(c,i){
    return '<button class="chip" data-t="' + c.t + '">' +
           '<span class="ct" style="color:' + acc + '">' + hhmm(c.t) + '</span>' +
           '<span class="cl">' + esc(c.label) + '</span></button>';
  }).join("") + '</div>';

  var outline = s.chapters.map(function(c,i){
    var pts = '<ul class="pts">' + c.points.map(function(p){
      return '<li><button class="tmini" data-t="' + p.t + '" style="color:' + acc +
             ';border-color:' + tint(r.accent,.55) + '">' + hhmm(p.t) + '</button><div><p>' +
             esc(p.p) + '</p>' +
             (p.subs ? '<ul class="subs">' + p.subs.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>' : "") +
             '</div></li>';
    }).join("") + '</ul>';

    var figs = "";
    if(c.slides && c.slides.length){
      figs = '<div class="figs' + (c.slides.length > 1 ? " two" : "") + '">' +
        c.slides.map(function(n){
          var nn = (n < 10 ? "0" : "") + n;
          return '<img src="' + s.slidedir + 's-' + nn + '.jpg" alt="Slide ' + n + '" loading="lazy" decoding="async">';
        }).join("") + '</div>';
    }

    var q = "";
    if(c.quote){
      q = '<blockquote class="oquote" style="background:' + tint(r.from,.09) +
          ';border-color:' + r.accent + '">' + esc(c.quote.text) +
          '<button class="tmini" data-t="' + c.quote.t + '" style="color:' + acc +
          ';border-color:' + tint(r.accent,.55) + '">' + hhmm(c.quote.t) + '</button></blockquote>';
    }

    return '<section class="osec" id="s' + i + '">' +
             '<div class="osec-h"><button class="tchip" data-t="' + c.t +
               '" style="background:' + grad(r) + '">' + hhmm(c.t) + '</button>' +
               '<h3>' + esc(c.label) + '</h3></div>' +
             pts + figs + q +
           '</section>';
  }).join("");

  return '<div class="stage"><div id="yt-host"></div></div>' +
    '<h2 class="shead">Chapters</h2>' + chips +
    '<h2 class="shead">Outline</h2>' + outline;
}

function wireTraining(r){
  var parts = location.hash.replace(/^#/,"").split("/");
  var ses = parts[2] ? findSession(parts[2]) : null;
  if(!ses) return;
  PLAYER = null;
  mountPlayer(ses.yt);
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function(b){
    b.addEventListener("click", function(){
      seekTo(+b.getAttribute("data-t"), ses.yt);
    });
  });
}

var ALL_SECTIONS = SECTIONS.concat([EMAIL_SECTION, TRACKING_SECTION]);

function findRegion(k){
  for(var i=0;i<REGIONS.length;i++) if(REGIONS[i].key === k) return REGIONS[i];
  return null;
}
/* The region grid, read top-left to bottom-right. Writing The Ad and
   Re-Written Ads are mutually exclusive per region, so exactly six survive.
   Add a tile: put its key in this list. */
var NAV_ORDER = [
  "checklist", "emails",       "training",
  "mini-course", "ad-examples", "rewritten-ads", "onboarding-plan"
];

/* a section marked `only` shows for that region alone; `not` hides it there */
function sectionsFor(r){
  var all = SECTIONS.concat([EMAIL_SECTION]);
  var byKey = {};
  for(var i=0;i<all.length;i++) byKey[all[i].key] = all[i];
  return NAV_ORDER.map(function(k){ return byKey[k]; }).filter(function(s){
    if(!s) return false;
    if(s.hidden) return false;
    if(s.only && s.only !== r.key) return false;
    if(s.not  && s.not  === r.key) return false;
    return true;
  });
}
function findSection(k){
  for(var i=0;i<ALL_SECTIONS.length;i++) if(ALL_SECTIONS[i].key === k) return ALL_SECTIONS[i];
  return null;
}

function homeView(){
  return '<h1 class="page-title">Hubexo Sales Hiring Hub</h1>' +
    '<div class="regions">' +
      REGIONS.map(function(r){
        return '<a class="region" href="#' + r.key + '" style="background:' + grad(r) +
               ';color:' + r.ink + ';box-shadow:0 20px 46px -22px ' + tint(r.from,.75) + '">' +
               '<span class="rn">' + r.name + '</span></a>';
      }).join("") +
    '</div>';
}

function regionView(r){
  return '<div class="banner" style="background:' + grad(r) + ';color:' + r.ink +
           ';box-shadow:0 20px 46px -24px ' + tint(r.from,.7) + '">' +
           '<p class="eyebrow">Hubexo Sales Hiring Hub</p><h1>' + r.name + '</h1></div>' +

    '<div class="roles">' +
      r.options.filter(function(a){ return !a.hideRole; }).map(function(a){
        return '<a class="role" href="' + a.reg + '" target="_blank" rel="noopener" ' +
               'style="background:' + grad(r) + ';color:' + r.ink +
               ';box-shadow:0 14px 32px -18px ' + tint(r.from,.7) + '">' +
               '<span>' + esc(a.label) + '</span>' + ARROW + '</a>';
      }).join("") +
    '</div>' +

    '<div class="navgrid">' +
      sectionsFor(r).map(function(s){
        var href = s.href ? s.href : '#' + r.key + '/' + s.key;
        var out  = s.href ? ' target="_blank" rel="noopener"' : '';
        return '<a class="navtile" href="' + href + '"' + out + '>' +
               '<img src="' + s.img + '" alt="' + esc(s.title) + '"></a>';
      }).join("") +
    '</div>';
}

/* a training session names itself in the banner rather than the section */
function sectionHeading(s){
  if(s.key === "rewritten-ads"){
    var p = location.hash.replace(/^#/,"").split("/");
    var a = p[2] ? findAd(p[2]) : null;
    if(a) return a.label;
  }
  if(s.key === "training"){
    var parts = location.hash.replace(/^#/,"").split("/");
    var ses = parts[2] ? findSession(parts[2]) : null;
    if(ses) return ses.title;
  }
  return s.title;
}
function sectionView(r,s){
  var back = {href:"#" + r.key, label:r.name};
  var parts = location.hash.replace(/^#/,"").split("/");
  if(s.key === "training" && parts[2])
    back = {href:"#" + r.key + "/training", label:"All sessions"};
  if(s.key === "rewritten-ads" && parts[2])
    back = {href:"#" + r.key + "/rewritten-ads", label:"All three ads"};
  return '<a class="backlink" href="' + back.href + '">' + BACK + esc(back.label) + '</a>' +
    '<div class="banner sec" style="background:' + grad(r) + ';color:' + r.ink +
      ';box-shadow:0 18px 40px -24px ' + tint(r.from,.7) + '">' +
      '<p class="eyebrow">' + esc(r.name) + '</p><h1>' + esc(sectionHeading(s)) + '</h1></div>' +
    s.render(r);
}

/* ==========================================================================
   ROUTER
   ========================================================================== */
function route(){
  var parts = location.hash.replace(/^#/,"").split("/").filter(Boolean);
  var r = parts.length ? findRegion(parts[0]) : null;
  var s = (r && parts[1]) ? findSection(parts[1]) : null;
  var view = document.getElementById("view");

  if(!r){
    document.documentElement.setAttribute("data-view","home");
    view.innerHTML = homeView();
    document.title = "Hubexo Sales Hiring Hub";
  } else if(!s){
    document.documentElement.setAttribute("data-view","region");
    view.innerHTML = regionView(themed(r));
    document.title = r.name + " — Hubexo Sales Hiring Hub";
  } else if(s.href){
    /* link-only section (Hiring Mini-Course) — bounce straight out */
    window.location.replace(s.href);
    return;
  } else {
    document.documentElement.setAttribute("data-view","section");
    view.innerHTML = sectionView(themed(r),s);
    document.title = s.title + " — " + r.name;
    if(s.key === "emails")   wireEmail(themed(r));
    if(s.key === "tracking") wireTracking(themed(r));
    if(s.key === "training") wireTraining(themed(r));
    if(s.key === "rewritten-ads") wireAds(themed(r));
    wireChecks();
  }
  wireCopy();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ==========================================================================
   WIRING
   ========================================================================== */
function wireCopy(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function(b){
    b.addEventListener("click", function(){
      var t = (window.__COPY || {})[b.getAttribute("data-copy")] || "";
      copyText(t, b, "Copied", "Copy");
    });
  });
}

function wireChecks(){
  Array.prototype.forEach.call(document.querySelectorAll("input[data-k]"), function(cb){
    var k = cb.getAttribute("data-k");
    var on = cb.style.getPropertyValue("--on") || "#321432";
    try{ if(localStorage.getItem("hx:" + k) === "1") cb.checked = true; }catch(e){}
    if(cb.checked) cb.style.background = on;
    cb.addEventListener("change", function(){
      cb.style.background = cb.checked ? on : "";
      try{ localStorage.setItem("hx:" + k, cb.checked ? "1" : "0"); }catch(e){}
    });
  });
}

function wireEmail(r){
  EM.region = r;
  emLoad();
  var valid = r.options.some(function(o){ return o.key === EM.opt; });
  if(!valid) EM.opt = (r.options[0] || {}).key;

  var box = document.getElementById("em-langs");
  function paintOpts(){
    box.innerHTML = r.options.map(function(o){
      var on = (o.key === EM.opt);
      return '<button class="langbtn' + (on ? " on" : "") + '" data-opt="' + o.key + '"' +
             (on ? ' style="background:' + grad(r) + ';color:' + r.ink + '"' : "") + '>' +
             esc(o.emLabel || o.label) + '</button>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("[data-opt]"), function(b){
      b.addEventListener("click", function(){
        EM.opt = b.getAttribute("data-opt");
        emSave(); paintOpts(); emRender();
      });
    });
  }
  paintOpts();
  emRender();

  /* a placeholder stops being red the moment it is edited */
  var out = document.getElementById("em-out");
  out.addEventListener("input", function(){
    Array.prototype.forEach.call(out.querySelectorAll("[data-ph]"), function(sp){
      if(sp.textContent.trim() !== sp.getAttribute("data-ph")){
        sp.className = sp.className.replace(/\btoken\b/, "").trim();
        sp.removeAttribute("data-ph");
      }
    });
  });

  document.getElementById("em-copy").addEventListener("click", function(){
    copyText(emText(), this, "Copied", "Copy Text");
  });
  document.getElementById("em-docx").addEventListener("click", function(){ downloadDocx("em-out"); });
  document.getElementById("em-reset").addEventListener("click", function(){
    if(!confirm("Put the template back the way it started?")) return;
    emRender();
  });
}

/* ==========================================================================
   COPY
   ========================================================================== */
function copyText(text, btn, doneLabel, restoreLabel){
  var prevBg = btn.style.background;
  function ok(){
    btn.textContent = doneLabel;
    btn.classList.add("done");
    if(!prevBg) btn.style.background = btn.style.getPropertyValue("--on") || "#321432";
    setTimeout(function(){
      btn.textContent = restoreLabel;
      btn.classList.remove("done");
      btn.style.background = prevBg;
    }, 1600);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){}
  document.body.removeChild(ta);
}

/* ==========================================================================
   Word (.docx) builder — no libraries, builds a real zip
   ========================================================================== */
var CRC_TABLE=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function sb(s){var o=[],i,cp;for(i=0;i<s.length;i++){cp=s.charCodeAt(i);
  if(cp<0x80)o.push(cp);
  else if(cp<0x800){o.push(0xC0|(cp>>6),0x80|(cp&63));}
  else if(cp>=0xD800&&cp<=0xDBFF){var lo=s.charCodeAt(++i);var u=0x10000+((cp-0xD800)<<10)+(lo-0xDC00);o.push(0xF0|(u>>18),0x80|((u>>12)&63),0x80|((u>>6)&63),0x80|(u&63));}
  else{o.push(0xE0|(cp>>12),0x80|((cp>>6)&63),0x80|(cp&63));}}
  return new Uint8Array(o);}
function zipFiles(files){
  var chunks=[],central=[],offset=0;
  function u16(n){return [n&255,(n>>8)&255];}
  function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];}
  files.forEach(function(f){
    var name=sb(f.name),data=sb(f.data),c=crc32(data);
    var lh=[].concat([80,75,3,4],u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(data.length),u32(data.length),u16(name.length),u16(0));
    chunks.push(new Uint8Array(lh),name,data);
    central.push([].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset)),name);
    offset+=lh.length+name.length+data.length;
  });
  var cd=[],cdStart=offset,cdLen=0;
  for(var i=0;i<central.length;i+=2){cd.push(new Uint8Array(central[i]),central[i+1]);}
  cd.forEach(function(b){cdLen+=b.length;});
  var eocd=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(files.length),u16(files.length),u32(cdLen),u32(cdStart),u16(0)));
  var all=chunks.concat(cd,[eocd]),total=0;
  all.forEach(function(b){total+=b.length;});
  var out=new Uint8Array(total),p=0;
  all.forEach(function(b){out.set(b,p);p+=b.length;});
  return out;
}
function xe(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");}
function wr(t,b){return '<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/>'+(b?'<w:b/>':'')+'</w:rPr><w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>';}
function wp(r,bullet){
  return '<w:p><w:pPr>'+(bullet?'<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>':'')+'<w:spacing w:after="0" w:line="259" w:lineRule="auto"/></w:pPr>'+r+'</w:p>';
}
function wblank(){return wp("");}

var DOCX_LINK = "";
function wlink(t){
  return '<w:hyperlink r:id="rIdLink"><w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>'
       + '<w:sz w:val="22"/><w:color w:val="0563C1"/><w:u w:val="single"/></w:rPr>'
       + '<w:t xml:space="preserve">' + xe(t) + '</w:t></w:r></w:hyperlink>';
}
function runsFrom(node){
  var s = "";
  Array.prototype.forEach.call(node.childNodes, function(c){
    if(c.nodeType === 3){ s += wr(c.nodeValue); return; }
    if(c.nodeType !== 1) return;
    if(c.tagName === "BR") return;
    if(c.tagName === "A"){ s += wlink(c.textContent); return; }
    if(c.tagName === "B" || c.tagName === "STRONG"){ s += wr(c.textContent, true); return; }
    s += runsFrom(c);
  });
  return s;
}
function buildDocx(id){
  /* built from what is on screen, so the reader's edits come through */
  var el = document.getElementById(id || "em-out");
  var a  = el ? el.querySelector("a[href]") : null;
  var isUrl = !!(a && /^https?:\/\//i.test(a.getAttribute("href") || ""));
  DOCX_LINK = isUrl ? a.getAttribute("href") : "";
  var b = "";
  if(el) Array.prototype.forEach.call(el.childNodes, function(n){
    if(n.nodeType !== 1) return;
    if(n.tagName === "UL"){
      Array.prototype.forEach.call(n.children, function(li){ b += wp(runsFrom(li), true); });
      return;
    }
    b += wp(runsFrom(n));
    if(String(n.className).indexOf("tight") === -1) b += wblank();
  });

  var doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>'
    + b + '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>';

  var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
    + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';

  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';

  var drels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
    + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + (isUrl ? '<Relationship Id="rIdLink" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + xe(DOCX_LINK) + '" TargetMode="External"/>' : "")
    + '</Relationships>';

  var numbering = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="&#8226;"/>'
    + '<w:lvlJc w:val="left"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr>'
    + '<w:rPr><w:rFonts w:ascii="Symbol" w:hAnsi="Symbol" w:hint="default"/></w:rPr></w:lvl></w:abstractNum>'
    + '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>';

  var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults>'
    + '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>';

  return zipFiles([
    {name:"[Content_Types].xml",     data:ct},
    {name:"_rels/.rels",             data:rels},
    {name:"word/document.xml",       data:doc},
    {name:"word/_rels/document.xml.rels", data:drels},
    {name:"word/numbering.xml",      data:numbering},
    {name:"word/styles.xml",         data:styles}
  ]);
}

function downloadDocx(id, filename){
  var bytes = buildDocx(id);
  var blob  = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  var a     = document.createElement("a");
  var name  = filename || ("Email Template - " + (emOpt().label || "BDM") + ".docx");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
}

/* ==========================================================================
   THEME
   ========================================================================== */
var SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z"/></svg>';
function paintTheme(){
  document.getElementById("theme").innerHTML =
    document.documentElement.getAttribute("data-theme") === "dark" ? SUN : MOON;
}
/* Always opens light. Dark only if the reader has toggled it on this browser. */
try{
  if(localStorage.getItem("hubexo-hub-theme") === "dark")
    document.documentElement.setAttribute("data-theme","dark");
}catch(e){}
document.getElementById("theme").addEventListener("click", function(){
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("hubexo-hub-theme", next); }catch(e){}
  paintTheme();
});

paintTheme();
route();
