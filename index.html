<!DOCTYPE html>
<html lang="en" data-theme="light" data-view="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Hubexo Sales Hiring Hub</title>
<link rel="icon" href="Assets/OS Icons/Light Blue Lushin.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   HUBEXO BRAND PALETTE
   plum #321432 · atomic yellow #DCFF3C · earth #F7F7F2
   blue #008CFF · red #E6284B · orange #FF8700 · purple #A54CFF
   ========================================================================== */
:root{
  --bg:#F7F7F2;
  --surface:#FFFFFF;
  --line:#E7E5DF;
  --ink:#321432;
  --ink-2:#6B5A6B;
  --ink-3:#9E909E;
  --hover:#EFEEE8;
  --shadow:0 1px 2px rgba(50,20,50,.05), 0 10px 28px -18px rgba(50,20,50,.4);
}
html[data-theme="dark"]{
  --bg:#1A0A1A;
  --surface:#261026;
  --line:#3C213C;
  --ink:#F7F7F2;
  --ink-2:#C4B0C4;
  --ink-3:#8F7C8F;
  --hover:#301630;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.75);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);
  color:var(--ink);
  font-family:Poppins,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

.wrap{
  width:100%;max-width:1320px;margin:0 auto;padding:26px 40px 34px;
  flex:1;display:flex;flex-direction:column;min-height:0;
}
#view{flex:1;display:flex;flex-direction:column;min-height:0;}

/* ==========================================================================
   HEADER — Hubexo primary, Lushin secondary, optically matched
   ========================================================================== */
.pagehead{display:flex;align-items:center;gap:18px;margin:0 0 26px;flex:0 0 auto;}
.marks{display:flex;align-items:center;gap:17px;}
.hx{display:block;height:23px;width:auto;color:var(--ink);}
.marks .div{width:1px;height:26px;background:var(--line);}
.lu img{height:27px;width:auto;display:block;}
.lu .dk{display:none;}
html[data-theme="dark"] .lu .lt{display:none;}
html[data-theme="dark"] .lu .dk{display:block;}

.topnav{display:flex;align-items:center;gap:2px;margin-left:auto;flex-wrap:wrap;}
.topnav a{
  padding:8px 13px;border-radius:9px;
  font-size:14px;font-weight:500;color:var(--ink-3);
  transition:background .12s ease,color .12s ease;
}
.topnav a:hover{background:var(--hover);color:var(--ink);}
.topnav a.on{color:var(--ink);font-weight:600;}

.iconbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.iconbtn:hover{background:var(--hover);color:var(--ink);}
.iconbtn svg{width:18px;height:18px;display:block;}

.page-title{
  font-size:21px;font-weight:500;letter-spacing:-.01em;
  color:var(--ink-2);margin:0 0 20px;flex:0 0 auto;
}

/* ==========================================================================
   HOME — region chooser, fills the viewport
   ========================================================================== */
.regions{
  flex:1;min-height:0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:18px;
}
.region{
  min-height:340px;border-radius:24px;
  display:flex;align-items:flex-end;
  padding:32px 28px;
  transition:transform .16s ease;
}
.region:hover{transform:translateY(-5px);}
.region .rn{
  font-size:32px;font-weight:600;letter-spacing:-.022em;line-height:1.12;
}

/* ==========================================================================
   REGION VIEW
   ========================================================================== */
.banner{border-radius:24px;padding:42px 36px;margin:0 0 26px;flex:0 0 auto;}
.banner .eyebrow{font-size:15px;font-weight:200;opacity:.82;margin:0 0 6px;}
.banner h1{font-size:46px;font-weight:600;letter-spacing:-.026em;line-height:1.08;margin:0;}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.tile{
  display:flex;align-items:center;gap:20px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:30px 28px;min-height:130px;
  transition:transform .14s ease;
}
.tile:hover{transform:translateY(-3px);}
.tile .ic{width:60px;height:60px;flex:0 0 60px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;}
.tile .ic svg{width:29px;height:29px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.tile .tn{font-size:23px;font-weight:600;letter-spacing:-.018em;line-height:1.24;color:var(--ink);}

.tiles + .tiles{margin-top:34px;}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-height:760px){
  .region{min-height:260px;}
  .region .rn{font-size:27px;}
}
@media (max-width:1180px){
  .regions{grid-template-columns:repeat(3,1fr);}
  .region{min-height:230px;}
}
@media (max-width:820px){
  body{font-size:16.5px;}
  .wrap{padding:20px 18px 40px;}
  .regions{grid-template-columns:1fr;gap:13px;}
  .region{min-height:132px;padding:22px 22px;border-radius:18px;}
  .region .rn{font-size:26px;}
  .banner{padding:30px 24px;border-radius:18px;}
  .banner h1{font-size:33px;}
  .tiles{grid-template-columns:1fr;gap:13px;}
  .tile{padding:23px 21px;min-height:0;border-radius:16px;gap:17px;}
  .tile .ic{width:52px;height:52px;flex:0 0 52px;border-radius:14px;}
  .tile .tn{font-size:20px;}
  .topnav{display:none;}
  .hx{height:20px;}
  .lu img{height:24px;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="pagehead">
    <a class="marks" href="#" title="Home">
      <svg class="hx" aria-label="Hubexo" role="img" viewBox="0 0 706 195" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M12.1223 131.296L12.0723 133.579V186.622H33.0733V133.319C33.1713 122.87 38.1203 113.565 45.7663 107.533C38.6633 105.149 32.1103 101.568 26.3423 97.026C17.9823 106.146 12.6843 118.114 12.1223 131.296Z"/><path d="M642.939 79.168C613.032 79.168 588.701 103.5 588.701 133.407C588.701 163.314 613.032 187.645 642.939 187.645C672.846 187.645 697.178 163.314 697.178 133.407C697.178 103.5 672.846 79.168 642.939 79.168ZM642.939 166.645C624.611 166.645 609.701 151.735 609.701 133.407C609.701 115.079 624.611 100.168 642.939 100.168C661.267 100.168 676.178 115.079 676.178 133.407C676.178 151.735 661.267 166.645 642.939 166.645Z"/><path d="M506.597 125.964C508.441 124.65 510.348 123.405 512.323 122.246L525.728 114.379C520.313 110.706 515.909 106.013 512.897 100.67C509.397 94.462 507.547 87.388 507.547 80.213H486.547C486.547 90.992 489.332 101.632 494.603 110.982C497.726 116.521 501.787 121.571 506.596 125.963L506.597 125.964Z"/><path d="M565.401 139.437C563.556 140.752 561.648 141.997 559.672 143.156L546.27 151.022C551.686 154.696 556.09 159.388 559.102 164.732C562.401 170.583 564.451 178.971 564.451 186.622H585.451C585.451 175.403 582.439 163.365 577.396 154.42C574.274 148.88 570.212 143.83 565.401 139.438V139.437Z"/><path d="M556.627 132.701C565.372 127.091 572.522 119.63 577.395 110.983C582.666 101.635 585.451 90.996 585.451 80.214H564.451C564.451 87.39 562.601 94.463 559.101 100.671C555.631 106.828 550.317 112.125 543.731 115.989L535.999 120.527L517.638 131.302C516.869 131.753 516.117 132.223 515.371 132.701C506.627 138.311 499.477 145.772 494.603 154.419C489.559 163.367 486.547 175.406 486.547 186.622H507.547C507.547 178.973 509.597 170.584 512.896 164.731C516.367 158.575 521.682 153.278 528.267 149.413L535.999 144.875L554.359 134.1C555.128 133.649 555.881 133.179 556.627 132.7V132.701Z"/><path d="M481.586 122.907C481.92 124.602 482.176 126.324 482.35 128.07C479.66 100.659 456.482 79.168 428.376 79.168H428.156C398.249 79.168 373.918 103.5 373.918 133.407C373.918 163.314 398.249 187.645 428.156 187.645H428.376C445.598 187.645 461.412 179.74 471.766 165.957L463.37 159.65L454.974 153.343C448.625 161.796 438.93 166.643 428.376 166.643H428.156C413.497 166.643 401.033 157.101 396.627 143.905C395.524 140.602 394.918 137.074 394.918 133.405C394.918 129.736 395.524 126.208 396.627 122.905C401.033 109.709 413.497 100.166 428.156 100.166H428.376C443.035 100.166 455.499 109.708 459.906 122.905H405.437V143.905H482.616V133.405C482.616 132.498 482.592 131.596 482.547 130.7C482.509 129.945 482.448 129.196 482.38 128.45C482.368 128.323 482.363 128.195 482.351 128.069C482.177 126.323 481.921 124.601 481.587 122.906"/><path d="M274.736 77.878V10.938H253.736V98.126C259.11 89.893 266.295 82.949 274.736 77.878Z"/><path d="M308.193 79.168H307.973C295.455 79.168 283.923 83.442 274.734 90.592C262.143 100.389 253.972 115.599 253.752 132.7C253.749 132.936 253.734 133.17 253.734 133.407V186.622H274.734V176.221C283.923 183.371 295.455 187.645 307.973 187.645H308.193C338.1 187.645 362.431 163.314 362.431 133.407C362.431 103.5 338.099 79.168 308.192 79.168H308.193ZM308.193 166.645H307.973C289.645 166.645 274.734 151.735 274.734 133.407C274.734 115.079 289.645 100.168 307.973 100.168H308.193C326.521 100.168 341.432 115.079 341.432 133.407C341.432 151.735 326.521 166.645 308.194 166.645H308.193Z"/><path d="M220.468 80.214V132.7C220.468 151.028 205.557 165.939 187.229 165.939C168.901 165.939 153.99 151.028 153.99 132.7V80.214H132.99V132.7C132.99 162.608 157.322 186.939 187.229 186.939C217.136 186.939 241.468 162.608 241.468 132.7V80.214H220.468Z"/><path d="M66.3122 79.394C57.4342 79.394 49.0862 75.936 42.8092 69.659C36.5312 63.381 33.0742 55.034 33.0742 46.155V10.21H22.5742H12.0742V46.155C12.0742 64.091 20.8302 80.013 34.2862 89.893C43.2682 96.488 54.3402 100.394 66.3122 100.394C84.6402 100.394 99.5512 115.305 99.5512 133.633V186.622H120.551V133.633C120.551 103.726 96.2192 79.394 66.3122 79.394Z"/></svg>
      <span class="div"></span>
      <span class="lu">
        <img class="lt" src="Assets/Lushin Logo Icons/Lushin Logo Blue.svg" alt="Lushin">
        <img class="dk" src="Assets/Lushin Logo Icons/Lushin Logo Icon - Arctic White.svg" alt="Lushin">
      </span>
    </a>
    <nav class="topnav" id="topnav"></nav>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
  </div>
  <div id="view"></div>
</div>

<script>
/* ==========================================================================
   TO EDIT CONTENT — everything lives in the REGIONS array below.

   Swap an OMG License link : replace that region's "omg" value with its own
                              OMG registration URL. Nothing else changes.
                              (All five point at the Lushin demo license now.)
   Add a region             : copy a whole { key, name, from, to, ink, accent }
                              block. Home tiles, top nav and routes follow.
   Change a shared link     : edit LINKS — it applies to every region.

   Colours are Hubexo's own brand palette:
     plum #321432 · atomic yellow #DCFF3C · earth #F7F7F2
     blue #008CFF · red #E6284B · orange #FF8700 · purple #A54CFF
   ========================================================================== */

const LINKS = {
  templates : "https://lushin-inc.github.io/hiring-template-creator/",
  star      : "https://lushin-inc.github.io/star/",
  interview : "https://lushin-inc.github.io/interview-guide",
  book      : "https://meetings.hubspot.com/dan210/30-mins",
  email     : "mailto:dan@lushin.com"
};

/* PLACEHOLDER — the Lushin demo license, used for all five regions for now. */
const OMG_PLACEHOLDER = "https://info.objectivemanagement.com/License.aspx?ID=2885&MI=1&bc1=Search+Licenses&bc1u=Licenses.aspx%3fstatus%3d2%26d1%3d%26d2%3d%26d%3d61%26c%3d357%26pt%3d1%26csr%3d&bc2=Assessments";

/* from/to = tile gradient · ink = text on that gradient · accent = icon colour on white */
const REGIONS = [
  { key:"uk",      name:"UK",                 from:"#008CFF", to:"#0057A8", ink:"#FFFFFF", accent:"#008CFF", omg:OMG_PLACEHOLDER },
  { key:"nordics", name:"Nordics",            from:"#A54CFF", to:"#6B21C9", ink:"#FFFFFF", accent:"#A54CFF", omg:OMG_PLACEHOLDER },
  { key:"europe",  name:"Continental Europe", from:"#E6284B", to:"#A50F2C", ink:"#FFFFFF", accent:"#E6284B", omg:OMG_PLACEHOLDER },
  { key:"apac",    name:"Asia Pacific",       from:"#FF8700", to:"#C25400", ink:"#FFFFFF", accent:"#E07600", omg:OMG_PLACEHOLDER },
  { key:"us",      name:"US",                 from:"#DCFF3C", to:"#A8CC00", ink:"#321432", accent:"#321432", omg:OMG_PLACEHOLDER }
];

const ICONS = {
  omg:'<path d="M9 3h6a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M16 4.5h2A1.5 1.5 0 0 1 19.5 6v13A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V6A1.5 1.5 0 0 1 6 4.5h2"/><path d="M8.5 12.5l2 2 4-4.5"/>',
  templates:'<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9h17M9 9v11"/>',
  star:'<path d="M12 3.6l2.6 5.3 5.9.86-4.25 4.14 1 5.86L12 17l-5.25 2.76 1-5.86L3.5 9.76l5.9-.86z"/>',
  interview:'<path d="M4 5.5h10a1.5 1.5 0 0 1 1.5 1.5v4A1.5 1.5 0 0 1 14 12.5H8L4.5 15.5V7A1.5 1.5 0 0 1 6 5.5z"/><path d="M17 9.5h1A1.5 1.5 0 0 1 19.5 11v5.5a1.5 1.5 0 0 1-1.5 1.5h-1l-3 2.5V18"/>',
  book:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/><path d="M9.5 14.5l1.8 1.8 3.4-3.6"/>',
  email:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.6 7l7.4 5.4a1.7 1.7 0 0 0 2 0L20.4 7"/>'
};

function grad(r){ return "linear-gradient(150deg," + r.from + " 0%," + r.to + " 100%)"; }
function tint(hex,a){
  const n = parseInt(hex.slice(1),16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function tile(href,icon,label,r){
  return '<a class="tile" href="' + href + '" target="_blank" rel="noopener" style="box-shadow:var(--shadow),0 16px 38px -22px ' + tint(r.from,.55) + '">' +
           '<span class="ic" style="background:' + tint(r.from,.14) + '">' +
             '<svg viewBox="0 0 24 24" style="stroke:' + r.accent + '">' + icon + '</svg>' +
           '</span><span class="tn">' + label + '</span></a>';
}

function home(){
  return '<h1 class="page-title">Hubexo Sales Hiring Hub</h1>' +
    '<div class="regions">' +
      REGIONS.map(function(r){
        return '<a class="region" href="#' + r.key + '" style="background:' + grad(r) +
               ';color:' + r.ink + ';box-shadow:0 20px 46px -22px ' + tint(r.from,.75) + '">' +
                 '<span class="rn">' + r.name + '</span></a>';
      }).join("") +
    '</div>';
}

function region(r){
  return '<div class="banner" style="background:' + grad(r) + ';color:' + r.ink +
           ';box-shadow:0 20px 46px -24px ' + tint(r.from,.7) + '">' +
           '<p class="eyebrow">Hubexo Sales Hiring Hub</p><h1>' + r.name + '</h1></div>' +
         '<div class="tiles">' +
           tile(r.omg,           ICONS.omg,       "OMG License",             r) +
           tile(LINKS.templates, ICONS.templates, "Hiring Template Creator", r) +
           tile(LINKS.star,      ICONS.star,      "STAR Training",           r) +
           tile(LINKS.interview, ICONS.interview, "Interview Guide",         r) +
         '</div>' +
         '<div class="tiles">' +
           tile(LINKS.book,  ICONS.book,  "Book Time",      r) +
           tile(LINKS.email, ICONS.email, "dan@lushin.com", r) +
         '</div>';
}

function nav(key){
  return '<a href="#"' + (key ? '' : ' class="on"') + '>Home</a>' +
    REGIONS.map(function(r){
      return '<a href="#' + r.key + '"' + (key === r.key ? ' class="on"' : '') + '>' + r.name + '</a>';
    }).join("");
}

function render(){
  const key = location.hash.replace("#","");
  const r = REGIONS.filter(function(x){ return x.key === key; })[0];
  document.documentElement.setAttribute("data-view", r ? "region" : "home");
  document.getElementById("view").innerHTML = r ? region(r) : home();
  document.getElementById("topnav").innerHTML = nav(r ? r.key : "");
  document.title = r ? r.name + " — Hubexo Sales Hiring Hub" : "Hubexo Sales Hiring Hub";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);

const SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z"/></svg>';
function paintTheme(){
  document.getElementById("theme").innerHTML =
    document.documentElement.getAttribute("data-theme") === "dark" ? SUN : MOON;
}
/* Always opens light. Dark only if the reader has toggled it on this browser. */
try{
  const saved = localStorage.getItem("hubexo-hub-theme");
  if(saved === "dark") document.documentElement.setAttribute("data-theme","dark");
}catch(e){}
document.getElementById("theme").addEventListener("click", function(){
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("hubexo-hub-theme", next); }catch(e){}
  paintTheme();
});

paintTheme();
render();
</script>
</body>
</html>
