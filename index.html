<!DOCTYPE html>
<html lang="en" data-theme="light" data-view="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Hubexo Sales Hiring Hub</title>
<link rel="icon" href="Assets/OS Icons/Light Blue Lushin.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   HUBEXO BRAND PALETTE
   plum #321432 · atomic yellow #DCFF3C · earth #F7F7F2
   blue #008CFF · red #E6284B · orange #FF8700 · purple #A54CFF
   ========================================================================== */
:root{
  --bg:#F7F7F2;
  --surface:#FFFFFF;
  --plate:#FFFFFF;
  --line:#E7E5DF;
  --line-soft:#F0EFE9;
  --ink:#321432;
  --ink-2:#6B5A6B;
  --ink-3:#9E909E;
  --hover:#EFEEE8;
  --shadow:0 1px 2px rgba(50,20,50,.05), 0 10px 28px -18px rgba(50,20,50,.4);
}
html[data-theme="dark"]{
  --bg:#1A0A1A;
  --surface:#261026;
  --plate:#FFFFFF;
  --line:#3C213C;
  --line-soft:#2E162E;
  --ink:#F7F7F2;
  --ink-2:#C4B0C4;
  --ink-3:#8F7C8F;
  --hover:#301630;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.75);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:Poppins,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

.wrap{
  width:100%;max-width:min(1900px,94vw);margin:0 auto;padding:26px 40px 40px;
  flex:1;display:flex;flex-direction:column;min-height:0;
}
#view{flex:1;display:flex;flex-direction:column;min-height:0;}
html[data-view="home"] #view{justify-content:center;padding-bottom:3vh;}
/* section pages read like documents — hold them to a comfortable measure */
html[data-view="section"] .wrap{max-width:min(1120px,94vw);}

/* ==========================================================================
   HEADER
   ========================================================================== */
.pagehead{display:flex;align-items:center;gap:18px;margin:0 0 26px;flex:0 0 auto;}
.marks{display:flex;align-items:center;gap:17px;}
.hx{display:block;height:23px;width:auto;color:var(--ink);}
.marks .div{width:1px;height:26px;background:var(--line);}
.lu img{height:27px;width:auto;display:block;}
.lu .dk{display:none;}
html[data-theme="dark"] .lu .lt{display:none;}
html[data-theme="dark"] .lu .dk{display:block;}

.iconbtn{
  margin-left:auto;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.iconbtn:hover{background:var(--hover);color:var(--ink);}
.iconbtn svg{width:18px;height:18px;display:block;}

.page-title{
  font-size:21px;font-weight:500;letter-spacing:-.01em;
  color:var(--ink-2);margin:0 0 20px;flex:0 0 auto;
}

/* ==========================================================================
   HOME — region chooser
   ========================================================================== */
.regions{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;}
.region{
  aspect-ratio:5/7;max-height:68vh;border-radius:24px;
  display:flex;align-items:flex-end;padding:30px 26px;
  transition:transform .16s ease;
}
.region:hover{transform:translateY(-5px);}
.region .rn{font-size:32px;font-weight:600;letter-spacing:-.022em;line-height:1.12;}

/* ==========================================================================
   BANNER — region + section headers
   ========================================================================== */
.banner{border-radius:24px;padding:42px 36px;margin:0 0 26px;flex:0 0 auto;}
.banner .eyebrow{font-size:15px;font-weight:200;opacity:.82;margin:0 0 6px;}
.banner h1{font-size:46px;font-weight:600;letter-spacing:-.026em;line-height:1.08;margin:0;}
.banner.sec{padding:30px 32px;}
.banner.sec h1{font-size:34px;}

.backlink{
  display:inline-flex;align-items:center;gap:8px;
  font-size:14.5px;font-weight:400;color:var(--ink-3);
  margin:0 0 18px;transition:color .12s ease;
}
.backlink:hover{color:var(--ink);}
.backlink svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ==========================================================================
   REGION PAGE — assessment buttons + nav tiles
   ========================================================================== */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 30px;}
.role{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-radius:16px;padding:22px 26px;
  color:#fff;font-size:19px;font-weight:600;letter-spacing:-.012em;
  transition:transform .14s ease,filter .14s ease;
}
.role:hover{transform:translateY(-3px);filter:brightness(1.06);}
.role svg{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8;}

.navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.navtile{
  background:var(--plate);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  display:flex;align-items:center;justify-content:center;
  min-height:168px;
  box-shadow:var(--shadow);
  transition:transform .14s ease,box-shadow .14s ease;
}
.navtile:hover{transform:translateY(-4px);}
.navtile img{width:100%;max-width:300px;height:auto;display:block;}
.navtile.wide{
  grid-column:1/-1;min-height:0;padding:26px 30px;
  justify-content:flex-start;gap:22px;
  background:var(--surface);
}
.navtile.wide .ic{
  width:58px;height:58px;flex:0 0 58px;border-radius:15px;
  display:inline-flex;align-items:center;justify-content:center;
}
.navtile.wide .ic svg{width:28px;height:28px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.navtile.wide .tn{font-size:23px;font-weight:600;letter-spacing:-.018em;color:var(--ink);}

/* ==========================================================================
   SECTION PAGE — document styling
   ========================================================================== */
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:30px 34px;margin-bottom:18px;
  box-shadow:var(--shadow);
}
.panel h2{
  font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25;
  margin:0 0 18px;color:var(--ink);
}
.panel h3{
  font-size:17px;font-weight:600;letter-spacing:-.01em;
  margin:24px 0 10px;color:var(--ink);
}
.panel h3:first-child{margin-top:0;}
.panel p{font-size:16.5px;line-height:1.68;color:var(--ink-2);margin:0 0 14px;}
.panel p:last-child{margin-bottom:0;}
.panel ul{margin:0 0 14px;padding-left:22px;}
.panel li{font-size:16.5px;line-height:1.68;color:var(--ink-2);margin-bottom:8px;padding-left:4px;}
.panel li::marker{color:var(--ink-3);}
.panel strong{font-weight:600;color:var(--ink);}
.panel a.inline{border-bottom:1.5px solid currentColor;padding-bottom:1px;font-weight:500;}

.lead{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 22px;}

/* ---- Process Checklist outline ---- */
.outline{margin:0;padding-left:26px;}
.outline > li{
  font-size:17.5px;line-height:1.55;color:var(--ink);
  margin:0 0 22px;padding-left:6px;
}
.outline > li:last-child{margin-bottom:0;}
.outline > li::marker{color:var(--ink-3);font-weight:600;}
.outline .o1{font-weight:600;color:var(--ink);}
.outline .o-note{font-weight:400;color:var(--ink-3);font-size:15.5px;}
.outline ul{list-style:none;margin:10px 0 0;padding-left:0;}
.outline ul li{
  position:relative;
  font-size:16.5px;line-height:1.6;font-weight:400;color:var(--ink-2);
  margin:0 0 7px;padding-left:18px;
}
.outline ul li::before{
  content:"";position:absolute;left:2px;top:.72em;
  width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.55;
}
.outline ul ul{margin-top:6px;}
.outline ul ul li{font-size:15.5px;color:var(--ink-3);}
a.lnk{
  display:inline-block;
  font-size:13px;font-weight:600;letter-spacing:.01em;
  padding:1px 9px 2px;margin-left:4px;
  border:1.5px solid;border-radius:999px;
  vertical-align:1px;
}
a.lnk:hover{filter:brightness(.88);}

/* numbered steps */
.step{display:flex;gap:20px;padding:22px 0;}
.step + .step{border-top:1px solid var(--line-soft);}
.step:first-child{padding-top:0;}
.step:last-child{padding-bottom:0;}
.step .num{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:#fff;
}
.step .sb{min-width:0;flex:1;}
.step .sb h3{margin-top:0;}

/* checklist */
.check{display:flex;gap:14px;align-items:flex-start;padding:11px 0;cursor:pointer;}
.check + .check{border-top:1px solid var(--line-soft);}
.check input{
  appearance:none;-webkit-appearance:none;
  width:21px;height:21px;flex:0 0 21px;margin:3px 0 0;
  border:1.7px solid var(--ink-3);border-radius:6px;background:var(--surface);
  cursor:pointer;transition:background .13s ease,border-color .13s ease;
}
.check input:checked{border-color:transparent;}
.check input:checked::after{
  content:"";display:block;width:5px;height:10px;margin:2px 0 0 6px;
  border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(43deg);
}
.check span{font-size:16.5px;line-height:1.6;color:var(--ink-2);}
.check input:checked ~ span{color:var(--ink-3);text-decoration:line-through;}
.check input:checked ~ span strong{color:var(--ink-3);font-weight:500;}
.check .sub{display:block;font-size:14.5px;color:var(--ink-3);margin-top:3px;}

/* collapsible */
.fold{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.fold > summary{
  list-style:none;cursor:pointer;padding:16px 20px;
  font-size:16px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;gap:11px;
}
.fold > summary::-webkit-details-marker{display:none;}
.fold > summary::after{
  content:"";margin-left:auto;width:9px;height:9px;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);
  transform:rotate(45deg);transition:transform .18s ease;
}
.fold[open] > summary::after{transform:rotate(-135deg);}
.fold .foldbody{padding:2px 20px 20px;}
.fold .foldbody > :last-child{margin-bottom:0;}

/* copyable block */
.copyblock{margin-bottom:16px;}
.copyblock .cbhead{
  display:flex;align-items:center;gap:12px;margin-bottom:8px;
}
.copyblock .cblabel{font-size:14px;font-weight:500;color:var(--ink-3);}
.copybtn{
  margin-left:auto;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);border-radius:9px;padding:7px 14px;
  font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.copybtn:hover{background:var(--hover);color:var(--ink);}
.copybtn.done{color:#fff;border-color:transparent;}
.pre{
  background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;font-size:15.5px;line-height:1.62;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word;
}

/* callout */
.note{
  border-radius:14px;padding:20px 22px;margin-bottom:16px;
  font-size:16px;line-height:1.62;
}
.note strong{font-weight:600;}

/* table */
.tblwrap{overflow-x:auto;margin-bottom:16px;}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15.5px;}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);}
th{font-weight:600;color:var(--ink);font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;}

/* big outbound card */
.bigcard{
  display:flex;align-items:center;gap:22px;
  border-radius:20px;padding:34px;color:#fff;
  transition:transform .14s ease;
}
.bigcard:hover{transform:translateY(-3px);}
.bigcard .bt{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.bigcard .bs{display:block;font-size:15px;opacity:.85;margin-top:4px;}
.bigcard svg{width:26px;height:26px;flex:0 0 26px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ==========================================================================
   EMAIL TEMPLATE BUILDER
   ========================================================================== */
.langrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px;}
.langbtn{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:13px;padding:15px 12px;font-size:16px;font-weight:500;
  cursor:pointer;transition:all .13s ease;
}
.langbtn:hover{background:var(--hover);color:var(--ink);}
.langbtn.on{color:#fff;border-color:transparent;font-weight:600;}

label{display:block;font-size:13.5px;font-weight:500;color:var(--ink);margin:0 0 8px;}
.field{margin-bottom:22px;}
input[type=text]{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  padding:15px 17px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surface);transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus{outline:none;}
input[type=text]::placeholder{color:var(--ink-3);}

.btn{
  display:block;width:100%;font-family:inherit;font-size:17px;font-weight:500;
  padding:19px 24px;border:none;border-radius:999px;cursor:pointer;
  transition:transform .12s,filter .18s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{color:#fff;margin-top:8px;}
.btn-primary:hover{filter:brightness(1.07);}
.btn-outline{color:var(--ink);background:var(--surface);border:1.5px solid var(--line);}
.btn-outline:hover{background:var(--hover);}

.doc{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:28px 30px;}
.doc .body{font-size:15.5px;line-height:1.68;color:var(--ink-2);}
.doc .body p{margin:0 0 15px;}
.doc .body p.tight{margin:0 0 4px;}
.doc .body b{font-weight:600;color:var(--ink);}
.doc .body ul{margin:6px 0 15px;padding-left:22px;}
.doc .body li{margin-bottom:5px;}
.doc .body a{color:#008CFF;word-break:break-all;}
.missing,.token{
  background:rgba(230,40,75,.13);color:#E6284B;
  border-radius:4px;padding:1px 5px;font-weight:500;
}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:26px;}
.hidden{display:none;}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-height:820px){ .region .rn{font-size:28px;} }
@media (max-width:1180px){
  .regions{grid-template-columns:repeat(3,1fr);}
  .region{aspect-ratio:4/3;max-height:none;}
  .navgrid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:820px){
  body{font-size:16.5px;}
  .wrap{padding:20px 18px 40px;}
  .regions{grid-template-columns:1fr;gap:13px;}
  .region{aspect-ratio:auto;min-height:120px;padding:22px 22px;border-radius:18px;}
  .region .rn{font-size:26px;}
  .banner{padding:30px 24px;border-radius:18px;}
  .banner h1{font-size:33px;}
  .banner.sec h1{font-size:27px;}
  .roles{grid-template-columns:1fr;gap:11px;}
  .role{padding:19px 22px;font-size:17.5px;}
  .navgrid{grid-template-columns:1fr;gap:14px;}
  .navtile{min-height:132px;border-radius:16px;}
  .navtile.wide{padding:22px;gap:17px;}
  .navtile.wide .ic{width:50px;height:50px;flex:0 0 50px;border-radius:13px;}
  .navtile.wide .tn{font-size:20px;}
  .panel{padding:24px 22px;border-radius:16px;}
  .panel h2{font-size:21px;}
  .bigcard{padding:26px;gap:16px;}
  .bigcard .bt{font-size:22px;}
  .langrow{grid-template-columns:1fr;gap:10px;}
  .step{gap:15px;}
  .hx{height:20px;}
  .lu img{height:24px;}
}
@media print{
  .pagehead,.backlink,.copybtn,.actions{display:none!important;}
  .panel{box-shadow:none;break-inside:avoid;}
}
</style>
</head>

/* ==========================================================================

function grad(r){ return "linear-gradient(150deg," + r.from + " 0%," + r.to + " 100%)"; }
function tint(hex,a){
  var n = parseInt(hex.slice(1),16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
var ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h13M12.5 6l6 6-6 6"/></svg>';
var BACK  = '<svg viewBox="0 0 24 24"><path d="M19 12H6M11.5 6l-6 6 6 6"/></svg>';

/* panel with a coloured left accent */
function panel(inner){ return '<div class="panel">' + inner + '</div>'; }

function note(r,inner){
  return '<div class="note" style="background:' + tint(r.from,.10) +
         ';border-left:4px solid ' + r.accent + '">' + inner + '</div>';
}

function steps(r,list){
  return list.map(function(s,i){
    return '<div class="step">' +
      '<span class="num" style="background:' + grad(r) + '">' + (i+1) + '</span>' +
      '<div class="sb"><h3>' + s.h + '</h3>' + s.b + '</div></div>';
  }).join("");
}

function checklist(r,id,list){
  return '<div data-check="' + id + '">' + list.map(function(c,i){
    return '<label class="check">' +
      '<input type="checkbox" data-k="' + id + ':' + i + '" style="--on:' + (r.accentText||r.accent) + '">' +
      '<span>' + c.t + (c.s ? '<span class="sub">' + c.s + '</span>' : '') + '</span></label>';
  }).join("") + '</div>';
}

function fold(label,inner,open){
  return '<details class="fold"' + (open ? ' open' : '') + '><summary>' + label + '</summary>' +
         '<div class="foldbody">' + inner + '</div></details>';
}

function copyblock(r,label,text){
  var id = "cb" + (copyblock._n = (copyblock._n||0) + 1);
  window.__COPY = window.__COPY || {};
  window.__COPY[id] = text;
  return '<div class="copyblock"><div class="cbhead"><span class="cblabel">' + label + '</span>' +
    '<button class="copybtn" data-copy="' + id + '" style="--on:' + (r.accentText||r.accent) + '">Copy</button></div>' +
    '<div class="pre">' + esc(text) + '</div></div>';
}

function bigcard(r,href,title,sub){
  return '<a class="bigcard" href="' + href + '" target="_blank" rel="noopener" ' +
    'style="background:' + grad(r) + ';color:' + r.ink +
    ';box-shadow:0 18px 40px -22px ' + tint(r.from,.7) + '">' +
    '<span><span class="bt">' + title + '</span><span class="bs">' + sub + '</span></span>' + ARROW + '</a>';
}

var COMPANY    = "Hubexo";

var STORE      = "hubexoEmailV1";

var EM = { opt:null, region:null, data:{} };

function emFill(s,v){
  return String(s).replace(/\{name\}/g, v.name).replace(/\{company\}/g, v.company)
                  .replace(/\{job\}/g, v.job);
}
function emVals(){
  /* Read the live input when the form is on screen; fall back to the values
     saved on "Open Template", since the preview view replaces the form. */
  function g(id,ph){
    var el = document.getElementById(id);
    var t  = el ? (el.value||"").trim() : (EM.data[id] || "").trim();
    return {v: t || ph, blank: !t};
  }
  var job    = g("em-job","[JOB TITLE]");
  var link   = g("em-link","[ASSESSMENT LINK]");
  var sender = g("em-sender","[SENDER NAME]");
  return {
    job:job.v, job_blank:job.blank,
    link:link.v, link_blank:link.blank,
    sender:sender.v, sender_blank:sender.blank,
    name:NAME_TOKEN, company:COMPANY
  };
}
function emSave(){
  ["em-job","em-link","em-sender"].forEach(function(id){
    var el = document.getElementById(id);
    if(el) EM.data[id] = el.value || "";
  });
  try{
    localStorage.setItem(STORE, JSON.stringify({
      job:    EM.data["em-job"]    || "",
      sender: EM.data["em-sender"] || "",
      opt:    EM.opt
    }));
  }catch(e){}
}
function emLoad(){
  try{
    var o = JSON.parse(localStorage.getItem(STORE) || "{}");
    if(o.job    && document.getElementById("em-job"))    document.getElementById("em-job").value = o.job;
    if(o.sender && document.getElementById("em-sender")) document.getElementById("em-sender").value = o.sender;
    if(o.opt) EM.opt = o.opt;
    if(o.job)    EM.data["em-job"]    = o.job;
    if(o.sender) EM.data["em-sender"] = o.sender;
  }catch(e){}
}

function route(){
  var parts = location.hash.replace(/^#/,"").split("/").filter(Boolean);
  var r = parts.length ? findRegion(parts[0]) : null;
  var s = (r && parts[1]) ? findSection(parts[1]) : null;
  var view = document.getElementById("view");

  if(!r){
    document.documentElement.setAttribute("data-view","home");
    view.innerHTML = homeView();
    document.title = "Hubexo Sales Hiring Hub";
  } else if(!s){
    document.documentElement.setAttribute("data-view","region");
    view.innerHTML = regionView(themed(r));
    document.title = r.name + " — Hubexo Sales Hiring Hub";
  } else if(s.href){
    /* link-only section (Hiring Mini-Course) — bounce straight out */
    window.location.replace(s.href);
    return;
  } else {
    document.documentElement.setAttribute("data-view","section");
    view.innerHTML = sectionView(themed(r),s);
    document.title = s.title + " — " + r.name;
    if(s.key === "emails") wireEmail(themed(r));
    wireChecks();
  }
  wireCopy();
  window.scrollTo(0,0);
}

  Array.prototype.forEach.call(document.querySelectorAll("input[data-k]"), function(cb){

function wireEmail(r){

  }
}

/* ==========================================================================
   COPY
   ========================================================================== */
function copyText(text, btn, doneLabel, restoreLabel){
  var prevBg = btn.style.background;
  function ok(){
    btn.textContent = doneLabel;
    btn.classList.add("done");
    if(!prevBg) btn.style.background = btn.style.getPropertyValue("--on") || "#321432";
    setTimeout(function(){
      btn.textContent = restoreLabel;
      btn.classList.remove("done");
      btn.style.background = prevBg;
    }, 1600);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){}
  document.body.removeChild(ta);
}

var CRC_TABLE=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function sb(s){var o=[],i,cp;for(i=0;i<s.length;i++){cp=s.charCodeAt(i);
  if(cp<0x80)o.push(cp);
  else if(cp<0x800){o.push(0xC0|(cp>>6),0x80|(cp&63));}

function xe(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");}
function wr(t,b){return '<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/>'+(b?'<w:b/>':'')+'</w:rPr><w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>';}

function wblank(){return wp("");}

function buildDocx(){
  var T = emCopy(), v = emVals();
  var isUrl = /^https?:\/\//i.test(v.link);
  var b = "";
  b += wp(wr(T.subjectLabel,true));
  b += wp(wr(T.subject));
  b += wblank();
  b += wp(wr(T.emailLabel,true));
  b += wblank();
  b += wp(wr(emFill(T.greet,v)));
  b += wblank();
  b += wp(wr(emFill(T.thanks,v)));
  b += wblank();
  b += wp(wr(T.review));
  b += wblank();
  b += wp(wr(T.nextH,true));
  b += wblank();
  b += wp(wr(T.nextP));
  b += wblank();
  b += wp(wr(T.tipsH,true));
  T.tips.forEach(function(x){ b += wp(wr(x),true); });
  b += wblank();
  b += wp(wr(T.linkH,true));
  b += wblank();
  if(isUrl){
    b += '<w:p><w:pPr><w:spacing w:after="0" w:line="259" w:lineRule="auto"/></w:pPr><w:hyperlink r:id="rIdLink">'
      + '<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/><w:color w:val="0563C1"/><w:u w:val="single"/></w:rPr>'
      + '<w:t xml:space="preserve">' + xe(v.link) + '</w:t></w:r></w:hyperlink></w:p>';
  } else { b += wp(wr(v.link)); }
  b += wblank();
  b += wp(wr(T.byH,true));
  b += wblank();
  b += wp(wr(T.byP));
  b += wblank();
  b += wp(wr(T.after));
  b += wblank();
  b += wp(wr(emFill(T.closeP,v)));
  b += wblank();
  b += wp(wr(T.best));
  b += wp(wr(v.sender));

  var doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>'
    + b + '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>';

  var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
    + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';

  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';

  var drels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
    + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + (isUrl ? '<Relationship Id="rIdLink" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + xe(v.link) + '" TargetMode="External"/>' : "")
    + '</Relationships>';

  var numbering = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="&#8226;"/>'
    + '<w:lvlJc w:val="left"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr>'
    + '<w:rPr><w:rFonts w:ascii="Symbol" w:hAnsi="Symbol" w:hint="default"/></w:rPr></w:lvl></w:abstractNum>'
    + '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>';

  var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults>'
    + '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>';

  return zipFiles([
    {name:"[Content_Types].xml",     data:ct},
    {name:"_rels/.rels",             data:rels},
    {name:"word/document.xml",       data:doc},
    {name:"word/_rels/document.xml.rels", data:drels},
    {name:"word/numbering.xml",      data:numbering},
    {name:"word/styles.xml",         data:styles}
  ]);
}

function downloadDocx(){
  var bytes = buildDocx();
  var blob  = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  var a     = document.createElement("a");
  var name  = "Email Template - " + (emOpt().label || "BDM") + ".docx";
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
}

    document.documentElement.getAttribute("data-theme") === "dark" ? SUN : MOON;

/* Always opens light. Dark only if the reader has toggled it on this browser. */
try{
  if(localStorage.getItem("hubexo-hub-theme") === "dark")
    document.documentElement.setAttribute("data-theme","dark");
}catch(e){}

  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("hubexo-hub-theme", next); }catch(e){}
  paintTheme();
});

paintTheme();
route();
